name: "BENCH-01 — Extract adaptive replay review evidence"

on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - ".github/workflows/bench01-adaptive-review-extract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Extract compact whole-deck review evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'test-results/bench01-adaptive-diversification-replay/result.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const outDir = 'test-results/bench01-adaptive-diversification-replay/review';
          fs.mkdirSync(outDir, { recursive: true });
          const compact = {
            schema: data.schema,
            batch: data.batch,
            productRuntimeBaselineSha: data.productRuntimeBaselineSha,
            sourceFrozenWithinBatch: data.sourceFrozenWithinBatch,
            adaptiveContractRequired: data.adaptiveContractRequired,
            results: data.results.map((r) => ({
              fixture: r.fixture,
              family: r.family,
              reference: r.reference,
              themeQuery: r.themeQuery,
              totalSwaps: r.totalSwaps,
              assessedBracket: r.assessedBracket,
              adaptiveContract: r.adaptiveContract,
              priorBreadthEvidence: r.priorBreadthEvidence,
              before: r.before,
              after: r.after,
              terminalRound: r.terminalRound,
              candidateWork: r.candidateWork,
              acceptedSwaps: Array.isArray(r.rawRefinement?.swaps) ? r.rawRefinement.swaps : null,
            })),
          };
          fs.writeFileSync(`${outDir}/summary.json`, JSON.stringify(compact, null, 2) + '\n');
          for (const r of data.results) {
            const id = String(r.reference).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            const deck = r.rawRefinement?.finalDecklist;
            if (typeof deck === 'string' && deck.trim()) fs.writeFileSync(`${outDir}/${id}-final-deck.txt`, deck.trim() + '\n');
          }
          NODE
      - name: Persist review evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test-results/bench01-adaptive-diversification-replay/review
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test-results(BENCH-01): persist adaptive replay review evidence [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1
