name: Counter Blitz A20 Two-Card Package Pressure

on:
  push:
    branches:
      - test/counter-blitz-a20-package-pressure-20260829
  workflow_dispatch:

jobs:
  validate-a20:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run full test suite
        run: npm test
      - name: Run A20 two-card package pressure
        run: npx tsx scripts/e2e-counter-blitz-a20-package-pressure.ts
      - name: Upload A20 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-blitz-a20-evidence-${{ github.sha }}
          path: |
            counter-blitz-a20-result.json
            counter-blitz-a20-leader.txt
          if-no-files-found: warn
