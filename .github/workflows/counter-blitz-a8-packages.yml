name: Counter Blitz A8 Targeted Packages

on:
  push:
    branches:
      - test/counter-blitz-a8-targeted-packages-20260829
    paths:
      - scripts/e2e-counter-blitz-a8-packages.ts
      - .github/workflows/counter-blitz-a8-packages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run A8 package search
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/e2e-counter-blitz-a8-packages.ts | tee counter-blitz-a8.log
      - name: Upload A8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-blitz-a8-${{ github.sha }}
          path: |
            counter-blitz-a8.log
            counter-blitz-a8-result.json
            counter-blitz-a8-deck.txt
            counter-blitz-a8-failure.txt
          if-no-files-found: ignore
          retention-days: 14
