name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type-check project-management tooling
        run: npm run project:typecheck

      - name: Validate project-management state
        run: npm run project:validate

      - name: Validate consolidated validation index
        run: npm run validation:validate

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-test-output-${{ github.sha }}
          path: test-output.log
          if-no-files-found: warn
          retention-days: 7
