name: Apply BENCH-01 substantive identity source edit

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/apply-bench01-substantive-identity-source.yml

permissions:
  contents: write

jobs:
  apply-source-edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v15-native-deck-intelligence
          fetch-depth: 0

      - name: Narrow identity affinity to substantive strategy evidence
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/services/deck-builder-v07.ts')
          text = p.read_text()
          anchor = "  return replacementIdentityPriorityV15(\n"
          insert = "  const substantiveScore = (affinity: UpgradeStrategyAffinityEvidenceV15): number => (\n    [...affinity.scoreByStrategy.entries()].reduce((sum, [strategy, score]) => (\n      (affinity.commanderScoreByStrategy.get(strategy) ?? 0) >= SUBSTANTIVE_COMMANDER_STRATEGY_SCORE_V15\n        ? sum + score\n        : sum\n    ), 0)\n  );\n  return replacementIdentityPriorityV15(\n"
          function_start = text.index('function upgradeSwapReplacementIdentityPriorityV15(')
          function_end = text.index('\n}\n\nfunction upgradeSwapSubstantiveStrategyLossScoreV15', function_start)
          before = text[:function_start]
          block = text[function_start:function_end]
          after = text[function_end:]
          if 'const substantiveScore =' not in block:
              if anchor not in block:
                  raise SystemExit('identity return anchor missing')
              block = block.replace(anchor, insert, 1)
          block = block.replace('substantiveStrategyAffinity: addAffinity.score,', 'substantiveStrategyAffinity: substantiveScore(addAffinity),', 1)
          block = block.replace('substantiveStrategyAffinity: cutAffinity.score,', 'substantiveStrategyAffinity: substantiveScore(cutAffinity),', 1)
          p.write_text(before + block + after)

      - name: Remove one-shot transport and commit source
        run: |
          rm .github/workflows/apply-bench01-substantive-identity-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/deck-builder-v07.ts .github/workflows/apply-bench01-substantive-identity-source.yml
          git commit -m "fix(INTEL-02): use substantive affinity for identity ranking"
          git push origin HEAD:agent/v15-native-deck-intelligence
