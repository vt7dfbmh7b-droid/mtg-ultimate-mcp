name: Scions & Spellcraft A5 Combo Support Refinement

on:
  push:
    branches:
      - test/scions-spellcraft-a5-combo-support-refinement-20260831
  workflow_dispatch:

jobs:
  scions-a5-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run A5 support refinement
        run: npx tsx scripts/e2e-scions-spellcraft-a5-combo-support-refinement.ts
      - name: Upload A5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scions-spellcraft-a5-combo-support-refinement-${{ github.sha }}
          retention-days: 90
          path: |
            scions-spellcraft-a5-combo-support-refinement.json
            scions-spellcraft-a5-combo-support-refinement.md
