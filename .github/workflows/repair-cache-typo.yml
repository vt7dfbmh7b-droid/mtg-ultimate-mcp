name: Repair cache typo

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact repair and self-clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/services/deck-builder-v07.ts')
          text = source.read_text()
          old = 'const printing = await eligibleCardPrinting(card, policy, priceCap, printingCache);'
          new = 'const printing = await eligibleCardPrinting(card, policy, priceCap, cache);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one cache typo, found {count}')
          source.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/repair-cache-typo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/deck-builder-v07.ts
          git diff --cached --check
          git commit -m "fix: restore basic printing cache argument [skip ci]"
          git push origin HEAD:agent/v15-native-deck-intelligence
