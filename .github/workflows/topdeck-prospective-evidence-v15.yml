name: TopDeck Prospective Evidence V0.15

on:
  workflow_dispatch:
    inputs:
      tournament_id:
        description: TopDeck tournament ID to capture
        required: true
        type: string
      phase:
        description: Capture exact decks before start, provider end timing, or exact completed result
        required: true
        type: choice
        options:
          - pre-event
          - event-end
          - completed-event

permissions:
  contents: read

jobs:
  registration-only:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Default-branch registration stub only. Run with ref agent/package-probabilities."
          exit 1
