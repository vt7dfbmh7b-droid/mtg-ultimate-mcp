name: Counter Blitz A9 Combat Access

on:
  push:
    branches:
      - test/counter-blitz-a9-combat-access-20260829
    paths:
      - scripts/patch-a9-counter-combat-access.mjs
      - scripts/e2e-a9-counter-combat-access.ts
      - .github/workflows/counter-blitz-a9-combat-access.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combat-access:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm ci
      - name: Apply generic counter/combat-access semantics
        run: node scripts/patch-a9-counter-combat-access.mjs
      - name: Build
        run: npm run build
      - name: Run strict actual-card A9 regressions
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/e2e-a9-counter-combat-access.ts | tee a9-combat-access.log
      - name: Re-run targeted A8 packages with A9 semantics
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/e2e-counter-blitz-a8-packages.ts | tee a9-packages.log
      - name: Commit tested semantic repair to isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/services/scryfall.ts src/services/neutral-commander-selection-v15.ts
          if git diff --cached --quiet; then
            echo "No semantic source changes to commit."
          else
            git commit -m "fix: recognize counter-driven combat access in A9"
            git push origin HEAD:test/counter-blitz-a9-combat-access-20260829
          fi
      - name: Upload A9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-blitz-a9-${{ github.sha }}
          path: |
            a9-combat-access.log
            a9-packages.log
            counter-blitz-a8-result.json
            counter-blitz-a8-deck.txt
            counter-blitz-a8-failure.txt
          if-no-files-found: ignore
          retention-days: 14
