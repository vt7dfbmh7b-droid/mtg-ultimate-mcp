name: V0.15 Live Research Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Run V0.15 live research smoke
        run: npx tsx scripts/live-research-v15.ts
