name: V0.15 Live Research Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Run V0.15 live research smoke
        run: npx tsx scripts/live-research-v15.ts
