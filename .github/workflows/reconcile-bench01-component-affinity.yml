name: Reconcile BENCH-01 component-affinity verdict

on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - ".github/workflows/reconcile-bench01-component-affinity.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/v15-native-deck-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Reconcile authoritative BENCH-01 state
        shell: python
        run: |
          import json
          from pathlib import Path

          p = Path('project-state.json')
          state = json.loads(p.read_text())
          state['updatedAt'] = '2026-09-06T18:45:00.000Z'
          exp = state['experimental']
          exp['developmentCheckpointSha'] = '90eae44f0fca63f51d82f2e05c1e656492a9b768'
          exp['developmentCheckpointNote'] = (
            'The latest accepted fully validated Commander product remains e17b0a1cba659b229fd6f0b6e2df79c5e464a616. '
            'The generic advisory incoming-theme-priority repair is immutable-validation green at '
            '2c5bbcebb49c6dab23abcb84acf4968f9741db3b and was replayed from that exact frozen src/** across '
            'Quick Draw, Virtue and Valor, Explorers of the Deep, Elven Empire and Animated Army, with evidence persisted '
            'at 36f6734e8f7b02dd24237aecb032379c0dd5cf4b and manual verdict at '
            'test-results/bench01-strategy-anchor-replay/manual-verdict-2c5bbceb.md. Mandatory whole-deck review rejected the lineage: '
            'binary membership in the union of compound-theme components still admits identity-poor generic cards, while Animated Army '
            'regresses to zero accepted swaps. The next justified generic capability is component-aware advisory theme affinity: '
            'rank role-compatible candidates by support for defining and/or underrepresented requested components rather than treating any-component membership as equivalent.'
          )
          state['workMode']['reason'] = (
            'BENCH-01 remains active. Frozen source 2c5bbceb... is formally green but manually rejected across the five-fixture repair replay. '
            'The binary any-component theme preference is too coarse for compound Commander identities. The next product action is the smallest '
            'generic component-aware advisory candidate affinity, followed by focused regressions, full immutable validation, and a frozen multi-fixture replay.'
          )
          state['validation']['activeBranchStatus'] = 'bench01-component-aware-theme-affinity-repair-needed'
          required = [x for x in state['validation']['requiredBeforeResumingIntelligenceClaims'] if not (
            'incoming-candidate theme priority after the floor is justified' in x
            or 'Require focused regressions plus the full repository check before committing the repair' in x
            or 'repeated replacement-quality defect is centralized incoming-candidate ordering' in x
          )]
          required.extend([
            'Treat immutable-validation-green source 2c5bbcebb49c6dab23abcb84acf4968f9741db3b and replay evidence 36f6734e8f7b02dd24237aecb032379c0dd5cf4b as manually rejected Commander product evidence; do not promote it over e17b0a1cba659b229fd6f0b6e2df79c5e464a616.',
            'The repeated replacement-quality defect is now narrower: binary membership in the union of requested compound-theme components cannot distinguish defining identity components from broad support components such as draw, interaction, counters or combat.',
            'A generic component-aware advisory candidate affinity is justified across spellslinger, enchantment-combat, Merfolk typal and Elf typal evidence; it must remain role-compatible and advisory, preserve structural fallback, and must not become a hard freeze or fixture/card exception.',
            'Require focused generic regressions spanning spellslinger, enchantment, Merfolk, Elf and artifact/enchantment compound cases plus the full immutable repository check before freezing any new repair SHA; then replay contrasting fixtures unchanged and manually inspect complete decks.'
          ])
          state['validation']['requiredBeforeResumingIntelligenceClaims'] = required
          state['nextActions'] = [
            'Design the smallest generic component-aware advisory theme-affinity signal so role-compatible incoming candidates are ranked by support for defining and/or currently underrepresented requested compound-theme components instead of binary any-component membership.',
            'Add focused generic regressions spanning spellslinger, enchantment-combat, Merfolk typal, Elf typal and artifact/enchantment compound requests; do not encode fixture names or card-specific exceptions.',
            'Run the complete immutable repository validation. Only if green, freeze the exact repair SHA and replay Quick Draw, Virtue and Valor, Explorers of the Deep, Elven Empire and Animated Army from unchanged source, then manually compare complete decks against f65f4b7... and 2c5bbceb....',
            'Accept the lineage only if replacement identity materially improves across the repeated problem fixtures without Animated Army regression; otherwise persist the new generic failure pattern. After resolution, broaden BENCH-01 to fresh combo, hybrid, control, aristocrats, budget and unusual-commander fixtures with strong general-AI comparison.'
          ]
          state['handoffProtocol']['then'] = (
            'BENCH-01 remains active. Keep e17b0a1c... as the latest accepted Commander baseline. '
            'The advisory any-theme-component repair at frozen 2c5bbceb... passed immutable full validation but failed mandatory five-precon manual whole-deck review; '
            'evidence is persisted at 36f6734e... with manual verdict manual-verdict-2c5bbceb.md. The remaining centralized defect is compound-theme component priority: '
            'broad support components can outrank defining typal/enchantment/spellslinger identity. Next: implement only a generic component-aware advisory candidate affinity, '
            'validate fully, freeze the exact green SHA, replay the same comparison fixtures, then broaden BENCH-01 only after this pattern is resolved. Stable remains V0.13 and PR #29 remains unmerged.'
          )
          p.write_text(json.dumps(state, indent=2) + '\n')

          rp = Path('docs/ROADMAP.md')
          road = rp.read_text()
          start = road.index('### Current generic weakness — IDENTITY-AWARE REPLACEMENT PRIORITY')
          end = road.index('Remaining BENCH breadth should still cover', start)
          replacement = '''### Frozen advisory-theme candidate repair — FULLY VALIDATED / MANUAL REJECT\n\nThe smallest post-floor advisory theme-membership repair was validated immutably at `2c5bbcebb49c6dab23abcb84acf4968f9741db3b` and replayed from that exact frozen executable source across Quick Draw, Virtue and Valor, Explorers of the Deep, Elven Empire and Animated Army. Replay evidence is persisted at `36f6734e8f7b02dd24237aecb032379c0dd5cf4b`; mandatory manual verdict is `test-results/bench01-strategy-anchor-replay/manual-verdict-2c5bbceb.md`.\n\nThe lineage is **manually rejected** despite green formal validation:\n- Quick Draw still uses upgrade slots on equipment/value pieces that dilute the Stella Lee spell plan.\n- Virtue and Valor still replaces defining enchantment/Aura pieces with generic structural cards.\n- Explorers still cuts Merfolk/typal engines for generic counters/value/protection cards.\n- Elven Empire improves one slot with Llanowar Elves but still accepts non-Elf structural utility and remains Bracket 2.\n- Animated Army accepts zero swaps, so the repair fails the required regression guard.\n\n### Current generic weakness — COMPOUND-THEME COMPONENT-AWARE CANDIDATE AFFINITY\n\nThe cross-fixture diagnosis is now narrower than simple post-floor theme membership. A binary `matchesControlledTheme` signal treats every card that matches **any** component of a compound request as equally on-theme. Broad support components such as card draw, interaction, counters, combat or value can therefore outrank the defining typal/enchantment/spellslinger component. Aggregate and per-component hard preservation gates still prevent catastrophic loss, but they do not provide enough positive ranking pressure to preserve identity quality above those floors.\n\nThe next justified product work is the smallest generic **component-aware advisory** incoming-candidate affinity. It must:\n- reward role-compatible candidates that support defining and/or currently underrepresented requested components;\n- preserve a fallback to structurally necessary generic candidates when no suitable identity-preserving candidate exists;\n- remain advisory rather than freezing all theme cards or raising hard minimums;\n- avoid fixture, commander and card-name exceptions;\n- add generic focused regressions across spellslinger, enchantment-combat, Merfolk typal, Elf typal and artifact/enchantment compound cases;\n- pass full immutable repository validation before another exact frozen-source multi-fixture replay and manual complete-deck comparison.\n\n'''
          rp.write_text(road[:start] + replacement + road[end:])
      - name: Regenerate state and validation surfaces
        run: |
          npm run project:handoff
          npm run validation:index
          npm run project:validate
          npm run validation:validate
      - name: Commit reconciled state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-bench01-component-affinity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-state.json docs/PROJECT-STATE.md PROJECT_HANDOFF.md docs/ROADMAP.md validation-index.json docs/VALIDATION-STATE.md .github/workflows/reconcile-bench01-component-affinity.yml
          git commit -m 'chore(BENCH-01): checkpoint component-affinity rejection'
          git push origin HEAD:agent/v15-native-deck-intelligence
