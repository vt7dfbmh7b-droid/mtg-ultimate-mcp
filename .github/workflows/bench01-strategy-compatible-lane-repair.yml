name: BENCH-01 strategy-compatible candidate lane repair

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/bench01-strategy-compatible-lane-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v15-native-deck-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply centralized strategy-compatible lane repair
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/services/upgrade.ts')
          s = p.read_text()
          helper_anchor = 'export function upgradeThemeComponentAffinityScoreV15('
          if 'export function strategyCompatibleCandidateLanesV15<' not in s:
              helper = """/**
          * Split an already structurally-compatible role pool into an identity-aligned normal lane
          * and a generic fallback lane. Callers only advance to fallback when aligned candidates
          * produce zero actually eligible printings after downstream policy checks.
          */
          export function strategyCompatibleCandidateLanesV15<T>(
            candidates: readonly T[],
            isStrategyCompatible: (candidate: T) => boolean,
          ): T[][] {
            const preferred = candidates.filter(isStrategyCompatible);
            if (preferred.length === 0) return [[...candidates]];
            const preferredSet = new Set(preferred);
            const fallback = candidates.filter((candidate) => !preferredSet.has(candidate));
            return fallback.length > 0 ? [preferred, fallback] : [preferred];
          }

          """
              if helper_anchor not in s:
                  raise SystemExit('helper anchor not found')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)

          opening = "    const candidates: Array<Record<string, unknown>> = [];\n    for (const card of rankedForPrinting) {\n      if (candidates.length >= candidatesForPriority) break;\n"
          replacement = "    const candidateSelectionLanes = strategyCompatibleCandidateLanesV15(\n      rankedForPrinting,\n      (card) => {\n        const strategy = candidateStrategyPriorityV15(card, strategyContext);\n        if (strategy.substantive) return true;\n        if (componentAwareThemeRanking) {\n          // Score 2 is the saturated component floor; 4+ indicates meaningful scarcity/deficit support.\n          return componentAffinityForCard(card).score >= 4;\n        }\n        return Boolean(themeClause) && themeCandidateNames.has(card.name.toLocaleLowerCase());\n      },\n    );\n\n    const candidates: Array<Record<string, unknown>> = [];\n    for (const candidateLane of candidateSelectionLanes) {\n      const laneStartCount = candidates.length;\n      for (const card of candidateLane) {\n        if (candidates.length >= candidatesForPriority) break;\n"
          if opening not in s:
              raise SystemExit('candidate opening anchor not found')
          s = s.replace(opening, replacement, 1)

          closing = "      });\n    }\n\n    candidateGroups.push({"
          closing_replacement = "      });\n      }\n      // Do not pad a successful identity-aligned lane with generic role cards. Generic cards are\n      // a fallback only when the aligned lane yields zero eligible printings.\n      if (candidates.length > laneStartCount) break;\n    }\n\n    candidateGroups.push({"
          if closing not in s:
              raise SystemExit('candidate closing anchor not found')
          s = s.replace(closing, closing_replacement, 1)
          p.write_text(s)

          test = Path('src/services/upgrade-strategy-compatible-lane-v15.test.ts')
          test.write_text("""import assert from 'node:assert/strict';
          import test from 'node:test';
          import { strategyCompatibleCandidateLanesV15 } from './upgrade.js';

          type Candidate = { name: string; identityFit: boolean; printingEligible?: boolean };

          test('typal role candidates use aligned normal lane before generic fallback', () => {
            const aligned = { name: 'Elf draw engine', identityFit: true };
            const generic = { name: 'Generic draw spell', identityFit: false };
            assert.deepEqual(strategyCompatibleCandidateLanesV15([generic, aligned], c => c.identityFit), [[aligned], [generic]]);
          });

          test('non-typal spells strategy uses the same aligned-first behavior', () => {
            const aligned = { name: 'Spellslinger interaction', identityFit: true };
            const generic = { name: 'Generic removal', identityFit: false };
            assert.deepEqual(strategyCompatibleCandidateLanesV15([generic, aligned], c => c.identityFit), [[aligned], [generic]]);
          });

          test('generic structural candidates remain available when no aligned option exists', () => {
            const a = { name: 'Generic ramp A', identityFit: false };
            const b = { name: 'Generic ramp B', identityFit: false };
            assert.deepEqual(strategyCompatibleCandidateLanesV15([a, b], c => c.identityFit), [[a, b]]);
          });

          test('generic fallback is entered only when aligned lane yields zero eligible printings', () => {
            const unavailable: Candidate = { name: 'Aligned unavailable', identityFit: true, printingEligible: false };
            const generic: Candidate = { name: 'Generic available', identityFit: false, printingEligible: true };
            const choose = (pool: Candidate[]) => {
              const out: Candidate[] = [];
              for (const lane of strategyCompatibleCandidateLanesV15(pool, c => c.identityFit)) {
                const before = out.length;
                out.push(...lane.filter(c => c.printingEligible));
                if (out.length > before) break;
              }
              return out;
            };
            assert.deepEqual(choose([generic, unavailable]), [generic]);
            const available: Candidate = { name: 'Aligned available', identityFit: true, printingEligible: true };
            assert.deepEqual(choose([generic, available]), [available]);
          });
          """)
      - name: Focused strategy-compatible lane regressions
        run: npx tsx --test src/services/upgrade-strategy-compatible-lane-v15.test.ts
      - name: Regenerate authoritative derived state
        run: npm run project:handoff
      - name: Full repository validation
        run: npm run check
      - name: Commit validated Commander repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/upgrade.ts src/services/upgrade-strategy-compatible-lane-v15.test.ts docs/PROJECT-STATE.md PROJECT_HANDOFF.md
          git diff --cached --quiet && exit 0
          git commit -m 'fix: prefer strategy-compatible upgrade candidates'
          git push origin HEAD:agent/v15-native-deck-intelligence
