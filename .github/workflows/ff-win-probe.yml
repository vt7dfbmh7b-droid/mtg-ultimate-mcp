name: FF Win Package Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ff-win-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Probe known FINAL FANTASY win packages
        run: npx tsx scripts/probe-ff-win-packages.ts
      - name: Probe compact Ruthless Spellbook win variants
        run: npx tsx scripts/probe-spellbook-ruthless.ts
