name: BENCH-01 Role Identity Full Validation

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/bench01-role-identity-full-validation.yml

permissions:
  contents: write

concurrency:
  group: bench01-role-identity-full-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Verify frozen product source
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 73d7e3944a7a4da51b9c5a87834eb6642a61a1c8 -- src
      - name: Focused role-identity regressions
        run: npx tsx --test src/services/upgrade-strategy-compatible-lane-v15.test.ts src/services/upgrade-theme-component-affinity-v15.test.ts
      - name: Full immutable repository validation
        run: npm run check
      - name: Persist green validation evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p test-results/bench01-role-identity-validation
            cat > test-results/bench01-role-identity-validation/73d7e394-validation.txt <<'EOF'
          BENCH-01 requested-identity role-discovery validation
          frozen_product_src_sha=73d7e3944a7a4da51b9c5a87834eb6642a61a1c8
          focused_regressions=green
          full_repository_check=green
          acceptance=provisional_pending_frozen_replay_and_manual_whole_deck_review
          EOF
            git rm .github/workflows/bench01-role-identity-full-validation.yml
            git add test-results/bench01-role-identity-validation/73d7e394-validation.txt
            git commit -m 'BENCH-01: persist role-identity repair validation evidence'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Role-identity validation evidence persistence attempt ${attempt} lost a branch race; retrying against latest head."
          done
          echo 'BENCH-01 role-identity validation evidence persistence exhausted eight branch-race retries.' >&2
          exit 1
