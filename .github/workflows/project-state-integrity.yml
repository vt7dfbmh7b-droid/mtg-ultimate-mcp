name: Project State Integrity

on:
  push:
    branches: ["agent/**"]
    paths:
      - "project-state.json"
      - "PROJECT_HANDOFF.md"
      - "validation-registry.json"
      - "validation-index.json"
      - "docs/PROJECT-STATE.md"
      - "docs/VALIDATION-STATE.md"
      - "docs/PROJECT-MANAGEMENT.md"
      - "docs/ROADMAP.md"
      - "docs/DECISIONS.md"
      - "docs/VALIDATION-MATRIX.md"
      - "docs/KNOWN-FAILURES.md"
      - "scripts/project-state-lib.ts"
      - "scripts/generate-handoff.ts"
      - "scripts/validate-project-state.ts"
      - "scripts/update-project-state.ts"
      - "scripts/validation-index-lib.ts"
      - "scripts/build-validation-index.ts"
      - "scripts/validate-validation-index.ts"
      - "scripts/project-resume.ts"
      - "tsconfig.project-state.json"
      - "tsconfig.scripts.json"
      - "package.json"
      - ".github/workflows/project-state-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-state-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-project-state:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type-check project-management tooling
        id: pm_typecheck
        continue-on-error: true
        run: npm run project:typecheck

      - name: Type-check automation and E2E scripts
        id: scripts_typecheck
        continue-on-error: true
        run: npm run scripts:typecheck

      - name: Prepare validation index before integrity checks
        id: pm_index_prepare
        continue-on-error: true
        run: npm run validation:index

      - name: Validate machine state and generated docs
        id: pm_validate
        continue-on-error: true
        run: npm run project:validate

      - name: Validate consolidated validation index
        id: pm_index_validate
        continue-on-error: true
        run: npm run validation:validate

      - name: Run fresh-session recovery smoke
        id: recovery_smoke
        continue-on-error: true
        run: npm run project:resume > project-resume.json

      - name: Confirm normal source still builds
        id: source_build
        continue-on-error: true
        run: npm run build

      - name: Stage exact project-management integrity metadata
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.pm_typecheck.outcome }}
          SCRIPTS_TYPECHECK_OUTCOME: ${{ steps.scripts_typecheck.outcome }}
          VALIDATE_OUTCOME: ${{ steps.pm_validate.outcome }}
          INDEX_VALIDATE_OUTCOME: ${{ steps.pm_index_validate.outcome }}
          RECOVERY_SMOKE_OUTCOME: ${{ steps.recovery_smoke.outcome }}
          BUILD_OUTCOME: ${{ steps.source_build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/project-management
          ACTIVE_MILESTONE="$(node -p "JSON.parse(require('fs').readFileSync('project-state.json','utf8')).workMode.activeMilestone")"
          printf 'source_sha=%s\nactive_milestone=%s\ntypecheck_outcome=%s\nscripts_typecheck_outcome=%s\nstate_validate_outcome=%s\nvalidation_index_outcome=%s\nrecovery_smoke_outcome=%s\nsource_build_outcome=%s\n' \
            "$GITHUB_SHA" "$ACTIVE_MILESTONE" "$TYPECHECK_OUTCOME" "$SCRIPTS_TYPECHECK_OUTCOME" "$VALIDATE_OUTCOME" "$INDEX_VALIDATE_OUTCOME" "$RECOVERY_SMOKE_OUTCOME" "$BUILD_OUTCOME" \
            > test-results/project-management/integrity.txt

      - name: Regenerate validation index with current integrity result
        id: pm_index_rebuild
        if: always()
        continue-on-error: true
        run: npm run validation:index

      - name: Persist self-consistent project-management result
        if: always() && steps.pm_index_rebuild.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp test-results/project-management/integrity.txt "$RUNNER_TEMP/project-management-integrity.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p test-results/project-management
            cp "$RUNNER_TEMP/project-management-integrity.txt" test-results/project-management/integrity.txt
            npm run validation:index
            git add -- test-results/project-management/integrity.txt validation-index.json docs/VALIDATION-STATE.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "test-results(PM-02): persist self-consistent project integrity [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Integrity persistence attempt ${attempt} lost a branch race; retrying against the latest head."
          done
          echo 'Integrity persistence exhausted eight branch-race retries.' >&2
          exit 1

      - name: Require project-management integrity
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.pm_typecheck.outcome }}
          SCRIPTS_TYPECHECK_OUTCOME: ${{ steps.scripts_typecheck.outcome }}
          VALIDATE_OUTCOME: ${{ steps.pm_validate.outcome }}
          INDEX_VALIDATE_OUTCOME: ${{ steps.pm_index_validate.outcome }}
          RECOVERY_SMOKE_OUTCOME: ${{ steps.recovery_smoke.outcome }}
          BUILD_OUTCOME: ${{ steps.source_build.outcome }}
          INDEX_REBUILD_OUTCOME: ${{ steps.pm_index_rebuild.outcome }}
        run: |
          test "$TYPECHECK_OUTCOME" = success
          test "$SCRIPTS_TYPECHECK_OUTCOME" = success
          test "$VALIDATE_OUTCOME" = success
          test "$INDEX_VALIDATE_OUTCOME" = success
          test "$RECOVERY_SMOKE_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$INDEX_REBUILD_OUTCOME" = success
# INTEL-02-FAMILY-BATCH-2026-09-04: frozen-source trigger
