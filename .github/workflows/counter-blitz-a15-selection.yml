name: Counter Blitz A15 Combo Selection

on:
  push:
    branches:
      - test/counter-blitz-a15-combo-selection-20260829
    paths:
      - scripts/e2e-counter-blitz-a15-selection-audit.ts
      - .github/workflows/counter-blitz-a15-selection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run A15 selection audit
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/e2e-counter-blitz-a15-selection-audit.ts | tee counter-blitz-a15.log
      - name: Upload A15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-blitz-a15-${{ github.sha }}
          path: |
            counter-blitz-a15.log
            counter-blitz-a15-selection.json
          if-no-files-found: ignore
          retention-days: 14
