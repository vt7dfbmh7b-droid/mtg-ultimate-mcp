name: One-shot compound theme repair v2
# Final retry after obsolete v1 harness removal.

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/one-shot-compound-theme-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Preserve bounded combat discovery contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-compound-theme-repair.py')
          text = path.read_text()
          old = 'queryClause: \'(o:attack OR o:attacking OR o:\"combat damage\" OR o:\"additional combat\")\','
          new = 'queryClause: \'(o:attack OR o:\"combat damage\")\','
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one staged combat query, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply generic compound-theme repair
        run: python scripts/apply-compound-theme-repair.py
      - name: Remove temporary development harness before validation
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-compound-theme-repair-v2.yml
          rm -f scripts/apply-compound-theme-repair.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused regression tests
        run: npx tsx --test src/services/neutral-theme-v15.test.ts
      - name: Run full tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows scripts/apply-compound-theme-repair.py src/services/neutral-theme-v15.ts src/services/neutral-theme-v15.test.ts
          git commit -m 'fix(INTEL): compose controlled compound themes'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
