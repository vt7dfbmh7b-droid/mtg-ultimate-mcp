name: One-shot compound theme repair v2
# Validate the repaired source from a clean local commit before publishing it.

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/one-shot-compound-theme-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Preserve bounded combat discovery contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-compound-theme-repair.py')
          lines = path.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if 'queryClause:' in line and 'additional combat' in line]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one staged broad combat query, found {len(matches)}')
          lines[matches[0]] = "    queryClause: '(o:attack OR o:\\"combat damage\\")',"
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Apply generic compound-theme repair
        run: python scripts/apply-compound-theme-repair.py
      - name: Create clean local repair commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-compound-theme-repair-v2.yml
          rm -f scripts/apply-compound-theme-repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows scripts/apply-compound-theme-repair.py src/services/neutral-theme-v15.ts src/services/neutral-theme-v15.test.ts
          git commit -m 'fix(INTEL): compose controlled compound themes'
      - name: Install dependencies
        run: npm ci
      - name: Run focused regression tests
        run: npx tsx --test src/services/neutral-theme-v15.test.ts
      - name: Run full tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish validated repair
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            if [ "$attempt" -eq 3 ]; then
              echo 'Unable to publish validated repair after three attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
