name: Counter Blitz A4 Frontier Optimizer

on:
  push:
    branches:
      - test/counter-blitz-a4-frontier-20260829
    paths:
      - scripts/e2e-counter-blitz-a4-frontier.ts
      - .github/workflows/counter-blitz-a4-frontier.yml
      - src/**
      - test-results/exploratory/counter-blitz-ff-tidus-2026-08-29.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run A4 frontier optimizer
        run: |
          set -o pipefail
          npx tsx scripts/e2e-counter-blitz-a4-frontier.ts | tee counter-blitz-a4-frontier.log
      - name: Upload A4 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: counter-blitz-a4-frontier-${{ github.sha }}
          path: |
            counter-blitz-a4-frontier.log
            counter-blitz-a4-frontier-result.json
            counter-blitz-a4-frontier-deck.txt
            counter-blitz-a4-frontier-failure.txt
          if-no-files-found: ignore
          retention-days: 14
