name: Unrestricted Neutral Commander Build Control

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unrestricted-neutral-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Run unrestricted neutral live control
        run: npx tsx scripts/e2e-unrestricted-neutral-build-v15.ts
      - name: Upload unrestricted neutral result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unrestricted-neutral-build-${{ github.sha }}
          path: |
            unrestricted-neutral-build-live-result.json
            unrestricted-neutral-build-live-failure.txt
          if-no-files-found: ignore
          retention-days: 14
