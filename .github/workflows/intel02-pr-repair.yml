name: INTEL-02 PR Repair Runner

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v15-native-deck-intelligence
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply staged shared-truth repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/intel02-shared-truth-repair.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          repair = []
          for line in source[start:end]:
              repair.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/intel02-repair.py').write_text('\n'.join(repair) + '\n')
          PY
          python3 /tmp/intel02-repair.py

      - name: Install dependencies
        run: npm ci

      - name: Validate build and deterministic tests
        run: |
          npm run build
          npm test

      - name: Commit validated repair
        shell: bash
        run: |
          rm .github/workflows/intel02-shared-truth-repair.yml
          rm .github/workflows/intel02-pr-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/scryfall.ts src/services/upgrade.ts src/services/deck-builder-v07.ts src/services/card-role-truth-v15.test.ts src/services/upgrade-target-priority-v15.test.ts .github/workflows/intel02-shared-truth-repair.yml .github/workflows/intel02-pr-repair.yml
          git diff --cached --check
          git commit -m "fix(intel02): preserve authoritative upgrade truth"
          git push origin HEAD:agent/v15-native-deck-intelligence
