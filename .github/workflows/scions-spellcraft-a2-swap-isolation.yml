name: Scions & Spellcraft A2 Swap Isolation

on:
  push:
    branches:
      - test/scions-spellcraft-a2-swap-isolation-20260830
  workflow_dispatch:

jobs:
  isolate-scions-a1-swaps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Scions A2 swap isolation
        run: npx tsx scripts/e2e-scions-spellcraft-a2-swap-isolation.ts
      - name: Upload Scions A2 isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scions-spellcraft-a2-swap-isolation-${{ github.sha }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            scions-spellcraft-a2-swap-isolation.json
            scions-spellcraft-a2-swap-isolation.md
