name: Counter Blitz A22 Component Isolation

on:
  push:
    branches:
      - test/counter-blitz-a22-synergy-repair-20260830
  workflow_dispatch:

jobs:
  isolate-a22:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run A22 component isolation
        run: npx tsx scripts/e2e-counter-blitz-a22-component-isolation.ts
      - name: Upload isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-blitz-a22-component-isolation-${{ github.sha }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            counter-blitz-a22-component-isolation.json
            counter-blitz-a22-component-isolation.md
