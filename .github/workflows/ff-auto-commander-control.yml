name: FF Auto-Commander Build Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ff-auto-commander:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Discover commanders, build competing FF-only decks, and select the strongest verified result
        run: npx tsx scripts/e2e-ff-auto-commander-v15.ts
      - name: Upload auto-commander result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ff-auto-commander-result-${{ github.sha }}
          path: |
            ff-auto-commander-result.json
            ff-auto-commander-winning-deck.txt
            ff-auto-commander-failure.txt
          if-no-files-found: ignore
          retention-days: 14
