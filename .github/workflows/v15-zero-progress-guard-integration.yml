name: V0.15 Zero Progress Guard Integration

# Re-triggered after PM-01/PM-02 validation so the guard lands on the current checked-in lineage.
on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - ".github/workflows/v15-zero-progress-guard-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci

      - name: Patch shared refinement score with hard zero-progress guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scorer = Path('src/services/optimizer-v11.ts')
          text = scorer.read_text()
          old = """  components.targetGatePriority = targetGate.score;\n\n  const score = Object.values(components).reduce((sum, value) => sum + value, 0);\n  const keepDelta = numeric(delta.functionalKeepRate) ?? 0;\n"""
          new = """  components.targetGatePriority = targetGate.score;\n\n  const knownConstructionGateCount = Math.max(0, 8 - targetGate.ignoredUnverifiedGates.length);\n  const failedKnownGateCount = Math.max(0, knownConstructionGateCount - targetGate.passingBefore.length);\n  const hasTargetProgress = targetGate.repairedGates.length > 0 || targetGate.advancedFailedGates.length > 0;\n  const zeroProgressBlocked = targetGate.applicable\n    && failedKnownGateCount > 0\n    && !hasTargetProgress\n    && targetGate.regressedGates.length === 0;\n\n  let score = Object.values(components).reduce((sum, value) => sum + value, 0);\n  // Bracket-5 refinement must advance a known failed construction gate while any remain.\n  // Force zero-progress packages below the minimum configurable acceptance floor (-10), so even\n  // unusually strong simulation deltas cannot make cosmetic changes outrank the actual target.\n  if (zeroProgressBlocked && score > -10.001) {\n    components.targetGateNoProgressGuard = Number((-10.001 - score).toFixed(3));\n    score = Object.values(components).reduce((sum, value) => sum + value, 0);\n  }\n\n  const keepDelta = numeric(delta.functionalKeepRate) ?? 0;\n"""
          if 'targetGateNoProgressGuard' not in text:
            if old not in text:
              raise SystemExit('shared scorer anchor missing')
            text = text.replace(old, new, 1)
          scorer.write_text(text)

          tests = Path('src/services/optimizer-v11.test.ts')
          t = tests.read_text()
          addition = """

test('shared refinement score hard-blocks cosmetic B5 changes while known construction gates remain failed', () => {
  const result = refinementImprovementScoreV11({
    simulation: {
      delta: {
        functionalKeepRate: 10,
        commanderUptimePercent: 10,
        protectionWinRate: 5,
        averageSpellsCast: 2,
      },
    },
    beforeMetrics: bracket5Metrics(),
    afterMetrics: bracket5Metrics({ tutorCount: 9 }),
    v15TargetPressure: bracket5Pressure(),
  });
  assert.equal(result.components.targetGatePriority, 0);
  assert.ok((result.components.targetGateNoProgressGuard ?? 0) < 0);
  assert.ok(result.score < -10);
});

test('shared refinement score still allows measurable movement toward a failed B5 gate', () => {
  const result = refinementImprovementScoreV11({
    simulation: { delta: {} },
    beforeMetrics: bracket5Metrics({ averageNonlandManaValue: 2.71 }),
    afterMetrics: bracket5Metrics({ averageNonlandManaValue: 2.65 }),
    v15TargetPressure: bracket5Pressure(),
  });
  assert.ok((result.components.targetGatePriority ?? 0) > 0);
  assert.equal(result.components.targetGateNoProgressGuard, undefined);
  assert.ok(result.score > 0);
});
"""
          if "hard-blocks cosmetic B5 changes" not in t:
            t += addition
          tests.write_text(t)
          PY

      - name: Build
        run: npm run build

      - name: Run autonomous and win-package regressions
        run: npx tsx --test src/services/optimizer-v11.test.ts src/services/target-gate-improvement-v15.test.ts src/services/commander-target-pressure-v15.test.ts src/services/deck-builder-win-package-ceiling-v15.test.ts src/services/general-win-package-v15.test.ts src/services/full-table-win-closure-v15.test.ts src/services/win-package-pagination-v15.test.ts src/services/win-package-restricted-pool-v15.test.ts

      - name: Commit validated guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/services/optimizer-v11.ts src/services/optimizer-v11.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(v15): reject zero-progress B5 refinement packages"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
