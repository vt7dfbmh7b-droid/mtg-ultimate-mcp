name: Counter Blitz A18 Land-Slot Pressure

on:
  push:
    branches:
      - test/counter-blitz-a18-land-slot-pressure-20260829
  workflow_dispatch:

jobs:
  validate-a18:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run full test suite
        run: npm test
      - name: Run A18 land-slot pressure
        run: npx tsx scripts/e2e-counter-blitz-a18-land-slot-pressure.ts
      - name: Upload A18 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-blitz-a18-evidence-${{ github.sha }}
          path: |
            counter-blitz-a18-result.json
            counter-blitz-a18-leader.txt
          if-no-files-found: warn
