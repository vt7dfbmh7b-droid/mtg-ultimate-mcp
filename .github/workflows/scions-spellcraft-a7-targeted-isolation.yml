name: Scions & Spellcraft A7 Targeted Isolation

on:
  push:
    branches:
      - test/scions-spellcraft-a7-targeted-isolation-20260831
  workflow_dispatch:

jobs:
  scions-a7-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run A7 targeted isolation
        run: npx tsx scripts/e2e-scions-spellcraft-a7-targeted-isolation.ts
      - name: Upload A7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scions-spellcraft-a7-targeted-isolation-${{ github.sha }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            scions-spellcraft-a7-targeted-isolation.json
            scions-spellcraft-a7-targeted-isolation.md
