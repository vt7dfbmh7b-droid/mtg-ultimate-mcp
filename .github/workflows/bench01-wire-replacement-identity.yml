name: BENCH-01 wire replacement identity

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/bench01-wire-replacement-identity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v15-native-deck-intelligence
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Guard staged primitive and unwired product
        run: |
          test -f src/services/replacement-identity-priority-v15.ts
          if grep -q "compareReplacementIdentityPriorityV15" src/services/deck-builder-v07.ts; then
            echo "Replacement identity is already wired; refusing duplicate patch."
            exit 1
          fi
          echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Correct staged net-identity verdict and wire ranking signal
        shell: python
        run: |
          from pathlib import Path

          helper = Path('src/services/replacement-identity-priority-v15.ts')
          h = helper.read_text()
          old = """  const themeErosion = Math.max(0, -requestedThemeDelta);\n  const themeGain = Math.max(0, requestedThemeDelta);\n  const strategyErosion = Math.max(0, -substantiveStrategyAffinityDelta);\n  const strategyGain = Math.max(0, substantiveStrategyAffinityDelta);\n  const identityErosion = Number((themeErosion + strategyErosion).toFixed(3));\n  const identityGain = Number((themeGain + strategyGain).toFixed(3));\n"""
          new = """  // Theme and substantive strategy are both caller-declared identity evidence.\n  // Evaluate their net delta so a genuine strategy upgrade can compensate for spending one\n  // controlled-theme unit; this remains advisory ranking and never bypasses hard preservation.\n  const netIdentityDelta = Number((requestedThemeDelta + substantiveStrategyAffinityDelta).toFixed(3));\n  const identityErosion = Number(Math.max(0, -netIdentityDelta).toFixed(3));\n  const identityGain = Number(Math.max(0, netIdentityDelta).toFixed(3));\n"""
          if old not in h:
              raise SystemExit('expected helper body not found')
          helper.write_text(h.replace(old, new, 1))

          p = Path('src/services/deck-builder-v07.ts')
          text = p.read_text()
          import_anchor = "import { effectiveCardRolesV15 } from './card-role-truth-v15.js';\n"
          import_line = "import { compareReplacementIdentityPriorityV15, replacementIdentityPriorityV15 } from './replacement-identity-priority-v15.js';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('import anchor missing')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          helper_anchor = """function upgradeSwapSubstantiveStrategyLossScoreV15(\n  add: Record<string, unknown>,\n  cut: Record<string, unknown>,\n): number {\n"""
          adapter = """function upgradeSwapReplacementIdentityPriorityV15(\n  add: Record<string, unknown>,\n  cut: Record<string, unknown>,\n) {\n  const addAffinity = strategyAffinityEvidenceV15(add);\n  const cutAffinity = strategyAffinityEvidenceV15(cut);\n  return replacementIdentityPriorityV15(\n    {\n      matchesControlledTheme: recordObject(add.explicitTheme).matchesControlledTheme === true,\n      substantiveStrategyAffinity: addAffinity.score,\n    },\n    {\n      matchesControlledTheme: recordObject(cut.explicitTheme).matchesControlledTheme === true,\n      substantiveStrategyAffinity: cutAffinity.score,\n    },\n  );\n}\n\n"""
          if 'function upgradeSwapReplacementIdentityPriorityV15' not in text:
              if helper_anchor not in text:
                  raise SystemExit('strategy helper anchor missing')
              text = text.replace(helper_anchor, adapter + helper_anchor, 1)

          sort_anchor = """      const leftStrategyLoss = upgradeSwapSubstantiveStrategyLossScoreV15(selection.candidate, left);\n      const rightStrategyLoss = upgradeSwapSubstantiveStrategyLossScoreV15(selection.candidate, right);\n      if (leftStrategyLoss !== rightStrategyLoss) return leftStrategyLoss - rightStrategyLoss;\n"""
          identity_sort = sort_anchor + """      const identityPriority = compareReplacementIdentityPriorityV15(\n        upgradeSwapReplacementIdentityPriorityV15(selection.candidate, left),\n        upgradeSwapReplacementIdentityPriorityV15(selection.candidate, right),\n      );\n      if (identityPriority !== 0) return identityPriority;\n"""
          if 'const identityPriority = compareReplacementIdentityPriorityV15' not in text:
              if sort_anchor not in text:
                  raise SystemExit('sort anchor missing')
              text = text.replace(sort_anchor, identity_sort, 1)
          p.write_text(text)

      - name: Add pairing-level generic regressions
        shell: bash
        run: |
          cat > src/services/replacement-identity-pairing-v15.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import { pairUpgradeSwapsByStructureV15 } from './deck-builder-v07.js';

          const metrics = {
            rampCount: 8, drawCount: 8, interactionCount: 8, protectionCount: 2,
            tutorCount: 1, recursionCount: 2, boardWipeCount: 2, earlyPlayCount: 10,
            cheapInteractionCount: 6, fastManaCount: 2, averageNonlandManaValue: 3,
            nonlandCount: 60, commanderColorCount: 2, persistentColoredManaSourceCount: 4,
            roleCounts: {},
          };
          const targets = {
            ramp: 8, draw: 8, interaction: 8, freeInteraction: 0, protection: 3,
            tutors: 1, recursion: 2, boardWipes: 2, earlyPlays: 10,
          };

          function addition(theme: boolean, strategy = 0) {
            return {
              role: 'protection' as const,
              candidate: {
                card: { name: 'Unnamed Protective Upgrade', roles: ['protection'], manaValue: 2, typeLine: 'Instant' },
                explicitTheme: { matchesControlledTheme: theme },
                strategyAffinity: { score: strategy, protectionApplied: 0, matchedStrategies: [] },
              },
            };
          }

          function cut(name: string, pressure: number, theme: boolean, strategy = 0) {
            return {
              card: { name, roles: [], manaValue: 4, typeLine: 'Creature — Test' },
              heuristicCutPressure: pressure,
              explicitTheme: { matchesControlledTheme: theme },
              strategyAffinity: { score: strategy, protectionApplied: 0, matchedStrategies: [] },
            };
          }

          test('safe-cut ranking preserves requested identity when an equally legal neutral cut exists', () => {
            const pairs = pairUpgradeSwapsByStructureV15(
              [addition(false)] as any,
              [cut('Unnamed Identity Engine', 10, true), cut('Unnamed Neutral Filler', 8, false)],
              metrics, targets, 3,
            );
            assert.equal((pairs[0]?.cut.card as any)?.name, 'Unnamed Neutral Filler');
          });

          test('equal identity loss leaves normal cut-pressure tie-break intact', () => {
            const pairs = pairUpgradeSwapsByStructureV15(
              [addition(true)] as any,
              [cut('Unnamed Higher Pressure Identity Card', 10, true), cut('Unnamed Lower Pressure Identity Card', 8, true)],
              metrics, targets, 3,
            );
            assert.equal((pairs[0]?.cut.card as any)?.name, 'Unnamed Higher Pressure Identity Card');
          });

          test('identity-rich cards remain cuttable when no safer legal alternative exists', () => {
            const pairs = pairUpgradeSwapsByStructureV15(
              [addition(false)] as any,
              [cut('Unnamed Required Identity Cut', 10, true)],
              metrics, targets, 3,
            );
            assert.equal((pairs[0]?.cut.card as any)?.name, 'Unnamed Required Identity Cut');
          });

          test('substantive strategy gain can compensate for spending controlled-theme identity', () => {
            const pairs = pairUpgradeSwapsByStructureV15(
              [addition(false, 10)] as any,
              [cut('Unnamed Low Strategy Theme Card', 8, true, 2), cut('Unnamed High Strategy Theme Card', 10, true, 8)],
              metrics, targets, 3,
            );
            assert.equal((pairs[0]?.cut.card as any)?.name, 'Unnamed Low Strategy Theme Card');
          });
          EOF

      - name: Focused replacement-identity tests
        run: npx tsx --test src/services/replacement-identity-priority-v15.test.ts src/services/replacement-identity-pairing-v15.test.ts

      - name: Full repository validation
        run: npm run check

      - name: Fail closed if branch moved during validation
        run: |
          REMOTE_HEAD=$(git ls-remote origin refs/heads/agent/v15-native-deck-intelligence | cut -f1)
          test "$REMOTE_HEAD" = "$BASE_HEAD" || { echo "Branch advanced during validation; refusing to push stale product."; exit 1; }

      - name: Commit green product wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/replacement-identity-priority-v15.ts src/services/deck-builder-v07.ts src/services/replacement-identity-pairing-v15.test.ts
          git commit -m "fix(INTEL-02): rank cuts by relative requested identity"
          git push origin HEAD:agent/v15-native-deck-intelligence
