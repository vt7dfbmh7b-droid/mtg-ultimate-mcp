name: Counter Blitz Preservation A-B Test

on:
  push:
    branches:
      - test/counter-blitz-ff-tidus-20260829
    paths:
      - .github/workflows/counter-blitz-preservation-test.yml
      - scripts/e2e-counter-blitz-preservation.ts

permissions:
  contents: read

jobs:
  counter-blitz-preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Counter Blitz preservation comparison
        run: |
          set -o pipefail
          npx tsx scripts/e2e-counter-blitz-preservation.ts | tee counter-blitz-preservation.log
      - name: Upload result log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: counter-blitz-preservation-${{ github.sha }}
          path: counter-blitz-preservation.log
          if-no-files-found: ignore
          retention-days: 14
