name: Universal Commander Build Pipeline Control

on:
  push:
    branches: ["agent/universal-build-pipeline"]
    paths:
      - "scripts/e2e-universal-build-pipeline-v15.ts"
      - "src/services/commander-build-pipeline-v15.ts"
      - "src/services/commander-build-evaluation-v15.ts"
      - "src/services/general-win-package-v15.ts"
      - ".github/workflows/universal-build-pipeline-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Run universal Commander build pipeline live control
        run: npx tsx scripts/e2e-universal-build-pipeline-v15.ts
      - name: Upload pipeline result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-build-pipeline-${{ github.sha }}
          path: |
            universal-build-pipeline-live-result.json
            universal-build-pipeline-live-failure.txt
          if-no-files-found: ignore
          retention-days: 14
