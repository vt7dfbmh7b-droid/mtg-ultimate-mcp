name: BENCH-01 aspirational fallback repair

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/bench01-aspirational-fallback-patch.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v15-native-deck-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply generic aspirational fallback repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/services/upgrade.ts')
          text = path.read_text()

          old_sig = """export function compoundComponentCandidateLanesV15<T>(
            candidates: readonly T[],
            isComponentAligned: (candidate: T) => boolean,
            isStrategyCompatible: (candidate: T) => boolean,
            isAnchorAligned?: (candidate: T) => boolean,
            isRequestedRoleAligned?: (candidate: T) => boolean,
          ): T[][] {"""
          new_sig = """export function compoundComponentCandidateLanesV15<T>(
            candidates: readonly T[],
            isComponentAligned: (candidate: T) => boolean,
            isStrategyCompatible: (candidate: T) => boolean,
            isAnchorAligned?: (candidate: T) => boolean,
            isRequestedRoleAligned?: (candidate: T) => boolean,
            includeGenericFallback = true,
          ): T[][] {"""
          if old_sig not in text:
            raise SystemExit('compound lane signature not found')
          text = text.replace(old_sig, new_sig, 1)

          old_return = """  const generic = candidates.filter((candidate) => !anchorSet.has(candidate) && !componentSet.has(candidate) && !requestedRoleSet.has(candidate) && !strategySet.has(candidate));
            return [anchor, component, requestedRole, strategy, generic].filter((lane) => lane.length > 0);
          }"""
          new_return = """  const generic = candidates.filter((candidate) => !anchorSet.has(candidate) && !componentSet.has(candidate) && !requestedRoleSet.has(candidate) && !strategySet.has(candidate));
            const lanes = [anchor, component, requestedRole, strategy];
            // Aspirational role counts are heuristic consistency goals, not permission to force an
            // identity-free replacement. Keep generic structural fallback for authoritative target
            // gates, where the caller has explicit evidence that the structural repair is required.
            if (includeGenericFallback) lanes.push(generic);
            return lanes.filter((lane) => lane.length > 0);
          }"""
          if old_return not in text:
            raise SystemExit('compound lane return block not found')
          text = text.replace(old_return, new_return, 1)

          marker = """/**
           * For an explicit compound request, keep the user's requested mechanism as a distinct first lane."""
          helper = """/**
           * Generic structural fallback is mandatory for authoritative construction gates, but an
           * aspirational role-count heuristic must not force an identity-free swap when every
           * requested/strategy-compatible lane is empty. This keeps fallback available for real
           * structural requirements without turning soft Commander heuristics into staple drift.
           */
          export function genericStructuralFallbackAllowedV15(
            prioritySource: UpgradeCandidatePriorityV15['prioritySource'],
          ): boolean {
            return prioritySource === 'authoritative-target-gate';
          }

          """
          if marker not in text:
            raise SystemExit('compound lane comment marker not found')
          text = text.replace(marker, helper + marker, 1)

          old_call = """          (card) => anchorAffinityForCard(card) > 0,
                    (card) => themeCandidateNames.has(card.name.toLocaleLowerCase()),
                  )"""
          new_call = """          (card) => anchorAffinityForCard(card) > 0,
                    (card) => themeCandidateNames.has(card.name.toLocaleLowerCase()),
                    genericStructuralFallbackAllowedV15(deficit.prioritySource),
                  )"""
          if old_call not in text:
            raise SystemExit('compound lane call not found')
          text = text.replace(old_call, new_call, 1)

          old_caveat = """Within an already-required structural role or target gate, an explicit compound request preserves the starting deck’s dominant requested component first, then considers globally recognized requested components, exact role-specific requested-theme discoveries, substantive inferred commander strategy, and finally generic structural fallback. A later lane is considered only when the earlier lane yields zero eligible printings after printing/price policy checks."""
          new_caveat = """Within an already-required structural role or target gate, an explicit compound request preserves the starting deck’s dominant requested component first, then considers globally recognized requested components, exact role-specific requested-theme discoveries, and substantive inferred commander strategy. Generic structural fallback remains available for authoritative target gates, but aspirational role-count heuristics do not force an identity-free replacement when all compatible lanes are empty. A later lane is considered only when the earlier lane yields zero eligible printings after printing/price policy checks."""
          if old_caveat not in text:
            raise SystemExit('caveat text not found')
          text = text.replace(old_caveat, new_caveat, 1)

          path.write_text(text)

          test = Path('src/services/upgrade-aspirational-fallback-v15.test.ts')
          test.write_text("""import assert from 'node:assert/strict';
          import test from 'node:test';
          import {
            compoundComponentCandidateLanesV15,
            genericStructuralFallbackAllowedV15,
          } from './upgrade.js';

          test('generic structural fallback remains available for authoritative target gates', () => {
            assert.equal(genericStructuralFallbackAllowedV15('authoritative-target-gate'), true);
          });

          test('aspirational role heuristics do not force identity-free generic fallback', () => {
            assert.equal(genericStructuralFallbackAllowedV15('aspirational-role-target'), false);
          });

          test('compound candidate lanes omit generic-only cards when aspirational fallback is disabled', () => {
            const candidates = [
              { id: 'anchor' },
              { id: 'component' },
              { id: 'requested-role' },
              { id: 'strategy' },
              { id: 'generic' },
            ];
            const lanes = compoundComponentCandidateLanesV15(
              candidates,
              (candidate) => candidate.id === 'component',
              (candidate) => candidate.id === 'strategy',
              (candidate) => candidate.id === 'anchor',
              (candidate) => candidate.id === 'requested-role',
              false,
            );
            assert.deepEqual(lanes.flat().map((candidate) => candidate.id), [
              'anchor', 'component', 'requested-role', 'strategy',
            ]);
          });

          test('the same lane hierarchy retains generic fallback for authoritative structural repair', () => {
            const candidates = [
              { id: 'requested-role' },
              { id: 'generic' },
            ];
            const lanes = compoundComponentCandidateLanesV15(
              candidates,
              () => false,
              () => false,
              () => false,
              (candidate) => candidate.id === 'requested-role',
              true,
            );
            assert.deepEqual(lanes.flat().map((candidate) => candidate.id), ['requested-role', 'generic']);
          });

          test('aspirational fallback policy is archetype-agnostic across contrasting Commander mechanisms', () => {
            for (const family of ['spellslinger', 'enchantment-combat', 'typal', 'counters', 'artifact-enchantment']) {
              assert.equal(genericStructuralFallbackAllowedV15('aspirational-role-target'), false, family);
              assert.equal(genericStructuralFallbackAllowedV15('authoritative-target-gate'), true, family);
            }
          });
          """)
      - name: Focused regression
        run: npx tsx --test src/services/upgrade-aspirational-fallback-v15.test.ts src/services/upgrade-strategy-compatible-lane-v15.test.ts src/services/replacement-identity-pairing-v15.test.ts
      - name: Build
        run: npm run build
      - name: Commit repair and retire patch workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/bench01-aspirational-fallback-patch.yml
          git add src/services/upgrade.ts src/services/upgrade-aspirational-fallback-v15.test.ts .github/workflows/bench01-aspirational-fallback-patch.yml
          git commit -m "fix(BENCH-01): gate aspirational generic fallback"
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin agent/v15-native-deck-intelligence && git push origin HEAD:agent/v15-native-deck-intelligence && exit 0
            sleep $((attempt * 2))
          done
          exit 1
