name: One-shot code cleanup audit

on:
  push:
    branches: ["agent/code-cleanup-audit"]
    paths:
      - ".github/workflows/code-cleanup-audit.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-cleanup-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove compiler-confirmed dead code
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('src/services/cedh-win-package-v14.ts'): [
                  ("  type ResolvedPrintingPolicyV08,\n", ""),
              ],
              Path('src/services/references.ts'): [
                  ("import type { ScryfallCard } from '../types/scryfall.js';\n", ""),
              ],
              Path('src/services/deck.ts'): [
                  ("""function resolvedCardMap(cards: ScryfallCard[]): Map<string, ScryfallCard> {\n  const map = new Map<string, ScryfallCard>();\n  for (const card of cards) {\n    if (!map.has(card.name.toLocaleLowerCase())) map.set(card.name.toLocaleLowerCase(), card);\n  }\n  return map;\n}\n\n""", ""),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'Expected cleanup target not found in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          Path('.github/workflows/code-cleanup-audit.yml').unlink()
      - run: npm install
      - name: Validate deterministic build and tests
        run: npm run check
      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "clean unused TypeScript code"
          git push origin HEAD:agent/code-cleanup-audit
