name: One-shot code cleanup audit

on:
  push:
    branches: ["agent/code-cleanup-audit"]
    paths:
      - ".github/workflows/code-cleanup-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/code-cleanup-audit.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-cleanup-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove compiler-confirmed dead code
        shell: python
        run: |
          from pathlib import Path
          import re

          edits = [
              (
                  Path('src/services/cedh-win-package-v14.ts'),
                  r'^\s*type ResolvedPrintingPolicyV08,\r?\n',
                  '',
              ),
              (
                  Path('src/services/references.ts'),
                  r"^import type \{ ScryfallCard \} from '../types/scryfall\.js';\r?\n",
                  '',
              ),
              (
                  Path('src/services/deck.ts'),
                  r'^function resolvedCardMap\(cards: ScryfallCard\[\]\): Map<string, ScryfallCard> \{.*?^\}\r?\n\r?\n(?=function curveBucket)',
                  '',
              ),
          ]

          for path, pattern, replacement in edits:
              text = path.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f'Expected exactly one cleanup target in {path}; matched {count}')
              path.write_text(updated)

          Path('.github/workflows/code-cleanup-audit.yml').unlink()
      - run: npm install
      - name: Validate deterministic build and tests
        run: npm run check
      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "clean unused TypeScript code"
          git push origin HEAD:agent/code-cleanup-audit
