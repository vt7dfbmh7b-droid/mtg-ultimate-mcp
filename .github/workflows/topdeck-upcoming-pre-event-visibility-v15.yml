name: TopDeck Upcoming Pre-Event Visibility V15

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/live-topdeck-upcoming-pre-event-visibility-v15.ts"
      - ".github/workflows/topdeck-upcoming-pre-event-visibility-v15.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topdeck-upcoming-pre-event-visibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run build

      - name: Probe known upcoming public TopDeck events
        run: npx tsx scripts/live-topdeck-upcoming-pre-event-visibility-v15.ts

      - name: Upload aggregate visibility audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topdeck-upcoming-pre-event-visibility-${{ github.sha }}
          path: |
            topdeck-upcoming-pre-event-visibility-v15.json
            topdeck-upcoming-pre-event-visibility-v15-failure.txt
          if-no-files-found: ignore
          retention-days: 7
