name: Final Fantasy Bracket 5 E2E

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ff-bracket5-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Final Fantasy Bracket 5 target E2E
        run: npx tsx scripts/e2e-ff-bracket5.ts
