name: FINAL FANTASY Bracket 5 E2E

on:
  workflow_dispatch:
  push:
    branches: ["agent/**"]
    paths:
      - "scripts/e2e-ff-bracket5.ts"
      - ".github/workflows/ff-bracket5-e2e.yml"
      - "src/services/commander-rules.ts"
      - "src/services/deck.ts"
      - "src/services/deck-builder-v07.ts"
      - "src/services/optimizer-v11.ts"
      - "src/services/optimizer-v12.ts"
      - "src/services/printing-policy-v08.ts"
      - "src/services/refinement-workflows-v12.ts"
      - "src/services/scryfall.ts"
      - "src/services/spellbook.ts"
      - "src/services/upgrade.ts"

permissions:
  contents: read

jobs:
  ff-bracket5-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Build and evaluate FF-only Bracket 5 deck
        run: npx tsx scripts/e2e-ff-bracket5.ts
