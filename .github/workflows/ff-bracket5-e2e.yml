name: Final Fantasy Bracket 5 E2E

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ff-bracket5-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Run Final Fantasy Bracket 5 target E2E
        run: npx tsx scripts/e2e-ff-bracket5.ts
