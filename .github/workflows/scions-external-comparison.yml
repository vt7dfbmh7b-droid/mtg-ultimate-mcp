name: Scions A11 External Comparison

on:
  push:
    branches:
      - test/scions-compare-user-list-20260831
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compare A11 vs external Y'shtola build
        run: npx tsx scripts/e2e-scions-external-comparison.ts
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scions-external-comparison-${{ github.sha }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            scions-external-comparison.json
            scions-external-comparison.md
