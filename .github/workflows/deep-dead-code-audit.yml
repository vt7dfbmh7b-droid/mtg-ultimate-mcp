name: Deep dead-code audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deep-dead-code-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Create audit graph config
        shell: bash
        run: |
          cat > knip.audit.json <<'EOF'
          {
            "entry": [
              "src/index.ts",
              "src/server-v*.ts",
              "src/**/*.test.ts",
              "scripts/*.ts"
            ],
            "project": [
              "src/**/*.ts",
              "scripts/*.ts"
            ]
          }
          EOF
      - name: Audit unreachable files, exports, and dependency declarations
        shell: bash
        run: |
          set +e
          npx --yes knip@latest \
            --config knip.audit.json \
            --no-progress \
            --include-entry-exports \
            --include files,exports,types,dependencies,unlisted,binaries,unresolved \
            2>&1 | tee deep-dead-code-audit.log
          echo "knip_exit=${PIPESTATUS[0]}" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: deep-dead-code-audit-${{ github.sha }}
          path: deep-dead-code-audit.log
          retention-days: 7
