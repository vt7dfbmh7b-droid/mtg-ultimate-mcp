name: BENCH-01 Anchor Full Validation

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/bench01-anchor-full-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Focused anchor regressions
        run: npx tsx --test src/services/upgrade-theme-component-affinity-v15.test.ts src/services/upgrade-strategy-compatible-lane-v15.test.ts
      - name: Full immutable repository validation
        run: npm run check
      - name: Persist green validation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/bench01-anchor-priority-validation
          cat > test-results/bench01-anchor-priority-validation/e06a95cb-validation.txt <<'EOF'
          BENCH-01 dominant compound-theme anchor validation
          frozen_product_src_sha=e06a95cb03d03a3dcce1adeee8339e0e6625efa4
          focused_regressions=green
          full_repository_check=green
          acceptance=provisional_pending_frozen_replay_and_manual_whole_deck_review
          EOF
          git rm .github/workflows/bench01-anchor-full-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-results/bench01-anchor-priority-validation/e06a95cb-validation.txt
          git commit -m 'BENCH-01: persist anchor repair validation evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
