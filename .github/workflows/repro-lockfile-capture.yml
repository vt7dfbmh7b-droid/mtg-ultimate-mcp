name: Reproducibility lockfile capture

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/repro-lockfile-capture.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Generate exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Emit lockfile for recovery
        shell: bash
        run: |
          echo "LOCKFILE_BASE64_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "LOCKFILE_BASE64_END"
