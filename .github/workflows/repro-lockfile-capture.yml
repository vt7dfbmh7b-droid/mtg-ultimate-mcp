name: Reproducibility lockfile capture

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/repro-lockfile-capture.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out active development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Generate exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload exact lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reproducibility-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit exact generated lockfile to source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git commit -m "Lock npm dependency graph"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
