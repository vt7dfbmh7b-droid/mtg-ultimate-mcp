name: BENCH-01 Context Dead Low Curve Repair V2

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/bench01-context-dead-low-curve-repair-v2.yml

permissions:
  contents: write

concurrency:
  group: bench01-context-dead-low-curve-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/v15-native-deck-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply generic context-validity repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/upgrade.ts')
          text = p.read_text()
          old = '''export function cardRoleApplicableToDeckContextV15(
            card: ScryfallCard,
            role: string,
            allowedIdentity: readonly string[],
          ): boolean {
            if (role !== 'ramp') return true;
            const roles = new Set(effectiveCardRolesV15(card));
            if (!roles.has('cost reduction')) return true;
            if (roles.has('mana acceleration') || roles.has('land ramp')) return true;
            return costReductionApplicableToCommanderIdentityV15(getCardOracleText(card), allowedIdentity);
          }
          '''
          new = '''export function cardHasIndependentUtilityBeyondContextDeadCostReductionV15(
            oracleText: string,
            detectedRoles: readonly string[],
            allowedIdentity: readonly string[],
          ): boolean {
            if (costReductionApplicableToCommanderIdentityV15(oracleText, allowedIdentity)) return true;
            const reducerOnlyRoles = new Set(['cost reduction', 'mana acceleration', 'delayed mana acceleration']);
            return detectedRoles.some((detectedRole) => !reducerOnlyRoles.has(detectedRole));
          }

          export function cardRoleApplicableToDeckContextV15(
            card: ScryfallCard,
            role: string,
            allowedIdentity: readonly string[],
          ): boolean {
            const roles = new Set(effectiveCardRolesV15(card));
            if (roles.has('cost reduction')) {
              const oracleText = getCardOracleText(card);
              const reducerApplicable = costReductionApplicableToCommanderIdentityV15(oracleText, allowedIdentity);
              if (!reducerApplicable) {
                const hasIndependentUtility = cardHasIndependentUtilityBeyondContextDeadCostReductionV15(
                  oracleText,
                  [...roles],
                  allowedIdentity,
                );
                if (!hasIndependentUtility && ['ramp', 'early', 'average-nonland-mv'].includes(role)) return false;
              }
            }
            if (role !== 'ramp') return true;
            if (!roles.has('cost reduction')) return true;
            if (roles.has('land ramp')) return true;
            if (!costReductionApplicableToCommanderIdentityV15(getCardOracleText(card), allowedIdentity)) {
              return cardHasIndependentUtilityBeyondContextDeadCostReductionV15(
                getCardOracleText(card),
                [...roles],
                allowedIdentity,
              );
            }
            return true;
          }
          '''
          if old not in text:
              raise SystemExit('expected cardRoleApplicableToDeckContextV15 block not found')
          p.write_text(text.replace(old, new))

          t = Path('src/services/upgrade-context-role-applicability-v15.test.ts')
          tt = t.read_text()
          tt = tt.replace(
              "import { costReductionApplicableToCommanderIdentityV15 } from './upgrade.js';",
              "import { cardHasIndependentUtilityBeyondContextDeadCostReductionV15, costReductionApplicableToCommanderIdentityV15 } from './upgrade.js';",
          )
          addition = '''\n\ntest('context-dead reducer cannot qualify as useful low-curve filler by reducer labels alone', () => {\n  assert.equal(cardHasIndependentUtilityBeyondContextDeadCostReductionV15(\n    'Black spells you cast cost {1} less to cast.',\n    ['cost reduction', 'mana acceleration'],\n    ['R', 'G'],\n  ), false);\n});\n\ntest('context-dead reducer remains usable when the card has an independent deck role', () => {\n  assert.equal(cardHasIndependentUtilityBeyondContextDeadCostReductionV15(\n    'When this enters, draw a card. Black spells you cast cost {1} less to cast.',\n    ['cost reduction', 'mana acceleration', 'card draw'],\n    ['R', 'G'],\n  ), true);\n});\n'''
          if 'context-dead reducer cannot qualify as useful low-curve filler' not in tt:
              tt += addition
          t.write_text(tt)
          PY
      - name: Focused context-validity regressions
        run: npx tsx --test src/services/upgrade-context-role-applicability-v15.test.ts src/services/upgrade-aspirational-fallback-v15.test.ts src/services/upgrade-strategy-compatible-lane-v15.test.ts src/services/replacement-identity-pairing-v15.test.ts
      - name: Remove temporary runner before final-tree validation
        run: rm .github/workflows/bench01-context-dead-low-curve-repair-v2.yml
      - name: Full repository validation
        run: npm run check
      - name: Commit validated product repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/upgrade.ts src/services/upgrade-context-role-applicability-v15.test.ts .github/workflows/bench01-context-dead-low-curve-repair-v2.yml
          git commit -m 'fix(BENCH-01): reject context-dead low-curve utility'
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin agent/v15-native-deck-intelligence && git push origin HEAD:agent/v15-native-deck-intelligence && exit 0
            sleep $((attempt * 2))
          done
          exit 1
