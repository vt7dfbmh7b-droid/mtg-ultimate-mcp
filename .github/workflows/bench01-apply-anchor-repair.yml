name: BENCH-01 Apply Anchor Repair

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/bench01-apply-anchor-repair.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Apply generic anchor repair
        run: python3 scripts/bench01-apply-anchor-repair.py
      - name: Run focused regressions
        run: npx tsx --test src/services/upgrade-theme-component-affinity-v15.test.ts src/services/upgrade-strategy-compatible-lane-v15.test.ts
      - name: Commit product repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/bench01-apply-anchor-repair.yml scripts/bench01-apply-anchor-repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/upgrade.ts src/services/upgrade-theme-component-affinity-v15.test.ts src/services/upgrade-strategy-compatible-lane-v15.test.ts
          git commit -m 'BENCH-01: preserve dominant compound-theme anchor'
          git push origin "HEAD:${GITHUB_REF_NAME}"
