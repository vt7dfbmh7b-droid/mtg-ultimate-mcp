name: Neutral Exact Per-Card Budget Control

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  neutral-exact-per-card-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Run neutral exact per-card budget live control
        run: npx tsx scripts/e2e-neutral-exact-per-card-budget-v15.ts
      - name: Upload budget control result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neutral-exact-per-card-budget-${{ github.sha }}
          path: |
            neutral-exact-per-card-budget-live-result.json
            neutral-exact-per-card-budget-live-failure.txt
          if-no-files-found: ignore
          retention-days: 14
