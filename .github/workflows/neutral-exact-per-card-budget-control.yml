name: Neutral Exact Per-Card Budget Control

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  neutral-exact-per-card-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Run neutral exact per-card budget live control
        run: npx tsx scripts/e2e-neutral-exact-per-card-budget-v15.ts
      - name: Upload budget control result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neutral-exact-per-card-budget-${{ github.sha }}
          path: |
            neutral-exact-per-card-budget-live-result.json
            neutral-exact-per-card-budget-live-failure.txt
          if-no-files-found: ignore
          retention-days: 14
