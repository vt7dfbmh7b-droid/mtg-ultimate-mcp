name: US$100 Whole-Deck Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget-100:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Build, price-audit and classify the US$100 control
        run: npx tsx scripts/e2e-budget-100-v15.ts
