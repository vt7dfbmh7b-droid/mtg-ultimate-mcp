name: US$100 Whole-Deck Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Build, price-audit and classify the US$100 control
        run: npx tsx scripts/e2e-budget-100-v15.ts
