name: Themed Special Printing Audit
on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - "scripts/audit-marvel-middle-earth-special-printings-v15.ts"
      - ".github/workflows/themed-special-printing-audit.yml"
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: themed-special-printing-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - id: audit
        continue-on-error: true
        run: npx tsx scripts/audit-marvel-middle-earth-special-printings-v15.ts
      - if: always()
        env:
          OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          mkdir -p test-results/themed-special-printing-audit
          rm -f test-results/themed-special-printing-audit/result.json test-results/themed-special-printing-audit/failure.txt
          [ ! -f themed-special-printing-audit.json ] || cp themed-special-printing-audit.json test-results/themed-special-printing-audit/result.json
          [ ! -f themed-special-printing-audit-failure.txt ] || cp themed-special-printing-audit-failure.txt test-results/themed-special-printing-audit/failure.txt
          printf 'source_sha=%s\noutcome=%s\n' "$GITHUB_SHA" "$OUTCOME" > test-results/themed-special-printing-audit/run-metadata.txt
          rm -rf "$RUNNER_TEMP/themed-special-printing-audit"
          cp -R test-results/themed-special-printing-audit "$RUNNER_TEMP/themed-special-printing-audit"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            rm -rf test-results/themed-special-printing-audit
            cp -R "$RUNNER_TEMP/themed-special-printing-audit" test-results/themed-special-printing-audit
            git add -- test-results/themed-special-printing-audit
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "test-results: persist themed special printing audit"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Printing-audit persistence attempt ${attempt} lost a branch race; retrying against the latest head."
          done
          echo 'Printing-audit persistence exhausted eight branch-race retries.' >&2
          exit 1
      - if: always()
        env:
          OUTCOME: ${{ steps.audit.outcome }}
        run: test "$OUTCOME" = "success"
