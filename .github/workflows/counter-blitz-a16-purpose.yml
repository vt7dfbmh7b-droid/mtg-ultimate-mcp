name: Counter Blitz A16 Purpose Audit

on:
  push:
    branches:
      - test/counter-blitz-a16-combo-selection-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-purpose-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run A16 audit regressions
        run: npx tsx --test src/services/card-purpose-v15.test.ts src/services/combo-selection-v15.test.ts src/services/deck-slots-v15.test.ts src/services/full-deck-audit-v15.test.ts

      - name: Run full test suite
        run: npm test

      - name: Run A16 physical 99 refinement
        run: npx tsx scripts/e2e-counter-blitz-a16-full-99.ts

      - name: Upload A16 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: counter-blitz-a16-purpose-evidence-${{ github.sha }}
          path: |
            counter-blitz-a16-result.json
            counter-blitz-a16-full-99-audit.json
            counter-blitz-a16-full-99-audit.md
            counter-blitz-a16-leader.txt
            counter-blitz-a16-leader-99-audit.json
            counter-blitz-a16-leader-99-audit.md
            counter-blitz-a16-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
