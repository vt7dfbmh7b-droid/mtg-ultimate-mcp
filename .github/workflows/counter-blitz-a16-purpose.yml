name: Counter Blitz A16 Purpose Audit

on:
  push:
    branches:
      - test/counter-blitz-a16-combo-selection-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-purpose-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run card-purpose regressions
        run: npx tsx --test src/services/card-purpose-v15.test.ts

      - name: Run full test suite
        run: npm test
