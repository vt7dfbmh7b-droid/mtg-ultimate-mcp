name: INTEL-02 Build Diagnostic

on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - ".github/workflows/intel02-build-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - name: Capture build output
        id: build
        continue-on-error: true
        shell: bash
        run: npm run build > intel02-build.log 2>&1
      - name: Persist build diagnostic
        id: persist
        if: always()
        continue-on-error: true
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p test-results/intel02-build-diagnostic
            cp intel02-build.log test-results/intel02-build-diagnostic/build.log
            printf 'source_sha=%s\nbuild_outcome=%s\n' "$GITHUB_SHA" "$BUILD_OUTCOME" > test-results/intel02-build-diagnostic/run-metadata.txt
            git add -- test-results/intel02-build-diagnostic
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "test-results: persist INTEL-02 build diagnostic [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          done
          exit 1
      - name: Require persistence
        if: always()
        env:
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: test "$PERSIST_OUTCOME" = success
