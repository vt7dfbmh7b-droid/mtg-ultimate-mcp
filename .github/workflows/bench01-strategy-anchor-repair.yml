name: "BENCH-01 — Generic strategy-anchor repair"

on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - ".github/workflows/bench01-strategy-anchor-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Apply generic equipment-voltron semantic anchor
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const sourcePath = 'src/services/neutral-commander-selection-v15.ts';
          let source = fs.readFileSync(sourcePath, 'utf8');
          const oldBlock = [
            "  addSignal(table, 'equipment-voltron', roles.has('equipment'), 8, 'equipment role');",
            "  addSignal(table, 'equipment-voltron', roles.has('protection'), 3, 'protection');",
            "  addSignal(table, 'equipment-voltron', /equip |equipped creature|attach target|attach it/i.test(text), 7, 'equip/attach text');",
            "  addSignal(table, 'equipment-voltron', /double strike|commander damage|power and toughness/i.test(text), 3, 'combat scaling');",
          ].join('\n');
          const newBlock = [
            "  const positiveEquipmentReference = roles.has('equipment') && !/\\bnon-equipment\\b/i.test(text);",
            "  const equipmentVoltronAnchor = positiveEquipmentReference",
            "    || /equip |equipped creature|attach target|attach it/i.test(text);",
            "  addSignal(table, 'equipment-voltron', positiveEquipmentReference, 8, 'equipment role');",
            "  addSignal(table, 'equipment-voltron', equipmentVoltronAnchor && roles.has('protection'), 3, 'protection');",
            "  addSignal(table, 'equipment-voltron', /equip |equipped creature|attach target|attach it/i.test(text), 7, 'equip/attach text');",
            "  addSignal(table, 'equipment-voltron', equipmentVoltronAnchor && /double strike|commander damage|power and toughness/i.test(text), 3, 'combat scaling');",
          ].join('\n');
          if (!source.includes(oldBlock)) throw new Error('target strategy block not found');
          source = source.replace(oldBlock, newBlock);
          fs.writeFileSync(sourcePath, source);

          const testPath = 'src/services/neutral-commander-selection-v15.test.ts';
          let tests = fs.readFileSync(testPath, 'utf8');
          const anchor = "test('neutral inference distinguishes graveyard and equipment identities', () => {";
          const regression = [
            "test('negative Equipment references plus incidental combat/protection text cannot manufacture equipment-voltron', () => {",
            "  const result = inferNeutralStrategyV15([card({",
            "    name: 'Protected Animator',",
            "    oracle: 'During your turn, each non-Equipment artifact and non-Aura enchantment you control with mana value 4 or greater has base power and toughness 4/4 and has indestructible. Whenever one of those creatures deals combat damage to a player, draw a card.',",
            "  })]);",
            "  const equipment = result.find((strategy) => strategy.archetype === 'equipment-voltron');",
            "  assert.ok((equipment?.score ?? 0) < 6);",
            "});",
            "",
          ].join('\n');
          if (!tests.includes(anchor)) throw new Error('test insertion anchor not found');
          tests = tests.replace(anchor, regression + anchor);
          fs.writeFileSync(testPath, tests);
          NODE
          rm -f .github/workflows/bench01-strategy-anchor-repair.yml
      - name: Focused strategy inference regression
        run: npx tsx --test src/services/neutral-commander-selection-v15.test.ts
      - name: Full repository tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated generic repair and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src/services/neutral-commander-selection-v15.ts src/services/neutral-commander-selection-v15.test.ts .github/workflows/bench01-strategy-anchor-repair.yml
          git commit -m "fix(BENCH-01): require positive equipment anchor for voltron inference"
          for attempt in 1 2 3 4 5 6; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1
