name: TopDeck Promotion Corpus Build V0.15

on:
  workflow_dispatch:
    inputs:
      joined_artifact_references_json:
        description: JSON array of immutable private GHCR joined-evidence references
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: topdeck-promotion-corpus-build-v15
  cancel-in-progress: false

env:
  TOPDECK_PACKAGE_NAME: mtg-ultimate-mcp-topdeck-evidence
  JOINED_PRIVATE_FILE: topdeck-promotion-joined-private-v15.json
  INDEX_FILE: joined-evidence-index-v15.json
  PRIVATE_CORPUS_FILE: topdeck-promotion-corpus-private-v15.json
  AUDIT_FILE: topdeck-promotion-corpus-audit-v15.json
  DESCRIPTOR_FILE: topdeck-promotion-corpus-private-oci-descriptor-v15.json
  CORPUS_ARTIFACT_TYPE: application/vnd.mtg-ultimate.topdeck-promotion-corpus.v1
  CORPUS_LAYER_MEDIA_TYPE: application/vnd.mtg-ultimate.topdeck-promotion-corpus.v1+json

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.3

      - name: Verify TopDeck evidence package is private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ENCODED_PACKAGE=$(node -e "process.stdout.write(encodeURIComponent(process.env.TOPDECK_PACKAGE_NAME))")
          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${OWNER}/packages/container/${ENCODED_PACKAGE}")
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Could not verify TopDeck evidence package privacy; HTTP $HTTP_CODE." >&2
            exit 1
          fi
          VISIBILITY=$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(x.visibility||''))" "$RESPONSE_FILE")
          rm -f "$RESPONSE_FILE"
          if [[ "$VISIBILITY" != "private" ]]; then
            echo "Refusing corpus build because TopDeck evidence package visibility is ${VISIBILITY:-unknown}, not private." >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Validate and pull immutable joined evidence
        env:
          JOINED_REFS_JSON: ${{ inputs.joined_artifact_references_json }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPOSITORY="ghcr.io/${OWNER}/${TOPDECK_PACKAGE_NAME}"
          PREFIX="${REPOSITORY}@sha256:"
          node <<'NODE' > joined-refs.txt
          const raw = process.env.JOINED_REFS_JSON;
          let parsed;
          try { parsed = JSON.parse(raw); } catch { throw new Error('joined_artifact_references_json must be valid JSON.'); }
          if (!Array.isArray(parsed) || parsed.length === 0) throw new Error('joined_artifact_references_json must be a non-empty JSON array.');
          if (parsed.length > 5000) throw new Error('At most 5000 joined evidence artifacts may be admitted per corpus build.');
          const refs = parsed.map((value, index) => {
            if (typeof value !== 'string' || !value.trim()) throw new Error(`Reference ${index} must be a non-empty string.`);
            return value.trim().toLowerCase();
          });
          if (new Set(refs).size !== refs.length) throw new Error('Joined evidence artifact references must be unique.');
          process.stdout.write(refs.join('\n'));
          NODE

          : > "$INDEX_FILE"
          printf '[\n' > "$INDEX_FILE"
          INDEX=0
          FIRST=true
          while IFS= read -r REF; do
            [[ -n "$REF" ]] || continue
            if [[ "$REF" != "$PREFIX"* ]]; then
              echo "Joined evidence reference must use immutable digest form under ${REPOSITORY}." >&2
              exit 1
            fi
            DIGEST="${REF#"$PREFIX"}"
            if [[ ! "$DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
              echo "Joined evidence reference has an invalid SHA-256 digest." >&2
              exit 1
            fi
            DIR="joined/${INDEX}"
            mkdir -p "$DIR"
            oras pull "$REF" -o "$DIR"
            test -f "$DIR/$JOINED_PRIVATE_FILE"
            if [[ "$FIRST" != true ]]; then printf ',\n' >> "$INDEX_FILE"; fi
            FIRST=false
            REF_JSON=$(node -e "process.stdout.write(JSON.stringify(process.argv[1]))" "$REF")
            PATH_JSON=$(node -e "process.stdout.write(JSON.stringify(process.argv[1]))" "$DIR/$JOINED_PRIVATE_FILE")
            printf '  {"artifactReference":%s,"path":%s}' "$REF_JSON" "$PATH_JSON" >> "$INDEX_FILE"
            INDEX=$((INDEX + 1))
          done < joined-refs.txt
          printf '\n]\n' >> "$INDEX_FILE"
          test "$INDEX" -gt 0

      - name: Replay joined evidence and build strict corpus
        id: corpus
        env:
          TOPDECK_PROMOTION_JOIN_INDEX_PATH: ${{ env.INDEX_FILE }}
          TOPDECK_PROMOTION_CORPUS_PRIVATE_PATH: ${{ env.PRIVATE_CORPUS_FILE }}
          TOPDECK_PROMOTION_CORPUS_AUDIT_PATH: ${{ env.AUDIT_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/build-topdeck-promotion-corpus-v15.ts
          LINEAGE_HASH=$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync(process.env.AUDIT_FILE,'utf8'));process.stdout.write(x.evidenceLineageHash||'')")
          ADMITTED_ROWS=$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync(process.env.AUDIT_FILE,'utf8'));process.stdout.write(String(x.admittedRows ?? ''))")
          if [[ ! "$LINEAGE_HASH" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Corpus audit did not produce a valid evidence-lineage hash." >&2
            exit 1
          fi
          if [[ ! "$ADMITTED_ROWS" =~ ^[0-9]+$ ]] || [[ "$ADMITTED_ROWS" == "0" ]]; then
            echo "Corpus audit did not produce a positive admitted-row count." >&2
            exit 1
          fi
          echo "lineage_hash=$LINEAGE_HASH" >> "$GITHUB_OUTPUT"
          echo "admitted_rows=$ADMITTED_ROWS" >> "$GITHUB_OUTPUT"

      - name: Push strict corpus to private GHCR package
        id: push
        env:
          LINEAGE_HASH: ${{ steps.corpus.outputs.lineage_hash }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPOSITORY="ghcr.io/${OWNER}/${TOPDECK_PACKAGE_NAME}"
          TAG="corpus-${LINEAGE_HASH:0:20}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TAGGED_REFERENCE="${REPOSITORY}:${TAG}"
          oras push \
            --artifact-type "$CORPUS_ARTIFACT_TYPE" \
            "$TAGGED_REFERENCE" \
            "$PRIVATE_CORPUS_FILE:$CORPUS_LAYER_MEDIA_TYPE"
          oras manifest fetch --descriptor "$TAGGED_REFERENCE" > "$DESCRIPTOR_FILE"
          DIGEST=$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync(process.env.DESCRIPTOR_FILE,'utf8'));process.stdout.write(x.digest||'')")
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Private corpus descriptor did not contain an immutable SHA-256 digest." >&2
            exit 1
          fi
          echo "artifact_reference=${REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify package remained private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ENCODED_PACKAGE=$(node -e "process.stdout.write(encodeURIComponent(process.env.TOPDECK_PACKAGE_NAME))")
          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${OWNER}/packages/container/${ENCODED_PACKAGE}")
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Could not verify corpus package privacy; HTTP $HTTP_CODE." >&2
            exit 1
          fi
          VISIBILITY=$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(x.visibility||''))" "$RESPONSE_FILE")
          rm -f "$RESPONSE_FILE"
          if [[ "$VISIBILITY" != "private" ]]; then
            echo "Corpus package is not private after write." >&2
            exit 1
          fi

      - name: Add immutable corpus reference to audit
        env:
          CORPUS_ARTIFACT_REFERENCE: ${{ steps.push.outputs.artifact_reference }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.AUDIT_FILE;
          const audit = JSON.parse(fs.readFileSync(path, 'utf8'));
          audit.privateCorpusStorage = {
            kind: 'ghcr-private-oci',
            immutableArtifactReference: process.env.CORPUS_ARTIFACT_REFERENCE,
          };
          fs.writeFileSync(path, `${JSON.stringify(audit, null, 2)}\n`, 'utf8');
          NODE

      - name: Upload privacy-safe corpus audit only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: topdeck-promotion-corpus-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.AUDIT_FILE }}
            ${{ env.DESCRIPTOR_FILE }}
          if-no-files-found: warn
          retention-days: 30

      - name: Remove sensitive evidence from runner workspace
        if: always()
        shell: bash
        run: |
          rm -rf joined joined-refs.txt "$INDEX_FILE"
          rm -f "$PRIVATE_CORPUS_FILE"
