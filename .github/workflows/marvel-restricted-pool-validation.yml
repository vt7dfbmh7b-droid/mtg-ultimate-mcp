name: Marvel Restricted Pool Sequential Validation

on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - ".github/workflows/marvel-restricted-pool-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  HTTP_RETRY_BASE_MS: 5000
  HTTP_RETRY_MAX_MS: 15000
  SCRYFALL_HTTP_RETRY_ATTEMPTS: 5
  SCRYFALL_MIN_REQUEST_GAP_MS: 750
  COMMANDER_SPELLBOOK_HTTP_RETRY_ATTEMPTS: 5

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Fresh Marvel Build
        id: build_control
        continue-on-error: true
        run: npx tsx scripts/e2e-marvel-bracket5-v15.ts
      - name: Stage fresh Build for refinement
        if: steps.build_control.outcome == 'success'
        run: |
          mkdir -p test-results/marvel-bracket5
          cp marvel-bracket5-live-result.json test-results/marvel-bracket5/live-result.json
          cp marvel-bracket5-selected-deck.txt test-results/marvel-bracket5/selected-deck.txt
      - name: Refine fresh Marvel Build
        id: refine_control
        if: steps.build_control.outcome == 'success'
        continue-on-error: true
        run: npx tsx scripts/e2e-marvel-bracket5-refine-v15.ts
      - name: Persist and self-delete
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build_control.outcome }}
          REFINE_OUTCOME: ${{ steps.refine_control.outcome }}
        run: |
          set -euo pipefail
          mkdir -p test-results/marvel-bracket5
          if [ -f marvel-bracket5-live-result.json ]; then cp marvel-bracket5-live-result.json test-results/marvel-bracket5/live-result.json; fi
          if [ -f marvel-bracket5-selected-deck.txt ]; then cp marvel-bracket5-selected-deck.txt test-results/marvel-bracket5/selected-deck.txt; fi
          if [ -f marvel-bracket5-refine-result.json ]; then cp marvel-bracket5-refine-result.json test-results/marvel-bracket5/refine-result.json; fi
          if [ -f marvel-bracket5-refined-deck.txt ]; then cp marvel-bracket5-refined-deck.txt test-results/marvel-bracket5/refined-deck.txt; fi
          printf 'source_sha=%s\nbuild_outcome=%s\nrefine_outcome=%s\n' "$GITHUB_SHA" "$BUILD_OUTCOME" "$REFINE_OUTCOME" > test-results/marvel-bracket5/restricted-pool-validation-metadata.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/marvel-restricted-pool-validation.yml
          git add -- test-results/marvel-bracket5
          git commit -m "test-results: validate restricted pool with Marvel controls"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Require both controls
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build_control.outcome }}
          REFINE_OUTCOME: ${{ steps.refine_control.outcome }}
        run: |
          test "$BUILD_OUTCOME" = success
          test "$REFINE_OUTCOME" = success
