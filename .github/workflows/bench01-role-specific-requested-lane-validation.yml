name: BENCH-01 Role-Specific Requested Lane Validation

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/bench01-role-specific-requested-lane-validation.yml

permissions:
  contents: write

concurrency:
  group: bench01-role-specific-requested-lane-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Verify immutable Commander source
        run: git diff --exit-code 6686f2892e93cc571ee9e4f7717bb5f0156bd301 -- src
      - name: Focused cross-archetype regressions
        run: npx tsx --test src/services/upgrade-strategy-compatible-lane-v15.test.ts src/services/upgrade-theme-component-affinity-v15.test.ts
      - name: Full repository validation
        run: npm run check
      - name: Persist validation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/bench01-role-specific-requested-lane-validation
          cat > test-results/bench01-role-specific-requested-lane-validation/result.txt <<'EOF'
          product_source_sha=6686f2892e93cc571ee9e4f7717bb5f0156bd301
          source_integrity=green
          focused_cross_archetype_regressions=green
          full_repository_check=green
          product_acceptance=provisional-pending-frozen-replay-and-manual-whole-deck-review
          EOF
          git rm .github/workflows/bench01-role-specific-requested-lane-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-results/bench01-role-specific-requested-lane-validation/result.txt
          git commit -m 'validation(BENCH-01): validate role-specific requested lane [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
