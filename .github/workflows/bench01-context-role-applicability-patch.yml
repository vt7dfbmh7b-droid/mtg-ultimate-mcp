name: BENCH-01 context role applicability repair

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/bench01-context-role-applicability-patch.yml

concurrency:
  group: bench01-context-role-applicability-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/v15-native-deck-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply generic context-sensitive role applicability repair
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/services/upgrade.ts')
          text = path.read_text()
          text = text.replace("import { searchCards, summarizeCard } from './scryfall.js';", "import { getCardOracleText, searchCards, summarizeCard } from './scryfall.js';", 1)
          marker = "function cardMatchesRole(card: ScryfallCard, role: string, targetGate: UpgradeTargetGateV15 | null = null): boolean {"
          helper = r'''export function costReductionApplicableToCommanderIdentityV15(
            oracleText: string,
            allowedIdentity: readonly string[],
          ): boolean {
            const normalized = oracleText.toLocaleLowerCase();
            if (!normalized.includes('cost') || !normalized.includes('less')) return true;
            const colorSymbols: Record<string, string> = { white: 'W', blue: 'U', black: 'B', red: 'R', green: 'G' };
            const restricted = new Set<string>();
            for (const match of normalized.matchAll(/\b(white|blue|black|red|green)\b[^.\n]{0,100}\bspells? you cast\b[^.\n]{0,100}\bcost\b[^.\n]{0,80}\bless\b/g)) {
              const symbol = match[1] ? colorSymbols[match[1]] : undefined;
              if (symbol) restricted.add(symbol);
            }
            if (restricted.size == 0) return true;
            const identity = new Set(allowedIdentity.map((color) => color.toLocaleUpperCase()));
            return [...restricted].some((color) => identity.has(color));
          }

          export function cardRoleApplicableToDeckContextV15(
            card: ScryfallCard,
            role: string,
            allowedIdentity: readonly string[],
          ): boolean {
            if (role !== 'ramp') return true;
            const roles = new Set(effectiveCardRolesV15(card));
            if (!roles.has('cost reduction')) return true;
            if (roles.has('mana acceleration') || roles.has('land ramp')) return true;
            return costReductionApplicableToCommanderIdentityV15(getCardOracleText(card), allowedIdentity);
          }

          '''
          if marker not in text:
            raise SystemExit('cardMatchesRole marker not found')
          text = text.replace(marker, helper + marker, 1)
          old = ".filter((card) => card.legalities.commander === 'legal')\n      .filter((card) => cardMatchesRole(card, deficit.role, deficit.targetGate))"
          new = ".filter((card) => card.legalities.commander === 'legal')\n      .filter((card) => cardMatchesRole(card, deficit.role, deficit.targetGate))\n      .filter((card) => cardRoleApplicableToDeckContextV15(card, deficit.role, allowedIdentity))"
          if old not in text:
            raise SystemExit('candidate role filter block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('src/services/upgrade-context-role-applicability-v15.test.ts')
          test.write_text(r'''import assert from 'node:assert/strict';
          import test from 'node:test';
          import { costReductionApplicableToCommanderIdentityV15 } from './upgrade.js';

          test('color-restricted cost reduction is context-dead outside commander identity', () => {
            assert.equal(costReductionApplicableToCommanderIdentityV15('Black spells you cast cost {1} less to cast.', ['R', 'G']), false);
            assert.equal(costReductionApplicableToCommanderIdentityV15('Blue spells you cast cost {1} less to cast.', ['W', 'B']), false);
          });

          test('color-restricted cost reduction remains usable when the commander identity can cast that color', () => {
            assert.equal(costReductionApplicableToCommanderIdentityV15('Black spells you cast cost {1} less to cast.', ['B', 'G']), true);
            assert.equal(costReductionApplicableToCommanderIdentityV15('Red spells you cast cost {1} less to cast.', ['U', 'R']), true);
          });

          test('generic and non-color cost reduction stays available', () => {
            assert.equal(costReductionApplicableToCommanderIdentityV15('Artifact spells you cast cost {1} less to cast.', ['R', 'G']), true);
            assert.equal(costReductionApplicableToCommanderIdentityV15('Spells you cast cost {1} less to cast.', ['W']), true);
          });

          test('non-cost-reduction text is unaffected', () => {
            assert.equal(costReductionApplicableToCommanderIdentityV15('Add {B}{B}.', ['R', 'G']), true);
          });
          ''')
      - name: Focused regression
        run: npx tsx --test src/services/upgrade-context-role-applicability-v15.test.ts src/services/upgrade-aspirational-fallback-v15.test.ts src/services/upgrade-strategy-compatible-lane-v15.test.ts src/services/replacement-identity-pairing-v15.test.ts
      - name: Full repository validation
        run: npm run check
      - name: Commit repair and retire patch workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/bench01-context-role-applicability-patch.yml
          git add src/services/upgrade.ts src/services/upgrade-context-role-applicability-v15.test.ts .github/workflows/bench01-context-role-applicability-patch.yml
          git commit -m "fix(BENCH-01): reject context-dead role candidates"
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin agent/v15-native-deck-intelligence && git push origin HEAD:agent/v15-native-deck-intelligence && exit 0
            sleep $((attempt * 2))
          done
          exit 1
