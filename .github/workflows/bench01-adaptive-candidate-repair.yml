name: BENCH-01 Adaptive Candidate Diversification Repair

on:
  push:
    paths:
      - '.github/workflows/bench01-adaptive-candidate-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v15-native-deck-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply generic adaptive diversification repair
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path('src/services/optimizer-v12.ts')
          text = path.read_text()

          marker = "export async function refineCommanderDeckIterativelyV12(\n"
          helper = r'''export interface CandidateDiversificationBudgetV15 {
            minimumAttempts: number;
            hardLimit: number;
            adaptive: boolean;
          }

          export function candidateDiversificationBudgetV15(configuredAttempts?: number): CandidateDiversificationBudgetV15 {
            const explicitlyConfigured = configuredAttempts !== undefined && Number.isFinite(configuredAttempts);
            const minimumAttempts = Math.max(1, Math.min(6, Math.trunc(configuredAttempts ?? 3)));
            return {
              minimumAttempts,
              hardLimit: explicitlyConfigured ? minimumAttempts : 6,
              adaptive: !explicitlyConfigured && minimumAttempts < 6,
            };
          }

          export function shouldContinueCandidateDiversificationV15(input: {
            attemptsCompleted: number;
            budget: CandidateDiversificationBudgetV15;
            candidateProducedPlan: boolean;
            searchStateChanged: boolean;
          }): boolean {
            if (input.attemptsCompleted >= input.budget.hardLimit) return false;
            if (input.attemptsCompleted < input.budget.minimumAttempts) return true;
            if (!input.budget.adaptive) return false;
            return input.candidateProducedPlan && input.searchStateChanged;
          }

          '''
          if helper.strip() not in text:
            if marker not in text:
              raise SystemExit('refinement function marker not found')
            text = text.replace(marker, helper + marker, 1)

          old_budget = "  const candidatePackagesPerRound = Math.max(1, Math.min(6, Math.trunc(options.candidatePackagesPerRound ?? 3)));"
          new_budget = "  const candidateDiversification = candidateDiversificationBudgetV15(options.candidatePackagesPerRound);\n  const candidatePackagesPerRound = candidateDiversification.minimumAttempts;"
          if old_budget in text:
            text = text.replace(old_budget, new_budget, 1)
          elif new_budget not in text:
            raise SystemExit('candidate budget declaration not found')

          old_loop = '''      for (let candidate = 1; candidate <= candidatePackagesPerRound; candidate += 1) {
        const evaluated = await evaluateCandidate(
          candidate,
          currentParsed,
          currentCards,
          identity,
          { ...roundOptions, minimumImprovementScore: minScore, winRouteVerificationStatus: winRouteProtection.status },
          attemptSize,
          totalSpend,
          maxTotalUsd,
          new Set([...roundProtectedNames, ...strategyCutBlocked]),
          excludedNames,
          diversityBlocked,
          round,
          themeContext.intent,
          currentThemeAudit,
        );
        candidates.push(evaluated);
        if (evaluated.plan) diversifyNextPackage(diversityBlocked, evaluated.plan);
        diversifyRejectedStrategyCuts(strategyCutBlocked, evaluated);
        diversifyRejectedPackageAcceptanceCuts(strategyCutBlocked, evaluated);
      }'''
          new_loop = '''      for (let candidate = 1; candidate <= candidateDiversification.hardLimit; candidate += 1) {
        const diversityBlockedBefore = diversityBlocked.size;
        const strategyCutBlockedBefore = strategyCutBlocked.size;
        const evaluated = await evaluateCandidate(
          candidate,
          currentParsed,
          currentCards,
          identity,
          { ...roundOptions, minimumImprovementScore: minScore, winRouteVerificationStatus: winRouteProtection.status },
          attemptSize,
          totalSpend,
          maxTotalUsd,
          new Set([...roundProtectedNames, ...strategyCutBlocked]),
          excludedNames,
          diversityBlocked,
          round,
          themeContext.intent,
          currentThemeAudit,
        );
        candidates.push(evaluated);
        if (evaluated.plan) diversifyNextPackage(diversityBlocked, evaluated.plan);
        diversifyRejectedStrategyCuts(strategyCutBlocked, evaluated);
        diversifyRejectedPackageAcceptanceCuts(strategyCutBlocked, evaluated);
        const searchStateChanged = diversityBlocked.size > diversityBlockedBefore
          || strategyCutBlocked.size > strategyCutBlockedBefore;
        if (!shouldContinueCandidateDiversificationV15({
          attemptsCompleted: candidate,
          budget: candidateDiversification,
          candidateProducedPlan: evaluated.plan !== null,
          searchStateChanged,
        })) break;
      }'''
          if old_loop in text:
            text = text.replace(old_loop, new_loop, 1)
          elif new_loop not in text:
            raise SystemExit('candidate loop not found')

          old_output = "    candidatePackagesPerRound,\n    packageAcceptanceContract: effectiveOptions.packageAcceptanceContract ?? null,"
          new_output = "    candidatePackagesPerRound,\n    candidateDiversification,\n    packageAcceptanceContract: effectiveOptions.packageAcceptanceContract ?? null,"
          if old_output in text:
            text = text.replace(old_output, new_output, 1)
          elif new_output not in text:
            raise SystemExit('simple output marker not found')

          path.write_text(text)

          test_path = Path('src/services/optimizer-v12-candidate-diversification.test.ts')
          test_path.write_text(r'''import assert from 'node:assert/strict';
          import test from 'node:test';
          import {
            candidateDiversificationBudgetV15,
            shouldContinueCandidateDiversificationV15,
          } from './optimizer-v12.js';

          test('default candidate diversification keeps the historical minimum but can adapt to the existing hard ceiling', () => {
            assert.deepEqual(candidateDiversificationBudgetV15(), {
              minimumAttempts: 3,
              hardLimit: 6,
              adaptive: true,
            });
          });

          test('explicit candidate breadth remains an exact caller-controlled bound', () => {
            assert.deepEqual(candidateDiversificationBudgetV15(4), {
              minimumAttempts: 4,
              hardLimit: 4,
              adaptive: false,
            });
            assert.deepEqual(candidateDiversificationBudgetV15(99), {
              minimumAttempts: 6,
              hardLimit: 6,
              adaptive: false,
            });
          });

          test('adaptive diversification continues past the minimum only while a new search state is produced', () => {
            const budget = candidateDiversificationBudgetV15();
            assert.equal(shouldContinueCandidateDiversificationV15({
              attemptsCompleted: 2,
              budget,
              candidateProducedPlan: false,
              searchStateChanged: false,
            }), true);
            assert.equal(shouldContinueCandidateDiversificationV15({
              attemptsCompleted: 3,
              budget,
              candidateProducedPlan: true,
              searchStateChanged: true,
            }), true);
            assert.equal(shouldContinueCandidateDiversificationV15({
              attemptsCompleted: 4,
              budget,
              candidateProducedPlan: true,
              searchStateChanged: false,
            }), false);
            assert.equal(shouldContinueCandidateDiversificationV15({
              attemptsCompleted: 4,
              budget,
              candidateProducedPlan: false,
              searchStateChanged: true,
            }), false);
            assert.equal(shouldContinueCandidateDiversificationV15({
              attemptsCompleted: 6,
              budget,
              candidateProducedPlan: true,
              searchStateChanged: true,
            }), false);
          });
          ''')
      - name: Focused adaptive diversification regression
        run: npx tsx --test src/services/optimizer-v12-candidate-diversification.test.ts src/services/optimizer-v12-attempt-provenance.test.ts src/services/optimizer-v12-compound-theme-components.test.ts src/services/optimizer-v12-target-progress.test.ts
      - name: Full required validation
        run: npm run check
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/optimizer-v12.ts src/services/optimizer-v12-candidate-diversification.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(BENCH-01): adapt candidate diversification while search stays novel'
          git push origin HEAD:agent/v15-native-deck-intelligence
