name: Neutral FF Exact Budget Control

on:
  workflow_dispatch:
  push:
    branches: ["agent/neutral-budget"]
    paths: &control_paths
      - "scripts/e2e-neutral-ff-exact-budget-v15.ts"
      - "src/services/budget-printing-selector-v15.ts"
      - "src/services/exact-printing-budget-v15.ts"
      - "src/services/neutral-deck-builder-v15.ts"
      - "src/services/commander-build-pipeline-v15.ts"
      - "src/services/commander-build-evaluation-v15.ts"
      - "src/services/printing-policy-v08.ts"
      - "src/services/scryfall-paged-search-v15.ts"
      - "src/services/scryfall.ts"
      - ".github/workflows/neutral-ff-exact-budget-control.yml"
  pull_request:
    branches: [main]
    paths: *control_paths

permissions:
  contents: read

jobs:
  neutral-ff-exact-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Run neutral FF exact budget live control
        run: npx tsx scripts/e2e-neutral-ff-exact-budget-v15.ts
      - name: Upload FF budget control result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neutral-ff-exact-budget-${{ github.sha }}
          path: |
            neutral-ff-exact-budget-live-result.json
            neutral-ff-exact-budget-live-failure.txt
          if-no-files-found: ignore
          retention-days: 14
