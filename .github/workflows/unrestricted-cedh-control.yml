name: Unrestricted cEDH Control

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unrestricted-cedh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Build and independently verify unrestricted cEDH control
        run: npx tsx scripts/e2e-unrestricted-cedh-v15.ts
