name: Apply V0.15 Target Pressure Pass

on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - "scripts/apply-v15-target-pressure-pass.py"
      - "scripts/fix-v15-target-pressure-types.py"
      - ".github/workflows/apply-v15-target-pressure-pass.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v15-target-pressure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Apply exact target-pressure patch
        id: apply_patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 scripts/apply-v15-target-pressure-pass.py
            python3 scripts/fix-v15-target-pressure-types.py
          } 2>&1 | tee target-pressure-apply.log

      - name: Show scoped diff
        if: steps.apply_patch.outcome == 'success'
        run: git diff -- src/services/upgrade.ts src/services/deck-builder-v07.ts src/services/optimizer-v12.ts src/services/commander-build-pipeline-v15.ts

      - name: Install dependencies
        id: install
        if: steps.apply_patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee target-pressure-install.log

      - name: Type-check and build
        id: build
        if: steps.apply_patch.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee target-pressure-build.log

      - name: Run unit tests
        id: tests
        if: steps.apply_patch.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee target-pressure-tests.log

      - name: Commit validated integration changes
        if: steps.apply_patch.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success' && steps.tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- scripts/apply-v15-target-pressure-pass.py \
                    scripts/fix-v15-target-pressure-types.py \
                    .github/workflows/apply-v15-target-pressure-pass.yml
          git add -- src/services/upgrade.ts \
                     src/services/deck-builder-v07.ts \
                     src/services/optimizer-v12.ts \
                     src/services/commander-build-pipeline-v15.ts
          git commit -m "Wire V0.15 target pressure into Build and Upgrade"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Persist validation failure
        if: always() && !(steps.apply_patch.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success' && steps.tests.outcome == 'success')
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply_patch.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p test-results/target-pressure-pass
          printf 'source_sha=%s\napply=%s\ninstall=%s\nbuild=%s\ntests=%s\n' \
            "$GITHUB_SHA" "$APPLY_OUTCOME" "$INSTALL_OUTCOME" "$BUILD_OUTCOME" "$TEST_OUTCOME" \
            > test-results/target-pressure-pass/run-metadata.txt
          for file in target-pressure-apply.log target-pressure-install.log target-pressure-build.log target-pressure-tests.log; do
            if [ -f "$file" ]; then cp "$file" "test-results/target-pressure-pass/$file"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test-results/target-pressure-pass
          if ! git diff --cached --quiet; then
            git commit -m "test-results: record target-pressure validation failure"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          exit 1
