name: Apply V0.15 Target Pressure Pass

on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - "scripts/apply-v15-target-pressure-pass.py"
      - ".github/workflows/apply-v15-target-pressure-pass.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v15-target-pressure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Apply exact target-pressure patch
        run: python3 scripts/apply-v15-target-pressure-pass.py

      - name: Show scoped diff
        run: git diff -- src/services/upgrade.ts src/services/deck-builder-v07.ts src/services/optimizer-v12.ts src/services/commander-build-pipeline-v15.ts

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Remove one-shot patch infrastructure
        run: git rm -- scripts/apply-v15-target-pressure-pass.py .github/workflows/apply-v15-target-pressure-pass.yml

      - name: Commit validated integration changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/services/upgrade.ts \
                     src/services/deck-builder-v07.ts \
                     src/services/optimizer-v12.ts \
                     src/services/commander-build-pipeline-v15.ts
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 1
          fi
          git commit -m "Wire V0.15 target pressure into Build and Upgrade"
          git push origin "HEAD:${GITHUB_REF_NAME}"
