name: Scions & Spellcraft FF-Only Precon Validation

# Temporary validation-only workflow. Do not merge or promote from this branch.
on:
  push:
    branches: ["agent/scions-spellcraft-ff-only-validation"]
    paths:
      - "scripts/e2e-scions-spellcraft-ff-only-v15.ts"
      - ".github/workflows/scions-spellcraft-ff-only-live.yml"
  pull_request:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - "scripts/e2e-scions-spellcraft-ff-only-v15.ts"
      - ".github/workflows/scions-spellcraft-ff-only-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scions-spellcraft-ff-only-${{ github.ref }}
  cancel-in-progress: false

env:
  HTTP_RETRY_BASE_MS: 5000
  HTTP_RETRY_MAX_MS: 15000
  SCRYFALL_HTTP_RETRY_ATTEMPTS: 5
  SCRYFALL_MIN_REQUEST_GAP_MS: 750
  COMMANDER_SPELLBOOK_HTTP_RETRY_ATTEMPTS: 5

jobs:
  refine-scions-spellcraft:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build checked-in source
        run: npm run build

      - name: Run Scions & Spellcraft restricted precon refinement
        run: npx tsx scripts/e2e-scions-spellcraft-ff-only-v15.ts

      - name: Upload Scions validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scions-spellcraft-ff-only-${{ github.sha }}
          path: |
            scions-spellcraft-ff-only-result.json
            scions-spellcraft-stock-deck.txt
            scions-spellcraft-refined-deck.txt
            scions-spellcraft-ff-only-failure.txt
          if-no-files-found: ignore
          retention-days: 14
