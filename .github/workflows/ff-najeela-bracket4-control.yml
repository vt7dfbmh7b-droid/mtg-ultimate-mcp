name: FF Najeela High-Bracket-4 Control

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ff-najeela-bracket4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify and classify the FF-only Najeela high-Bracket-4 control
        run: npx tsx scripts/e2e-ff-najeela-bracket4-v15.ts
