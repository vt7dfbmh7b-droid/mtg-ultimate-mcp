name: FF Najeela High-Bracket-4 Control

on:
  workflow_dispatch:
  push:
    branches: ["agent/**"]
    paths:
      - "scripts/e2e-ff-najeela-bracket4-v15.ts"
      - "testdata/ff-najeela-powerful-baseline.txt"
      - ".github/workflows/ff-najeela-bracket4-control.yml"
      - "src/services/efficient-win-plan-v15.ts"
      - "src/services/bracket-ceiling-v15.ts"
      - "src/services/cedh-workflow-v14.ts"
      - "src/services/commander-rules.ts"
      - "src/services/printing-policy-v08.ts"
      - "src/services/scryfall.ts"
      - "src/services/spellbook.ts"

permissions:
  contents: read

jobs:
  ff-najeela-bracket4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify and classify the FF-only Najeela high-Bracket-4 control
        run: npx tsx scripts/e2e-ff-najeela-bracket4-v15.ts
