name: FF Najeela High-Bracket-4 Control

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ff-najeela-bracket4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Verify and classify the FF-only Najeela high-Bracket-4 control
        run: npx tsx scripts/e2e-ff-najeela-bracket4-v15.ts
