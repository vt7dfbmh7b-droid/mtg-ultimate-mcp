name: Counter Blitz A6 Package Optimizer

on:
  push:
    branches:
      - test/counter-blitz-a6-packages-20260829
    paths:
      - scripts/e2e-counter-blitz-a6-packages.ts
      - .github/workflows/counter-blitz-a6-packages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run A6 package optimizer
        run: |
          set -o pipefail
          npx tsx scripts/e2e-counter-blitz-a6-packages.ts | tee counter-blitz-a6-packages.log
      - name: Upload A6 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: counter-blitz-a6-packages-${{ github.sha }}
          path: |
            counter-blitz-a6-packages.log
            counter-blitz-a6-packages-result.json
            counter-blitz-a6-packages-deck.txt
            counter-blitz-a6-packages-failure.txt
          if-no-files-found: ignore
          retention-days: 14
