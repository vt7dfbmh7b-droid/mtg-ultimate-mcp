name: "BENCH-01 — Reconcile candidate breadth recovery state once"

on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - ".github/workflows/reconcile-bench01-breadth-state-once.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - name: Reconcile authoritative BENCH-01 state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('project-state.json', 'utf8'));
          state.updatedAt = new Date().toISOString();
          state.validation.activeBranchStatus = 'bench01-candidate-breadth-generalization-active';
          state.workMode.reason = 'BENCH-01 remains active. The corrected Batch D candidate-breadth result is durably persisted: Quick Draw and Virtue and Valor were unchanged at breadth 6, while Explorers of the Deep improved from 4 swaps/Bracket 2 to 9 swaps/Bracket 3. One positive fixture is insufficient for a product change, so cross-family breadth generalization is the current evidence gate.';
          state.validation.requiredBeforeResumingIntelligenceClaims = [
            'Keep the latest fully validated executable Commander baseline e17b0a1cba659b229fd6f0b6e2df79c5e464a616 frozen while BENCH-01 breadth-generalization evidence is collected.',
            'Treat the corrected Batch D candidate-breadth persistence gate as closed: the tracked Git blob is non-empty and records Quick Draw unchanged, Virtue and Valor unchanged, and Explorers of the Deep improved at breadth 6.',
            'Require repeated breadth sensitivity across an unrelated Commander family before authorizing any generic candidate-discovery/ranking repair; one positive Explorers fixture alone is insufficient.',
            'Do not weaken compound-theme/component preservation, legality, budget, printing, strategy-preservation, or simulation gates to manufacture target achievement.',
            'Keep the earlier Counter Blitz dense-countermagic allocation concern watch-only unless a broader cross-fixture batch reproduces it.',
            'Do not merge PR #29 or promote stable/current V0.13 until BENCH-01 becomes promotion-grade and all relevant validation evidence is green.'
          ];
          state.nextActions = [
            'Complete the frozen-source breadth-4 versus breadth-6 generalization diagnostic on at least one unseen component-rich typal family and one unrelated non-typal compound-theme family.',
            'If broader breadth repeatedly improves outcomes across unrelated families, inspect the shared bounded candidate-discovery/ranking architecture and justify only a generic repair with focused regressions before changing product intelligence.',
            'If the Explorers breadth effect does not reproduce, classify it as isolated bounded-search sensitivity, keep the current product source unchanged, and broaden BENCH-01 to another contrasting unseen batch.',
            'After the generalization verdict, reconcile project-state, roadmap, handoff, validation records and PR #29 in the same run before any merge or promotion decision.'
          ];
          fs.writeFileSync('project-state.json', JSON.stringify(state, null, 2) + '\n');

          let roadmap = fs.readFileSync('docs/ROADMAP.md', 'utf8');
          roadmap = roadmap.replace('### Batch D candidate-breadth diagnostic — COMPLETE / PERSISTENCE VERIFICATION ACTIVE', '### Batch D candidate-breadth diagnostic — COMPLETE / PERSISTENCE VERIFIED; CROSS-FIXTURE GENERALIZATION ACTIVE');
          const anchor = 'The diagnostic kept executable source frozen at `e17b0a1c...` and changed only `candidatePackagesPerRound` from the Batch D value 4 to the currently supported maximum 6.';
          const note = '\n\nRecovery correction (2026-09-06): durable Git-blob verification closed the persistence question. The tracked diagnostic is non-empty: Quick Draw and Virtue and Valor were unchanged, while Explorers improved from 4 swaps/Bracket 2 to 9 swaps/Bracket 3 at breadth 6. That is one positive fixture only, so no product repair is authorized yet; cross-family breadth generalization is the active BENCH-01 gate.';
          if (roadmap.includes(anchor) && !roadmap.includes('Recovery correction (2026-09-06): durable Git-blob verification')) roadmap = roadmap.replace(anchor, anchor + note);
          roadmap = roadmap.replace(/The first persistence attempt[^\n]*\n?/gi, '');
          roadmap = roadmap.replace(/A corrected persistence rerun[^\n]*\n?/gi, '');
          roadmap = roadmap.replace(/Before treating this as durable BENCH evidence[^\n]*\n?/gi, '');
          fs.writeFileSync('docs/ROADMAP.md', roadmap);
          NODE
          npx tsx scripts/generate-handoff.ts
          npm run validation:index
          npm run project:validate
          npm run validation:validate
          npm run project:resume > /tmp/project-resume.json
          npm run build
      - name: Persist reconciled state and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp project-state.json "$RUNNER_TEMP/project-state.json"
          cp docs/PROJECT-STATE.md "$RUNNER_TEMP/PROJECT-STATE.md"
          cp PROJECT_HANDOFF.md "$RUNNER_TEMP/PROJECT_HANDOFF.md"
          cp docs/ROADMAP.md "$RUNNER_TEMP/ROADMAP.md"
          cp validation-index.json "$RUNNER_TEMP/validation-index.json"
          cp docs/VALIDATION-STATE.md "$RUNNER_TEMP/VALIDATION-STATE.md"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp "$RUNNER_TEMP/project-state.json" project-state.json
            cp "$RUNNER_TEMP/PROJECT-STATE.md" docs/PROJECT-STATE.md
            cp "$RUNNER_TEMP/PROJECT_HANDOFF.md" PROJECT_HANDOFF.md
            cp "$RUNNER_TEMP/ROADMAP.md" docs/ROADMAP.md
            cp "$RUNNER_TEMP/validation-index.json" validation-index.json
            cp "$RUNNER_TEMP/VALIDATION-STATE.md" docs/VALIDATION-STATE.md
            git rm -f .github/workflows/reconcile-bench01-breadth-state-once.yml
            git add project-state.json docs/PROJECT-STATE.md PROJECT_HANDOFF.md docs/ROADMAP.md validation-index.json docs/VALIDATION-STATE.md
            git commit -m 'docs(BENCH-01): close breadth persistence gate [skip ci]'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "State reconciliation attempt ${attempt} lost a branch race; retrying."
          done
          exit 1
