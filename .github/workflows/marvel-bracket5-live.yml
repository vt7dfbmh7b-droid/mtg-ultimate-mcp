name: Marvel Bracket 5 Live Control

on:
  push:
    branches: ["agent/**"]
    paths:
      - "scripts/e2e-marvel-bracket5-v15.ts"
      - "scripts/e2e-marvel-bracket5-refine-v15.ts"
      - "src/services/printing-policy-v08.ts"
      - "src/services/printing-policy-v08.test.ts"
      - "src/services/printing-family-specials-v08.ts"
      - "src/services/scryfall.ts"
      - "src/services/card-role-truth-v15.test.ts"
      - "src/services/deck-builder-v07.ts"
      - "src/services/deck.ts"
      - "src/services/general-win-package-v15.ts"
      - "src/services/general-win-package-v15.test.ts"
      - "src/services/upgrade.ts"
      - "src/services/upgrade-restricted-pool-v15.test.ts"
      - ".github/workflows/marvel-bracket5-live.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/e2e-marvel-bracket5-v15.ts"
      - "scripts/e2e-marvel-bracket5-refine-v15.ts"
      - "src/services/printing-policy-v08.ts"
      - "src/services/printing-policy-v08.test.ts"
      - "src/services/printing-family-specials-v08.ts"
      - "src/services/scryfall.ts"
      - "src/services/card-role-truth-v15.test.ts"
      - "src/services/deck-builder-v07.ts"
      - "src/services/deck.ts"
      - "src/services/general-win-package-v15.ts"
      - "src/services/general-win-package-v15.test.ts"
      - "src/services/upgrade.ts"
      - "src/services/upgrade-restricted-pool-v15.test.ts"
      - ".github/workflows/marvel-bracket5-live.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-bracket5-live-${{ github.ref }}
  cancel-in-progress: false

env:
  HTTP_RETRY_BASE_MS: 5000
  HTTP_RETRY_MAX_MS: 15000
  SCRYFALL_HTTP_RETRY_ATTEMPTS: 5
  SCRYFALL_MIN_REQUEST_GAP_MS: 750
  COMMANDER_SPELLBOOK_HTTP_RETRY_ATTEMPTS: 5

jobs:
  marvel-bracket5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Type-check permanent Marvel printing-family policy
        id: source_build
        run: npm run build
      - name: Use existing four-card win-package maximum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/e2e-marvel-bracket5-v15.ts')
          t=p.read_text().replace('maxWinPackageCards: 3,','maxWinPackageCards: 4,')
          p.write_text(t)
          PY
      - name: Run Marvel permanent-family Bracket 5 target control
        id: marvel_control
        continue-on-error: true
        run: npx tsx scripts/e2e-marvel-bracket5-v15.ts
      - name: Refine Marvel permanent-family winner
        id: marvel_refine
        if: steps.marvel_control.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p test-results/marvel-bracket5
          cp marvel-bracket5-selected-deck.txt test-results/marvel-bracket5/selected-deck.txt
          npx tsx scripts/e2e-marvel-bracket5-refine-v15.ts
      - name: Require broad whole-deck target and mana quality
        id: target_quality
        if: steps.marvel_refine.outcome == 'success'
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('marvel-bracket5-refine-result.json', 'utf8'));
          if (result.refinement?.status !== 'refined' || Number(result.refinement?.totalSwaps) < 1) {
            throw new Error('Broad Marvel refinement did not accept a supported package.');
          }
          if (
            result.finalDeck?.hardGatesPassed !== true
            || result.finalDeck?.commanderLegal !== true
            || result.finalDeck?.cardCount !== 100
            || result.finalDeck?.printingPolicySatisfied !== true
          ) {
            throw new Error('Broad Marvel refinement failed hard truth, Commander legality, exact-100, or printing-family truth.');
          }
          if ((result.delta?.failedBracket5ChecksAdded ?? []).length > 0) {
            throw new Error(`Broad Marvel refinement added failed gates: ${result.delta.failedBracket5ChecksAdded.join(', ')}`);
          }
          if (!(result.delta?.failedBracket5ChecksRemoved ?? []).includes('average-nonland-mv')) {
            throw new Error('Broad Marvel refinement did not repair the active curve gate.');
          }
          const before = result.startingDeck?.metrics ?? {};
          const after = result.finalDeck?.metrics ?? {};
          const averageNonlandManaValue = Number(after.averageNonlandManaValue);
          if (!Number.isFinite(averageNonlandManaValue) || averageNonlandManaValue > 2.6) {
            throw new Error('Broad Marvel refinement did not cross the Bracket-5 curve threshold.');
          }
          const positiveFloors = {
            earlyPlayCount: 20,
            rampCount: 14,
            drawCount: 14,
            interactionCount: 18,
            protectionCount: 8,
            tutorCount: 10,
            recursionCount: 4,
            boardWipeCount: 2,
            persistentColoredManaSourceCount: 8,
          };
          for (const [key, target] of Object.entries(positiveFloors)) {
            const beforeValue = Number(before[key]);
            const afterValue = Number(after[key]);
            if (!Number.isFinite(beforeValue) || !Number.isFinite(afterValue)) {
              throw new Error(`${key} is missing from broad before/after evidence.`);
            }
            const floor = Math.min(beforeValue, target);
            if (afterValue < floor) throw new Error(`${key} fell below its structural floor of ${floor}.`);
          }
          console.log(`Broad target quality passed with persistent colored mana ${before.persistentColoredManaSourceCount}→${after.persistentColoredManaSourceCount}.`);
          NODE
      - name: Require broad cut-strategy evidence
        id: strategy_quality
        if: steps.marvel_refine.outcome == 'success'
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('marvel-bracket5-refine-result.json', 'utf8'));
          const accepted = (result.refinement?.detailedRounds ?? []).filter((round) => round.accepted === true);
          if (accepted.length < 1) throw new Error('Broad Marvel refinement has no accepted-round evidence.');
          for (const round of accepted) {
            const winner = (round.candidateComparisons ?? []).find((candidate) => candidate.candidate === round.winningCandidate);
            const strategy = winner?.strategyPreservation;
            if (!strategy?.evidenceComplete || strategy.status !== 'preserved' || (strategy.meaningfulLosses ?? []).length > 0) {
              throw new Error(`Accepted broad round ${round.round} failed aggregate strategy preservation.`);
            }
            if (winner?.significantRegression !== false) {
              throw new Error(`Accepted broad round ${round.round} has a significant simulation regression.`);
            }
            const swaps = winner?.swaps ?? [];
            if (swaps.length < 1) throw new Error(`Accepted broad round ${round.round} has no per-swap evidence.`);
            for (const swap of swaps) {
              const pairing = swap.structuralPairing ?? {};
              if (pairing.strategyPreservation?.verdict !== 'preserved') {
                throw new Error(`Accepted broad round ${round.round} contains an unpreserved pairing.`);
              }
              const afterSources = Number(pairing.persistentColoredManaSourcesAfterSwap);
              const sourceFloor = Number(pairing.persistentColoredManaSourceFloor);
              if (!Number.isFinite(afterSources) || !Number.isFinite(sourceFloor) || afterSources < sourceFloor) {
                throw new Error(`Accepted broad round ${round.round} violates its persistent colored-mana floor.`);
              }
            }
          }
          console.log(`Broad strategy quality passed for ${accepted.length} accepted round(s).`);
          NODE
      - name: Persist live result on isolated branch
        id: persist_result
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true
        env:
          BUILD_OUTCOME: ${{ steps.source_build.outcome }}
          CONTROL_OUTCOME: ${{ steps.marvel_control.outcome }}
          REFINE_OUTCOME: ${{ steps.marvel_refine.outcome }}
          TARGET_QUALITY_OUTCOME: ${{ steps.target_quality.outcome }}
          STRATEGY_QUALITY_OUTCOME: ${{ steps.strategy_quality.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p test-results/marvel-bracket5-broad
            rm -f test-results/marvel-bracket5-broad/live-result.json test-results/marvel-bracket5-broad/selected-deck.txt test-results/marvel-bracket5-broad/refine-result.json test-results/marvel-bracket5-broad/refined-deck.txt test-results/marvel-bracket5-broad/failure.txt
            [ ! -f marvel-bracket5-live-result.json ] || cp marvel-bracket5-live-result.json test-results/marvel-bracket5-broad/live-result.json
            [ ! -f marvel-bracket5-selected-deck.txt ] || cp marvel-bracket5-selected-deck.txt test-results/marvel-bracket5-broad/selected-deck.txt
            [ ! -f marvel-bracket5-refine-result.json ] || cp marvel-bracket5-refine-result.json test-results/marvel-bracket5-broad/refine-result.json
            [ ! -f marvel-bracket5-refined-deck.txt ] || cp marvel-bracket5-refined-deck.txt test-results/marvel-bracket5-broad/refined-deck.txt
            [ ! -f marvel-bracket5-live-failure.txt ] || cp marvel-bracket5-live-failure.txt test-results/marvel-bracket5-broad/failure.txt
            AGGREGATE_OUTCOME=failure
            if [ "$BUILD_OUTCOME" = success ] \
              && [ "$CONTROL_OUTCOME" = success ] \
              && [ "$REFINE_OUTCOME" = success ] \
              && [ "$TARGET_QUALITY_OUTCOME" = success ] \
              && [ "$STRATEGY_QUALITY_OUTCOME" = success ]; then
              AGGREGATE_OUTCOME=success
            fi
            printf 'source_sha=%s\nworkflow_source_sha=%s\nexecuted_head_sha=%s\ncontrol_outcome=%s\nbuild_outcome=%s\nconstruction_outcome=%s\nrefine_outcome=%s\ntarget_quality_outcome=%s\nstrategy_preservation_outcome=%s\npolicy=permanent-production-presets\nmax_win_package_cards=4\nexact_card_count=true\ncommander_legality=true\nprinting_family_truth=true\npersistent_colored_mana_floor=true\nmeaningful_strategy_loss_rejected=true\n' \
              "$GITHUB_SHA" "$GITHUB_SHA" "$GITHUB_SHA" "$AGGREGATE_OUTCOME" "$BUILD_OUTCOME" "$CONTROL_OUTCOME" "$REFINE_OUTCOME" "$TARGET_QUALITY_OUTCOME" "$STRATEGY_QUALITY_OUTCOME" \
              > test-results/marvel-bracket5-broad/run-metadata.txt
            npm run validation:index
            git add -- test-results/marvel-bracket5-broad validation-index.json docs/VALIDATION-STATE.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "test-results: persist Marvel permanent-family Bracket 5 control [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Evidence persistence attempt ${attempt} lost a branch race; retrying against the latest head."
          done
          echo 'Evidence persistence exhausted eight branch-race retries.' >&2
          exit 1
      - name: Require Marvel controls to execute successfully
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.source_build.outcome }}
          CONTROL_OUTCOME: ${{ steps.marvel_control.outcome }}
          REFINE_OUTCOME: ${{ steps.marvel_refine.outcome }}
          TARGET_QUALITY_OUTCOME: ${{ steps.target_quality.outcome }}
          STRATEGY_QUALITY_OUTCOME: ${{ steps.strategy_quality.outcome }}
        run: |
          test "$BUILD_OUTCOME" = "success"
          test "$CONTROL_OUTCOME" = "success"
          test "$REFINE_OUTCOME" = "success"
          test "$TARGET_QUALITY_OUTCOME" = "success"
          test "$STRATEGY_QUALITY_OUTCOME" = "success"
      - name: Require live-result persistence
        if: ${{ always() && github.event_name == 'push' }}
        env:
          PERSIST_OUTCOME: ${{ steps.persist_result.outcome }}
        run: test "$PERSIST_OUTCOME" = "success"
