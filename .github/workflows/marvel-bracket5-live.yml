name: Marvel Bracket 5 Live Control

on:
  push:
    branches: ["agent/**"]
    paths:
      - "scripts/e2e-marvel-bracket5-v15.ts"
      - "scripts/e2e-marvel-bracket5-refine-v15.ts"
      - "src/services/printing-policy-v08.ts"
      - "src/services/printing-policy-v08.test.ts"
      - "src/services/printing-family-specials-v08.ts"
      - "src/services/scryfall.ts"
      - "src/services/card-role-truth-v15.test.ts"
      - "src/services/deck-builder-v07.ts"
      - "src/services/general-win-package-v15.ts"
      - "src/services/general-win-package-v15.test.ts"
      - "src/services/upgrade.ts"
      - "src/services/upgrade-restricted-pool-v15.test.ts"
      - ".github/workflows/marvel-bracket5-live.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/e2e-marvel-bracket5-v15.ts"
      - "scripts/e2e-marvel-bracket5-refine-v15.ts"
      - "src/services/printing-policy-v08.ts"
      - "src/services/printing-policy-v08.test.ts"
      - "src/services/printing-family-specials-v08.ts"
      - "src/services/scryfall.ts"
      - "src/services/card-role-truth-v15.test.ts"
      - "src/services/deck-builder-v07.ts"
      - "src/services/general-win-package-v15.ts"
      - "src/services/general-win-package-v15.test.ts"
      - "src/services/upgrade.ts"
      - "src/services/upgrade-restricted-pool-v15.test.ts"
      - ".github/workflows/marvel-bracket5-live.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-bracket5-live-${{ github.ref }}
  cancel-in-progress: true

env:
  HTTP_RETRY_BASE_MS: 5000
  HTTP_RETRY_MAX_MS: 15000
  SCRYFALL_HTTP_RETRY_ATTEMPTS: 5
  SCRYFALL_MIN_REQUEST_GAP_MS: 750
  COMMANDER_SPELLBOOK_HTTP_RETRY_ATTEMPTS: 5

jobs:
  marvel-bracket5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Type-check permanent Marvel printing-family policy
        run: npm run build
      - name: Use existing four-card win-package maximum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/e2e-marvel-bracket5-v15.ts')
          t=p.read_text().replace('maxWinPackageCards: 3,','maxWinPackageCards: 4,')
          p.write_text(t)
          PY
      - name: Run Marvel permanent-family Bracket 5 target control
        id: marvel_control
        continue-on-error: true
        run: npx tsx scripts/e2e-marvel-bracket5-v15.ts
      - name: Refine Marvel permanent-family winner
        id: marvel_refine
        if: steps.marvel_control.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p test-results/marvel-bracket5
          cp marvel-bracket5-selected-deck.txt test-results/marvel-bracket5/selected-deck.txt
          npx tsx scripts/e2e-marvel-bracket5-refine-v15.ts
      - name: Persist live result on isolated branch
        if: ${{ always() && github.event_name == 'push' }}
        env:
          CONTROL_OUTCOME: ${{ steps.marvel_control.outcome }}
          REFINE_OUTCOME: ${{ steps.marvel_refine.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/marvel-bracket5
          rm -f test-results/marvel-bracket5/live-result.json test-results/marvel-bracket5/selected-deck.txt test-results/marvel-bracket5/refine-result.json test-results/marvel-bracket5/refined-deck.txt test-results/marvel-bracket5/failure.txt
          [ ! -f marvel-bracket5-live-result.json ] || cp marvel-bracket5-live-result.json test-results/marvel-bracket5/live-result.json
          [ ! -f marvel-bracket5-selected-deck.txt ] || cp marvel-bracket5-selected-deck.txt test-results/marvel-bracket5/selected-deck.txt
          [ ! -f marvel-bracket5-refine-result.json ] || cp marvel-bracket5-refine-result.json test-results/marvel-bracket5/refine-result.json
          [ ! -f marvel-bracket5-refined-deck.txt ] || cp marvel-bracket5-refined-deck.txt test-results/marvel-bracket5/refined-deck.txt
          [ ! -f marvel-bracket5-live-failure.txt ] || cp marvel-bracket5-live-failure.txt test-results/marvel-bracket5/failure.txt
          printf 'source_sha=%s\ncontrol_outcome=%s\nrefine_outcome=%s\npolicy=permanent-production-presets\nmax_win_package_cards=4\n' "$GITHUB_SHA" "$CONTROL_OUTCOME" "$REFINE_OUTCOME" > test-results/marvel-bracket5/run-metadata.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test-results/marvel-bracket5
          if ! git diff --cached --quiet; then git commit -m "test-results: persist Marvel permanent-family Bracket 5 control" && git push origin "HEAD:${GITHUB_REF_NAME}"; fi
      - name: Require Marvel controls to execute successfully
        if: always()
        env:
          CONTROL_OUTCOME: ${{ steps.marvel_control.outcome }}
          REFINE_OUTCOME: ${{ steps.marvel_refine.outcome }}
        run: |
          test "$CONTROL_OUTCOME" = "success"
          test "$REFINE_OUTCOME" = "success"
