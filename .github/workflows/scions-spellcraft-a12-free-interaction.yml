name: Scions & Spellcraft A12 Free Interaction

on:
  push:
    branches:
      - test/scions-spellcraft-a12-free-interaction-20260831
  workflow_dispatch:

jobs:
  scions-a12-free-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run A12 free interaction isolation
        run: npx tsx scripts/e2e-scions-spellcraft-a12-free-interaction.ts
      - name: Upload A12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scions-spellcraft-a12-free-interaction-${{ github.sha }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            scions-spellcraft-a12-free-interaction.json
            scions-spellcraft-a12-free-interaction.md
