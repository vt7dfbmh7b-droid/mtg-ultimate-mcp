name: FF cEDH Fast Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ff-cedh-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Verify FF cEDH path or truthful restricted ceiling
        run: npx tsx scripts/e2e-ff-cedh-refine.ts
