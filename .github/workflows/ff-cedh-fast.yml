name: FF cEDH Fast Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ff-cedh-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify FF cEDH path or truthful restricted ceiling
        run: npx tsx scripts/e2e-ff-cedh-refine.ts
