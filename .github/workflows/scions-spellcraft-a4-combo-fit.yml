name: Scions & Spellcraft A4 Combo Fit

on:
  push:
    branches:
      - test/scions-spellcraft-a4-combo-fit-20260831
  workflow_dispatch:

jobs:
  test-scions-a4-combo-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run Scions A4 combo-fit screen
        run: npx tsx scripts/e2e-scions-spellcraft-a4-combo-fit.ts
      - name: Upload Scions A4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scions-spellcraft-a4-combo-fit-${{ github.sha }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            scions-spellcraft-a4-combo-fit.json
            scions-spellcraft-a4-combo-fit.md
