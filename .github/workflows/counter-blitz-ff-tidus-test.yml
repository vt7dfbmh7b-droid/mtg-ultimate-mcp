name: Counter Blitz FF Tidus Exploratory Test

on:
  push:
    branches:
      - test/counter-blitz-ff-tidus-20260829
    paths:
      - .github/workflows/counter-blitz-ff-tidus-test.yml

permissions:
  contents: read

jobs:
  counter-blitz-ff-tidus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Retarget and aggressively tune FF control for Tidus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/e2e-ff-bracket5.ts')
          s = p.read_text()
          replacements = [
              ("const commander = 'Najeela, the Blade-Blossom';", 'const commander = "Tidus, Yuna\'s Guardian";'),
              ('maxCandidatesToVerify: 8,', 'maxCandidatesToVerify: 24,'),
              ('maxEfficiencySwaps: 3,', 'maxEfficiencySwaps: 10,'),
              ('maxManaBaseSwaps: 5,', 'maxManaBaseSwaps: 10,'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected tuning token not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Run strongest FF-only Tidus construction
        run: |
          set -o pipefail
          npx tsx scripts/e2e-ff-bracket5.ts | tee counter-blitz-ff-tidus.log
      - name: Upload result log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: counter-blitz-ff-tidus-${{ github.sha }}
          path: counter-blitz-ff-tidus.log
          if-no-files-found: ignore
          retention-days: 14
