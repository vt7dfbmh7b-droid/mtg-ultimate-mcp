name: Counter Blitz A11 Access Audit

on:
  push:
    branches:
      - test/counter-blitz-a11-access-audit-20260829
    paths:
      - scripts/e2e-counter-blitz-a11-access-audit.ts
      - .github/workflows/counter-blitz-a11-access-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run A11 access audit
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/e2e-counter-blitz-a11-access-audit.ts | tee counter-blitz-a11.log
      - name: Upload A11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-blitz-a11-${{ github.sha }}
          path: |
            counter-blitz-a11.log
            counter-blitz-a11-access-audit.json
          if-no-files-found: ignore
          retention-days: 14
