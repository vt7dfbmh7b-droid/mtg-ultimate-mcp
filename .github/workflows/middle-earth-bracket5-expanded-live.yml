name: Expanded Middle-earth Bracket 5 Live Control

on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - "scripts/e2e-printing-family-policy-v15.ts"
      - "scripts/e2e-middle-earth-bracket5-expanded-v15.ts"
      - "src/services/printing-policy-v08.ts"
      - "src/services/printing-policy-v08.test.ts"
      - "src/services/printing-family-specials-v08.ts"
      - "src/services/scryfall.ts"
      - "src/services/card-role-truth-v15.test.ts"
      - "src/services/win-route-setup-interruption-v15.test.ts"
      - "src/services/upgrade.ts"
      - "src/services/upgrade-restricted-pool-v15.test.ts"
      - ".github/workflows/middle-earth-bracket5-expanded-live.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ultimate-mtg-evidence-writer-${{ github.ref }}
  cancel-in-progress: false

env:
  HTTP_RETRY_BASE_MS: 5000
  HTTP_RETRY_MAX_MS: 15000
  SCRYFALL_HTTP_RETRY_ATTEMPTS: 5
  SCRYFALL_MIN_REQUEST_GAP_MS: 750
  COMMANDER_SPELLBOOK_HTTP_RETRY_ATTEMPTS: 5

jobs:
  expanded-middle-earth-bracket5:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci

      - name: Type-check and build permanent printing-family policy
        id: production_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee printing-family-production-build.log

      - name: Run full unit suite against permanent policy
        id: production_tests
        if: steps.production_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee printing-family-production-tests.log

      - name: Prove normal Marvel and Middle-earth Build paths
        id: production_proof
        if: steps.production_build.outcome == 'success' && steps.production_tests.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/e2e-printing-family-policy-v15.ts 2>&1 | tee printing-family-production-proof.log

      - name: Persist production printing-family proof
        id: persist_production_proof
        if: always()
        continue-on-error: true
        env:
          BUILD_OUTCOME: ${{ steps.production_build.outcome }}
          TEST_OUTCOME: ${{ steps.production_tests.outcome }}
          PROOF_OUTCOME: ${{ steps.production_proof.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          mkdir -p test-results/printing-family-production-proof
          rm -f test-results/printing-family-production-proof/result.json \
                test-results/printing-family-production-proof/failure.txt \
                test-results/printing-family-production-proof/build.log \
                test-results/printing-family-production-proof/tests.log \
                test-results/printing-family-production-proof/proof.log
          [ ! -f printing-family-production-proof.json ] || cp printing-family-production-proof.json test-results/printing-family-production-proof/result.json
          [ ! -f printing-family-production-proof-failure.txt ] || cp printing-family-production-proof-failure.txt test-results/printing-family-production-proof/failure.txt
          [ ! -f printing-family-production-build.log ] || cp printing-family-production-build.log test-results/printing-family-production-proof/build.log
          [ ! -f printing-family-production-tests.log ] || cp printing-family-production-tests.log test-results/printing-family-production-proof/tests.log
          [ ! -f printing-family-production-proof.log ] || cp printing-family-production-proof.log test-results/printing-family-production-proof/proof.log
          printf 'source_sha=%s\nbuild_outcome=%s\ntest_outcome=%s\nproof_outcome=%s\npolicy=permanent-production-presets\n' \
            "$GITHUB_SHA" "$BUILD_OUTCOME" "$TEST_OUTCOME" "$PROOF_OUTCOME" \
            > test-results/printing-family-production-proof/run-metadata.txt
          git add -- test-results/printing-family-production-proof
          if ! git diff --cached --quiet; then
            git commit -m "test-results: persist production printing-family proof [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Require production family-policy validation
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.production_build.outcome }}
          TEST_OUTCOME: ${{ steps.production_tests.outcome }}
          PROOF_OUTCOME: ${{ steps.production_proof.outcome }}
        run: |
          test "$BUILD_OUTCOME" = "success"
          test "$TEST_OUTCOME" = "success"
          test "$PROOF_OUTCOME" = "success"

      - name: Run expanded Middle-earth permanent-family control
        id: live_control
        if: ${{ always() && steps.production_build.outcome == 'success' && steps.production_tests.outcome == 'success' && steps.production_proof.outcome == 'success' }}
        continue-on-error: true
        run: npx tsx scripts/e2e-middle-earth-bracket5-expanded-v15.ts

      - name: Persist Middle-earth benchmark result
        id: persist_middle_earth
        if: always()
        continue-on-error: true
        env:
          CONTROL_OUTCOME: ${{ steps.live_control.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          mkdir -p test-results/middle-earth-bracket5-expanded
          rm -f test-results/middle-earth-bracket5-expanded/result.json \
                test-results/middle-earth-bracket5-expanded/selected-deck.txt \
                test-results/middle-earth-bracket5-expanded/refined-deck.txt \
                test-results/middle-earth-bracket5-expanded/failure.txt
          [ ! -f middle-earth-bracket5-expanded-result.json ] || cp middle-earth-bracket5-expanded-result.json test-results/middle-earth-bracket5-expanded/result.json
          [ ! -f middle-earth-bracket5-expanded-selected-deck.txt ] || cp middle-earth-bracket5-expanded-selected-deck.txt test-results/middle-earth-bracket5-expanded/selected-deck.txt
          [ ! -f middle-earth-bracket5-expanded-refined-deck.txt ] || cp middle-earth-bracket5-expanded-refined-deck.txt test-results/middle-earth-bracket5-expanded/refined-deck.txt
          [ ! -f middle-earth-bracket5-expanded-failure.txt ] || cp middle-earth-bracket5-expanded-failure.txt test-results/middle-earth-bracket5-expanded/failure.txt
          printf 'source_sha=%s\ncontrol_outcome=%s\npolicy=permanent-production-presets\nmax_win_package_cards=4\n' "$GITHUB_SHA" "$CONTROL_OUTCOME" > test-results/middle-earth-bracket5-expanded/run-metadata.txt
          git add -- test-results/middle-earth-bracket5-expanded
          if ! git diff --cached --quiet; then
            git commit -m "test-results: persist Middle-earth production-family control [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Require expanded control success
        if: always()
        env:
          CONTROL_OUTCOME: ${{ steps.live_control.outcome }}
        run: test "$CONTROL_OUTCOME" = "success"

      - name: Require evidence persistence
        if: always()
        env:
          PRODUCTION_PERSIST_OUTCOME: ${{ steps.persist_production_proof.outcome }}
          MIDDLE_EARTH_PERSIST_OUTCOME: ${{ steps.persist_middle_earth.outcome }}
        run: |
          test "$PRODUCTION_PERSIST_OUTCOME" = "success"
          test "$MIDDLE_EARTH_PERSIST_OUTCOME" = "success"
