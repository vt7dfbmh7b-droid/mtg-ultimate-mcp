name: Apply V0.15 Restricted Pool Pass

on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - "scripts/apply-v15-restricted-pool-pass.py"
      - ".github/workflows/apply-v15-restricted-pool-pass.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v15-restricted-pool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Apply exact restricted-pool patch
        id: apply_patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply-v15-restricted-pool-pass.py 2>&1 | tee restricted-pool-apply.log

      - name: Install dependencies
        id: install
        if: steps.apply_patch.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - name: Type-check and build
        id: build
        if: steps.apply_patch.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Run unit tests
        id: tests
        if: steps.apply_patch.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Commit validated source change
        if: steps.apply_patch.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success' && steps.tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- scripts/apply-v15-restricted-pool-pass.py .github/workflows/apply-v15-restricted-pool-pass.yml
          git add -- src/services/neutral-deck-builder-v15.ts src/services/deck-builder-v07.ts
          git commit -m "Reuse V0.15 bounded pool in constrained targeted builds"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Persist validation failure
        if: always() && !(steps.apply_patch.outcome == 'success' && steps.install.outcome == 'success' && steps.build.outcome == 'success' && steps.tests.outcome == 'success')
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply_patch.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p test-results/restricted-pool-pass
          printf 'source_sha=%s\napply=%s\ninstall=%s\nbuild=%s\ntests=%s\n' \
            "$GITHUB_SHA" "$APPLY_OUTCOME" "$INSTALL_OUTCOME" "$BUILD_OUTCOME" "$TEST_OUTCOME" \
            > test-results/restricted-pool-pass/run-metadata.txt
          if [ -f restricted-pool-apply.log ]; then cp restricted-pool-apply.log test-results/restricted-pool-pass/; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test-results/restricted-pool-pass
          if ! git diff --cached --quiet; then
            git commit -m "test-results: record restricted-pool validation failure"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          exit 1
