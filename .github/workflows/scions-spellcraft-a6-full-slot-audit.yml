name: Scions & Spellcraft A6 Full Slot Audit

on:
  push:
    branches:
      - test/scions-spellcraft-a6-full-slot-audit-20260831
  workflow_dispatch:

jobs:
  scions-a6-full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run A6 full slot audit
        run: npx tsx scripts/e2e-scions-spellcraft-a6-full-slot-audit.ts
      - name: Upload A6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scions-spellcraft-a6-full-slot-audit-${{ github.sha }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            scions-spellcraft-a6-full-slot-audit.json
            scions-spellcraft-a6-full-slot-audit.md
            test-results/exploratory/scions-spellcraft-a5-deck.txt
