name: Marvel Target Pressure Sequential Validation

on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - ".github/workflows/marvel-target-pressure-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-target-pressure-sequential-${{ github.ref }}
  cancel-in-progress: true

env:
  HTTP_RETRY_BASE_MS: 5000
  HTTP_RETRY_MAX_MS: 15000
  SCRYFALL_HTTP_RETRY_ATTEMPTS: 5
  SCRYFALL_MIN_REQUEST_GAP_MS: 750
  COMMANDER_SPELLBOOK_HTTP_RETRY_ATTEMPTS: 5

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run fresh Marvel-only Bracket 5 Build control
        id: build_control
        continue-on-error: true
        run: npx tsx scripts/e2e-marvel-bracket5-v15.ts

      - name: Stage fresh Build output for refinement
        if: steps.build_control.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/marvel-bracket5
          cp marvel-bracket5-live-result.json test-results/marvel-bracket5/live-result.json
          cp marvel-bracket5-selected-deck.txt test-results/marvel-bracket5/selected-deck.txt

      - name: Run refinement against fresh Build output
        id: refine_control
        if: steps.build_control.outcome == 'success'
        continue-on-error: true
        run: npx tsx scripts/e2e-marvel-bracket5-refine-v15.ts

      - name: Persist sequential validation results
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build_control.outcome }}
          REFINE_OUTCOME: ${{ steps.refine_control.outcome }}
        run: |
          set -euo pipefail
          mkdir -p test-results/marvel-bracket5
          if [ -f marvel-bracket5-live-result.json ]; then
            cp marvel-bracket5-live-result.json test-results/marvel-bracket5/live-result.json
          fi
          if [ -f marvel-bracket5-selected-deck.txt ]; then
            cp marvel-bracket5-selected-deck.txt test-results/marvel-bracket5/selected-deck.txt
          fi
          if [ -f marvel-bracket5-live-failure.txt ]; then
            cp marvel-bracket5-live-failure.txt test-results/marvel-bracket5/failure.txt
          else
            rm -f test-results/marvel-bracket5/failure.txt
          fi
          if [ -f marvel-bracket5-refine-result.json ]; then
            cp marvel-bracket5-refine-result.json test-results/marvel-bracket5/refine-result.json
          fi
          if [ -f marvel-bracket5-refined-deck.txt ]; then
            cp marvel-bracket5-refined-deck.txt test-results/marvel-bracket5/refined-deck.txt
          fi
          if [ -f marvel-bracket5-refine-failure.txt ]; then
            cp marvel-bracket5-refine-failure.txt test-results/marvel-bracket5/refine-failure.txt
          else
            rm -f test-results/marvel-bracket5/refine-failure.txt
          fi
          printf 'source_sha=%s\nbuild_outcome=%s\nrefine_outcome=%s\n' \
            "$GITHUB_SHA" "$BUILD_OUTCOME" "$REFINE_OUTCOME" \
            > test-results/marvel-bracket5/target-pressure-validation-metadata.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/marvel-target-pressure-validation.yml
          git add -- test-results/marvel-bracket5
          git commit -m "test-results: validate V0.15 target pressure with Marvel controls"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Require both live controls to succeed
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build_control.outcome }}
          REFINE_OUTCOME: ${{ steps.refine_control.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" != "success" ] || [ "$REFINE_OUTCOME" != "success" ]; then
            exit 1
          fi
