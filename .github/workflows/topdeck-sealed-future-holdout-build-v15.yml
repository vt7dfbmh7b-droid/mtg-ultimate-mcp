name: TopDeck Sealed Future Holdout Build V0.15

on:
  workflow_dispatch:
    inputs:
      seal_artifact_reference:
        description: Immutable private GHCR future-holdout seal reference
        required: true
        type: string
      future_joined_artifact_references_json:
        description: JSON array of immutable private GHCR joined-evidence references collected after the seal
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: topdeck-sealed-future-holdout-build-v15
  cancel-in-progress: false

env:
  TOPDECK_PACKAGE_NAME: mtg-ultimate-mcp-topdeck-evidence
  SEAL_PRIVATE_FILE: topdeck-promotion-future-holdout-seal-private-v15.json
  CORPUS_PRIVATE_FILE: topdeck-promotion-corpus-private-v15.json
  JOINED_PRIVATE_FILE: topdeck-promotion-joined-private-v15.json
  INDEX_FILE: future-joined-evidence-index-v15.json
  PRIVATE_HOLDOUT_FILE: topdeck-sealed-future-holdout-private-v15.json
  AUDIT_FILE: topdeck-sealed-future-holdout-audit-v15.json
  DESCRIPTOR_FILE: topdeck-sealed-future-holdout-private-oci-descriptor-v15.json
  HOLDOUT_ARTIFACT_TYPE: application/vnd.mtg-ultimate.topdeck-sealed-future-holdout.v1
  HOLDOUT_LAYER_MEDIA_TYPE: application/vnd.mtg-ultimate.topdeck-sealed-future-holdout.v1+json

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Set up ORAS before sealed-code checkout
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.3

      - name: Verify TopDeck evidence package is private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ENCODED_PACKAGE=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["TOPDECK_PACKAGE_NAME"], safe=""), end="")')
          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/users/${OWNER}/packages/container/${ENCODED_PACKAGE}")
          [[ "$HTTP_CODE" == "200" ]] || { echo "Could not verify TopDeck evidence package privacy; HTTP $HTTP_CODE." >&2; exit 1; }
          VISIBILITY=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("visibility", ""), end="")' "$RESPONSE_FILE")
          rm -f "$RESPONSE_FILE"
          [[ "$VISIBILITY" == "private" ]] || { echo "Refusing future holdout build because TopDeck evidence package is not private." >&2; exit 1; }

      - name: Log in to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Pull immutable seal and extract frozen code revision
        id: sealed_code
        env:
          SEAL_REF: ${{ inputs.seal_artifact_reference }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PREFIX="ghcr.io/${OWNER}/${TOPDECK_PACKAGE_NAME}@sha256:"
          [[ "$SEAL_REF" == "$PREFIX"* ]] || { echo "Seal reference must use immutable digest form under the private TopDeck evidence package." >&2; exit 1; }
          DIGEST="${SEAL_REF#"$PREFIX"}"
          [[ "$DIGEST" =~ ^[a-f0-9]{64}$ ]] || { echo "Seal reference contains an invalid SHA-256 digest." >&2; exit 1; }
          SEAL_DIR="$RUNNER_TEMP/promotion-seal"
          mkdir -p "$SEAL_DIR"
          oras pull "$SEAL_REF" -o "$SEAL_DIR"
          test -f "$SEAL_DIR/$SEAL_PRIVATE_FILE"
          SEALED_SHA=$(python3 - "$SEAL_DIR/$SEAL_PRIVATE_FILE" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))
          if data.get('schemaVersion') != 'topdeck-promotion-future-holdout-seal-private-v15.2':
              raise SystemExit('Unsupported private future-holdout seal schema.')
          sha = str(data.get('seal', {}).get('evaluationCodeIdentity', {}).get('gitCommitSha', '')).lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Seal does not contain a valid frozen Git commit SHA.')
          print(sha, end='')
          PY
          )
          echo "sealed_sha=$SEALED_SHA" >> "$GITHUB_OUTPUT"
          echo "seal_path=$SEAL_DIR/$SEAL_PRIVATE_FILE" >> "$GITHUB_OUTPUT"

      - name: Check out exact sealed evaluator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.sealed_code.outputs.sealed_sha }}

      - name: Set up sealed Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact sealed dependencies
        run: npm ci

      - name: Type-check and build sealed code
        run: npm run build

      - name: Extract and pull immutable training corpus
        id: corpus
        env:
          SEAL_FILE: ${{ steps.sealed_code.outputs.seal_path }}
        shell: bash
        run: |
          set -euo pipefail
          CORPUS_REF=$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync(process.env.SEAL_FILE,'utf8'));process.stdout.write(String(x.corpusArtifactReference||''))")
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PREFIX="ghcr.io/${OWNER}/${TOPDECK_PACKAGE_NAME}@sha256:"
          [[ "$CORPUS_REF" == "$PREFIX"* ]] || { echo "Seal contains a non-immutable or wrong-package corpus reference." >&2; exit 1; }
          DIGEST="${CORPUS_REF#"$PREFIX"}"
          [[ "$DIGEST" =~ ^[a-f0-9]{64}$ ]] || { echo "Seal corpus reference contains an invalid SHA-256 digest." >&2; exit 1; }
          mkdir -p corpus
          oras pull "$CORPUS_REF" -o corpus
          test -f "corpus/$CORPUS_PRIVATE_FILE"
          echo "artifact_reference=$CORPUS_REF" >> "$GITHUB_OUTPUT"

      - name: Validate and pull immutable future joined evidence
        env:
          FUTURE_JOINED_REFS_JSON: ${{ inputs.future_joined_artifact_references_json }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPOSITORY="ghcr.io/${OWNER}/${TOPDECK_PACKAGE_NAME}"
          PREFIX="${REPOSITORY}@sha256:"
          node <<'NODE' > future-joined-refs.txt
          let parsed;
          try { parsed = JSON.parse(process.env.FUTURE_JOINED_REFS_JSON); } catch { throw new Error('future_joined_artifact_references_json must be valid JSON.'); }
          if (!Array.isArray(parsed) || parsed.length === 0) throw new Error('Future joined references must be a non-empty JSON array.');
          if (parsed.length > 5000) throw new Error('At most 5000 future joined evidence artifacts may be materialized at once.');
          const refs = parsed.map((value, index) => {
            if (typeof value !== 'string' || !value.trim()) throw new Error(`Future joined reference ${index} must be a non-empty string.`);
            return value.trim().toLowerCase();
          });
          if (new Set(refs).size !== refs.length) throw new Error('Future joined evidence references must be unique.');
          process.stdout.write(refs.join('\n'));
          NODE

          printf '[\n' > "$INDEX_FILE"
          INDEX=0
          FIRST=true
          while IFS= read -r REF; do
            [[ -n "$REF" ]] || continue
            [[ "$REF" == "$PREFIX"* ]] || { echo "Future joined evidence reference must use immutable digest form under ${REPOSITORY}." >&2; exit 1; }
            DIGEST="${REF#"$PREFIX"}"
            [[ "$DIGEST" =~ ^[a-f0-9]{64}$ ]] || { echo "Future joined evidence reference contains an invalid SHA-256 digest." >&2; exit 1; }
            DIR="future-joined/${INDEX}"
            mkdir -p "$DIR"
            oras pull "$REF" -o "$DIR"
            test -f "$DIR/$JOINED_PRIVATE_FILE"
            if [[ "$FIRST" != true ]]; then printf ',\n' >> "$INDEX_FILE"; fi
            FIRST=false
            REF_JSON=$(node -e "process.stdout.write(JSON.stringify(process.argv[1]))" "$REF")
            PATH_JSON=$(node -e "process.stdout.write(JSON.stringify(process.argv[1]))" "$DIR/$JOINED_PRIVATE_FILE")
            printf '  {"artifactReference":%s,"path":%s}' "$REF_JSON" "$PATH_JSON" >> "$INDEX_FILE"
            INDEX=$((INDEX + 1))
          done < future-joined-refs.txt
          printf '\n]\n' >> "$INDEX_FILE"
          test "$INDEX" -gt 0

      - name: Build future holdout with exact sealed code and normalizer
        id: holdout
        env:
          MTG_PROMOTION_CODE_SHA: ${{ steps.sealed_code.outputs.sealed_sha }}
          TOPDECK_SEAL_ARTIFACT_REFERENCE: ${{ inputs.seal_artifact_reference }}
          TOPDECK_CORPUS_ARTIFACT_REFERENCE: ${{ steps.corpus.outputs.artifact_reference }}
          TOPDECK_PROMOTION_SEAL_PRIVATE_PATH: ${{ steps.sealed_code.outputs.seal_path }}
          TOPDECK_PROMOTION_CORPUS_PRIVATE_PATH: corpus/${{ env.CORPUS_PRIVATE_FILE }}
          TOPDECK_FUTURE_JOIN_INDEX_PATH: ${{ env.INDEX_FILE }}
          TOPDECK_FUTURE_HOLDOUT_PRIVATE_PATH: ${{ env.PRIVATE_HOLDOUT_FILE }}
          TOPDECK_FUTURE_HOLDOUT_AUDIT_PATH: ${{ env.AUDIT_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/build-topdeck-sealed-future-holdout-v15.ts
          SEAL_HASH=$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync(process.env.AUDIT_FILE,'utf8'));process.stdout.write(x.sealHash||'')")
          RECORDS=$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync(process.env.AUDIT_FILE,'utf8'));process.stdout.write(String(x.futureRecords ?? ''))")
          [[ "$SEAL_HASH" =~ ^[a-f0-9]{64}$ ]] || { echo "Future holdout audit did not preserve a valid seal hash." >&2; exit 1; }
          [[ "$RECORDS" =~ ^[0-9]+$ ]] && [[ "$RECORDS" -gt 0 ]] || { echo "Future holdout build produced no strict records." >&2; exit 1; }
          echo "seal_hash=$SEAL_HASH" >> "$GITHUB_OUTPUT"

      - name: Push private future holdout
        id: push
        env:
          SEAL_HASH: ${{ steps.holdout.outputs.seal_hash }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPOSITORY="ghcr.io/${OWNER}/${TOPDECK_PACKAGE_NAME}"
          TAG="future-holdout-${SEAL_HASH:0:16}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TAGGED_REFERENCE="${REPOSITORY}:${TAG}"
          oras push --artifact-type "$HOLDOUT_ARTIFACT_TYPE" "$TAGGED_REFERENCE" "$PRIVATE_HOLDOUT_FILE:$HOLDOUT_LAYER_MEDIA_TYPE"
          oras manifest fetch --descriptor "$TAGGED_REFERENCE" > "$DESCRIPTOR_FILE"
          DIGEST=$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync(process.env.DESCRIPTOR_FILE,'utf8'));process.stdout.write(x.digest||'')")
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Private future holdout descriptor did not contain an immutable SHA-256 digest." >&2; exit 1; }
          echo "artifact_reference=${REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify package remained private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ENCODED_PACKAGE=$(node -e "process.stdout.write(encodeURIComponent(process.env.TOPDECK_PACKAGE_NAME))")
          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/users/${OWNER}/packages/container/${ENCODED_PACKAGE}")
          [[ "$HTTP_CODE" == "200" ]] || { echo "Could not verify future holdout package privacy; HTTP $HTTP_CODE." >&2; exit 1; }
          VISIBILITY=$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(x.visibility||''))" "$RESPONSE_FILE")
          rm -f "$RESPONSE_FILE"
          [[ "$VISIBILITY" == "private" ]] || { echo "Future holdout package is not private after write." >&2; exit 1; }

      - name: Add immutable holdout reference to audit
        env:
          FUTURE_HOLDOUT_ARTIFACT_REFERENCE: ${{ steps.push.outputs.artifact_reference }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.AUDIT_FILE;
          const audit = JSON.parse(fs.readFileSync(path, 'utf8'));
          audit.privateFutureHoldoutStorage = { kind: 'ghcr-private-oci', immutableArtifactReference: process.env.FUTURE_HOLDOUT_ARTIFACT_REFERENCE };
          fs.writeFileSync(path, `${JSON.stringify(audit, null, 2)}\n`, 'utf8');
          NODE

      - name: Upload privacy-safe future holdout audit only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: topdeck-sealed-future-holdout-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.AUDIT_FILE }}
            ${{ env.DESCRIPTOR_FILE }}
          if-no-files-found: warn
          retention-days: 30

      - name: Remove sensitive evidence from runner workspace
        if: always()
        shell: bash
        run: |
          rm -rf corpus future-joined future-joined-refs.txt "$INDEX_FILE" "$RUNNER_TEMP/promotion-seal"
          rm -f "$PRIVATE_HOLDOUT_FILE"
