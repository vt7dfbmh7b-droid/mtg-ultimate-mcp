name: "One-shot V0.15 compound theme repair"

on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - ".github/workflows/one-shot-compound-theme-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore(dev): stage one-shot compound theme repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repair staging commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Apply generic controlled compound-theme repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          theme_path = Path('src/services/neutral-theme-v15.ts')
          theme = theme_path.read_text()

          theme = replace_once(
              theme,
              "  | 'printing-family'\n  | 'unresolved'",
              "  | 'printing-family'\n  | 'compound'\n  | 'unresolved'",
              'theme kind union',
          )
          theme = replace_once(
              theme,
              "  | { type: 'printing-family'; family: string }\n  | { type: 'none' };",
              "  | { type: 'printing-family'; family: string }\n  | { type: 'compound-any'; rules: NeutralThemeMatchRuleV15[] }\n  | { type: 'none' };",
              'match rule union',
          )
          theme = replace_once(
              theme,
              "  matchRule: NeutralThemeMatchRuleV15;\n  explanation: string;",
              "  matchRule: NeutralThemeMatchRuleV15;\n  components?: NeutralThemeIntentV15[];\n  explanation: string;",
              'intent components field',
          )
          theme = replace_once(
              theme,
              "    aliases: ['graveyard', 'graveyard matters', 'reanimator', 'reanimation', 'self mill'],",
              "    aliases: ['graveyard', 'graveyard matters', 'graveyard recursion', 'recursion', 'reanimator', 'reanimation', 'self mill'],",
              'graveyard aliases',
          )

          theme = replace_once(
              theme,
              "  {\n    id: 'proliferate',\n    label: 'Proliferate',",
              "  {\n    id: 'combat',\n    label: 'Combat / attacks',\n    aliases: ['combat', 'combat matters', 'attack', 'attacks', 'attacking', 'combat damage'],\n    queryClause: '(o:attack OR o:attacking OR o:\"combat damage\" OR o:\"additional combat\")',\n    minimumMainMatches: 12,\n    roles: [],\n    oracleFallbacks: ['attack', 'attacking', 'combat damage', 'additional combat', 'double strike'],\n  },\n  {\n    id: 'countermagic',\n    label: 'Countermagic',\n    aliases: ['countermagic', 'counter magic', 'counterspell', 'counterspells'],\n    queryClause: '(o:\"counter target\" o:spell)',\n    minimumMainMatches: 8,\n    roles: ['countermagic'],\n    oracleFallbacks: ['counter target spell', 'counter that spell', 'counter it'],\n  },\n  {\n    id: 'proliferate',\n    label: 'Proliferate',",
              'combat and countermagic themes',
          )

          helper = r'''interface ControlledThemeAtomV15 {
            key: string;
            aliasTokens: string[];
            intent: NeutralThemeIntentV15;
          }

          function creatureTypeIntent(
            original: string,
            normalizedInput: string,
            creatureType: string,
          ): NeutralThemeIntentV15 {
            return {
              original,
              normalizedInput,
              kind: 'creature-type',
              enforceability: 'full',
              canonicalLabel: `${creatureType} typal`,
              queryClause: `t:"${escapeScryfallLiteral(creatureType)}"`,
              minimumMainMatches: 20,
              printingFamily: null,
              matchRule: { type: 'creature-type', creatureType },
              explanation: `The requested typal theme is verified against Scryfall's creature-type catalog as ${creatureType}. Discovery uses a generated quoted type clause and the final audit checks resolved type/rules data, including Changeling.`,
            };
          }

          function controlledThemeAtoms(creatureTypes: string[]): ControlledThemeAtomV15[] {
            const atoms: ControlledThemeAtomV15[] = [];
            for (const definition of MECHANICAL_THEMES) {
              for (const alias of definition.aliases) {
                const cleanedAlias = stripThemeWrappers(normalize(alias));
                if (!cleanedAlias) continue;
                const intent = mechanicIntent(alias, normalize(alias), cleanedAlias);
                if (!intent) continue;
                atoms.push({
                  key: `mechanic:${definition.id}`,
                  aliasTokens: cleanedAlias.split(' '),
                  intent,
                });
              }
            }
            for (const definition of CARD_TYPE_THEMES) {
              for (const alias of definition.aliases) {
                const cleanedAlias = stripThemeWrappers(normalize(alias));
                if (!cleanedAlias) continue;
                const intent = cardTypeIntent(alias, normalize(alias), cleanedAlias);
                if (!intent) continue;
                atoms.push({
                  key: `card-type:${definition.id}`,
                  aliasTokens: cleanedAlias.split(' '),
                  intent,
                });
              }
            }
            for (const rawCreatureType of creatureTypes) {
              const creatureType = rawCreatureType.trim();
              if (!creatureType) continue;
              const normalizedType = normalize(creatureType);
              const aliases = new Set([normalizedType, pluralizeCreatureType(normalizedType)]);
              for (const alias of aliases) {
                if (!alias) continue;
                atoms.push({
                  key: `creature-type:${normalizedType}`,
                  aliasTokens: alias.split(' '),
                  intent: creatureTypeIntent(alias, normalize(alias), creatureType),
                });
              }
            }
            return atoms.sort((left, right) => (
              right.aliasTokens.length - left.aliasTokens.length
              || right.aliasTokens.join(' ').length - left.aliasTokens.join(' ').length
              || left.key.localeCompare(right.key)
            ));
          }

          function decomposeControlledTheme(
            cleaned: string,
            creatureTypes: string[],
          ): { components: NeutralThemeIntentV15[]; unknownTokens: string[] } {
            const tokens = cleaned.split(' ').filter(Boolean);
            const connectors = new Set(['and', 'with', 'plus', '&', '+', '/']);
            const atoms = controlledThemeAtoms(creatureTypes);
            const components: NeutralThemeIntentV15[] = [];
            const seen = new Set<string>();
            const unknownTokens: string[] = [];

            for (let index = 0; index < tokens.length;) {
              const token = tokens[index]!;
              if (connectors.has(token)) {
                index += 1;
                continue;
              }
              const atom = atoms.find((candidate) => candidate.aliasTokens.every(
                (aliasToken, offset) => tokens[index + offset] === aliasToken,
              ));
              if (!atom) {
                unknownTokens.push(token);
                index += 1;
                continue;
              }
              if (!seen.has(atom.key)) {
                components.push(atom.intent);
                seen.add(atom.key);
              }
              index += atom.aliasTokens.length;
            }
            return { components, unknownTokens };
          }

          function composedThemeIntent(
            original: string,
            normalizedInput: string,
            components: NeutralThemeIntentV15[],
          ): NeutralThemeIntentV15 {
            if (components.length === 1) {
              return { ...components[0]!, original, normalizedInput };
            }
            const queryClauses = [...new Set(components.map((component) => component.queryClause).filter((value): value is string => Boolean(value)))];
            const labels = components.map((component) => component.canonicalLabel).filter((value): value is string => Boolean(value));
            return {
              original,
              normalizedInput,
              kind: 'compound',
              enforceability: 'full',
              canonicalLabel: labels.join(' + '),
              queryClause: `(${queryClauses.join(' OR ')})`,
              minimumMainMatches: Math.max(...components.map((component) => component.minimumMainMatches)),
              printingFamily: null,
              matchRule: { type: 'compound-any', rules: components.map((component) => component.matchRule) },
              components,
              explanation: `The compound request decomposes completely into controlled facets: ${labels.join(', ')}. Candidate discovery uses only generated bounded clauses joined with OR; the original user text is never executed as Scryfall grammar. The aggregate density gate measures cards relevant to at least one requested facet, so individual facet target achievement must still be evaluated independently rather than inferred from aggregate theme satisfaction.`,
            };
          }

          '''
          theme = replace_once(
              theme,
              'function explicitOraclePhrase(original: string): string | null {',
              helper + 'function explicitOraclePhrase(original: string): string | null {',
              'compound helper insertion',
          )

          old_resolver_tail = r'''  const mechanic = mechanicIntent(original, normalizedInput, cleaned);
            if (mechanic) return mechanic;
            const cardType = cardTypeIntent(original, normalizedInput, cleaned);
            if (cardType) return cardType;

            if (/\b(?:and|with)\b|[&+]/.test(cleaned)) {
              return unsupportedTheme(original, normalizedInput, 'Compound free-form themes are not yet losslessly enforceable. Supply one primary theme or use explicit structured constraints instead.');
            }
            if (cleaned === 'land' || cleaned === 'lands' || cleaned === 'landfall') {
              return unsupportedTheme(original, normalizedInput, 'Land-centric themes require land-plan-specific density semantics and remain fail-closed until that adapter is implemented.');
            }

            let creatureTypes: string[];
            try {
              creatureTypes = await loadCreatureTypes(options);
            } catch (error) {
              return unavailableTheme(
                original,
                normalizedInput,
                `Creature-type verification is currently unavailable: ${error instanceof Error ? error.message : String(error)}`,
              );
            }
            const aliases = new Map<string, string>();
            for (const creatureType of creatureTypes) {
              const canonical = creatureType.trim();
              if (!canonical) continue;
              const normalized = normalize(canonical);
              aliases.set(normalized, canonical);
              aliases.set(pluralizeCreatureType(normalized), canonical);
            }
            const creatureType = aliases.get(cleaned);
            if (creatureType) {
              return {
                original,
                normalizedInput,
                kind: 'creature-type',
                enforceability: 'full',
                canonicalLabel: `${creatureType} typal`,
                queryClause: `t:"${escapeScryfallLiteral(creatureType)}"`,
                minimumMainMatches: 20,
                printingFamily: null,
                matchRule: { type: 'creature-type', creatureType },
                explanation: `The requested typal theme is verified against Scryfall's creature-type catalog as ${creatureType}. Discovery uses a generated quoted type clause and the final audit checks resolved type/rules data, including Changeling.`,
              };
            }

            return unsupportedTheme(
              original,
              normalizedInput,
              'The free-form theme could not be mapped to one supported creature type, mechanic, card type, printing family, or explicit Oracle-text phrase. It is not silently ignored or executed as raw Scryfall grammar.',
            );'''
          new_resolver_tail = r'''  const mechanic = mechanicIntent(original, normalizedInput, cleaned);
            if (mechanic) return mechanic;
            const cardType = cardTypeIntent(original, normalizedInput, cleaned);
            if (cardType) return cardType;

            if (cleaned === 'land' || cleaned === 'lands' || cleaned === 'landfall') {
              return unsupportedTheme(original, normalizedInput, 'Land-centric themes require land-plan-specific density semantics and remain fail-closed until that adapter is implemented.');
            }

            const controlledOnly = decomposeControlledTheme(cleaned, []);
            if (controlledOnly.unknownTokens.length === 0 && controlledOnly.components.length > 0) {
              return composedThemeIntent(original, normalizedInput, controlledOnly.components);
            }

            let creatureTypes: string[];
            try {
              creatureTypes = await loadCreatureTypes(options);
            } catch (error) {
              return unavailableTheme(
                original,
                normalizedInput,
                `Creature-type verification is currently unavailable: ${error instanceof Error ? error.message : String(error)}`,
              );
            }
            const decomposed = decomposeControlledTheme(cleaned, creatureTypes);
            if (decomposed.unknownTokens.length > 0) {
              return unsupportedTheme(
                original,
                normalizedInput,
                `The free-form theme contains unrecognized or unenforceable terms: ${[...new Set(decomposed.unknownTokens)].join(', ')}. Known facets are not silently accepted while unknown leftovers are dropped.`,
              );
            }
            if (decomposed.components.length > 0) {
              return composedThemeIntent(original, normalizedInput, decomposed.components);
            }

            return unsupportedTheme(
              original,
              normalizedInput,
              'The free-form theme could not be mapped to one supported creature type, mechanic, card type, printing family, or explicit Oracle-text phrase. It is not silently ignored or executed as raw Scryfall grammar.',
            );'''
          theme = replace_once(theme, old_resolver_tail, new_resolver_tail, 'resolver tail')

          old_matcher = r'''export function cardMatchesNeutralThemeV15(card: ScryfallCard, intent: NeutralThemeIntentV15): boolean {
            switch (intent.matchRule.type) {
              case 'creature-type': {
                if (typeContainsWord(card.type_line, intent.matchRule.creatureType)) return true;
                const keywords = new Set((card.keywords ?? []).map((value) => value.toLocaleLowerCase()));
                return keywords.has('changeling') || /this card is every creature type/i.test(getCardOracleText(card));
              }
              case 'role-any': {
                const roles = new Set(inferCardRoles(card));
                if (intent.matchRule.roles.some((role) => roles.has(role))) return true;
                const oracle = getCardOracleText(card).toLocaleLowerCase();
                return intent.matchRule.oracleFallbacks.some((phrase) => oracle.includes(phrase.toLocaleLowerCase()));
              }
              case 'card-type':
                return typeContainsWord(card.type_line, intent.matchRule.cardType);
              case 'oracle-substring':
                return getCardOracleText(card).toLocaleLowerCase().includes(intent.matchRule.phrase);
              case 'printing-family':
              case 'none':
                return false;
            }
          }'''
          new_matcher = r'''function cardMatchesNeutralThemeRuleV15(card: ScryfallCard, rule: NeutralThemeMatchRuleV15): boolean {
            switch (rule.type) {
              case 'creature-type': {
                if (typeContainsWord(card.type_line, rule.creatureType)) return true;
                const keywords = new Set((card.keywords ?? []).map((value) => value.toLocaleLowerCase()));
                return keywords.has('changeling') || /this card is every creature type/i.test(getCardOracleText(card));
              }
              case 'role-any': {
                const roles = new Set(inferCardRoles(card));
                if (rule.roles.some((role) => roles.has(role))) return true;
                const oracle = getCardOracleText(card).toLocaleLowerCase();
                return rule.oracleFallbacks.some((phrase) => oracle.includes(phrase.toLocaleLowerCase()));
              }
              case 'card-type':
                return typeContainsWord(card.type_line, rule.cardType);
              case 'oracle-substring':
                return getCardOracleText(card).toLocaleLowerCase().includes(rule.phrase);
              case 'compound-any':
                return rule.rules.some((componentRule) => cardMatchesNeutralThemeRuleV15(card, componentRule));
              case 'printing-family':
              case 'none':
                return false;
            }
          }

          export function cardMatchesNeutralThemeV15(card: ScryfallCard, intent: NeutralThemeIntentV15): boolean {
            return cardMatchesNeutralThemeRuleV15(card, intent.matchRule);
          }'''
          theme = replace_once(theme, old_matcher, new_matcher, 'card matcher')
          theme_path.write_text(theme)

          test_path = Path('src/services/neutral-theme-v15.test.ts')
          tests = test_path.read_text()
          old_test = r'''test('compound free-form themes fail closed instead of silently choosing one half', async () => {
            const compound = await resolveNeutralThemeIntentV15('Vampires and sacrifice', { creatureTypes: ['Vampire'] });
            assert.equal(compound.kind, 'unsupported');
            assert.match(compound.explanation, /compound/i);
          });'''
          new_tests = r'''test('compound controlled themes decompose completely instead of silently choosing one half', async () => {
            const compound = await resolveNeutralThemeIntentV15('Vampires and sacrifice', { creatureTypes: ['Vampire'] });
            assert.equal(compound.kind, 'compound');
            assert.equal(compound.enforceability, 'full');
            assert.deepEqual(compound.components?.map((component) => component.canonicalLabel), ['Vampire typal', 'Sacrifice / aristocrats']);
            assert.match(compound.queryClause ?? '', /t:\"Vampire\"/);
            assert.match(compound.queryClause ?? '', /o:sacrifice/);
          });

          test('compound parser recognizes counters, proliferate, countermagic and combat without needing creature-type lookup', async () => {
            const compound = await resolveNeutralThemeIntentV15('+1/+1 counters proliferate countermagic combat', {
              creatureTypeProvider: async () => { throw new Error('creature catalog should not be needed'); },
            });
            assert.equal(compound.kind, 'compound');
            assert.deepEqual(compound.components?.map((component) => component.canonicalLabel), [
              '+1/+1 counters',
              'Proliferate',
              'Countermagic',
              'Combat / attacks',
            ]);
            assert.match(compound.queryClause ?? '', /counter target/);
            assert.match(compound.queryClause ?? '', /combat damage/);
          });

          test('compound parser recognizes typal plus combat and graveyard synonyms as distinct controlled facets', async () => {
            const compound = await resolveNeutralThemeIntentV15('Knights typal combat graveyard recursion reanimation', { creatureTypes: ['Knight'] });
            assert.equal(compound.kind, 'compound');
            assert.deepEqual(compound.components?.map((component) => component.canonicalLabel), [
              'Knight typal',
              'Combat / attacks',
              'Graveyard / reanimator',
            ]);
          });

          test('compound themes still fail closed when any leftover term is unknown', async () => {
            const compound = await resolveNeutralThemeIntentV15('tokens and banana', { creatureTypes: [] });
            assert.equal(compound.kind, 'unsupported');
            assert.equal(compound.enforceability, 'unsupported');
            assert.match(compound.explanation, /banana/);
            assert.equal(compound.queryClause, null);
          });'''
          tests = replace_once(tests, old_test, new_tests, 'compound regression tests')
          test_path.write_text(tests)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run neutral-theme regressions
        run: npx tsx --test src/services/neutral-theme-v15.test.ts

      - name: Run full test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit repaired product source and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-compound-theme-repair.yml
          git add src/services/neutral-theme-v15.ts src/services/neutral-theme-v15.test.ts
          git commit -m 'fix(INTEL): compose controlled compound themes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
