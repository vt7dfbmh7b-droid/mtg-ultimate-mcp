name: Reconcile BENCH-01 replacement-priority state v2

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/reconcile-bench01-replacement-state-v2.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v15-native-deck-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Reconcile authoritative BENCH-01 state
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('project-state.json')
          s = json.loads(p.read_text())
          s['updatedAt'] = '2026-09-06T17:04:00.000Z'
          s['experimental']['developmentCheckpointNote'] = (
            'The latest accepted fully validated Commander product remains '
            'e17b0a1cba659b229fd6f0b6e2df79c5e464a616. The replacement-identity runtime lineage '
            'was formally validated and frozen at f65f4b7b77ee832e2ac66b2a7403f9dda603b84c, with '
            'five-fixture replay evidence persisted at 0322790fbe6f559a08b333df587a3eec0d447713. '
            'Manual whole-deck review rejected that lineage: Quick Draw, Virtue and Valor, Explorers '
            'of the Deep and Elven Empire still spend upgrade slots on structurally attractive but '
            'identity-poor additions; Animated Army is improved but cannot rescue the batch. Source '
            'diagnosis shows incoming candidate ordering only prefers explicit-theme candidates while '
            'themeDeficit > 0, while replacement identity ranking only chooses the OUT card after the IN '
            'candidate is fixed. This repeated cross-archetype defect justifies a generic advisory '
            'incoming-candidate theme priority after the aggregate floor. That repair is staged for full '
            'validation and is not accepted until the complete repository gate and frozen five-fixture '
            'manual replay are green.'
          )
          s['workMode']['reason'] = (
            'BENCH-01 remains active. Frozen source f65f4b7... is formal-validation green but manually '
            'rejected across the five-fixture replacement-quality replay. The repeated generic defect is '
            'incoming candidate identity priority after the aggregate controlled-theme floor. Validate '
            'the smallest advisory ranking repair, freeze its exact green SHA, then replay the same five '
            'fixtures unchanged and manually compare complete decks before product acceptance.'
          )
          s['validation']['activeBranchStatus'] = 'bench01-theme-candidate-priority-repair-validation-pending'
          req = s['validation'].get('requiredBeforeResumingIntelligenceClaims', [])
          req = [x for x in req if not x.startswith('Treat db471dc7') and not x.startswith('Wire the generic comparator') and not x.startswith('Treat frozen runtime f65f4b7') and not x.startswith('The repeated replacement-quality defect') and not x.startswith('A generic advisory incoming-candidate') and not x.startswith('Require focused regressions plus')]
          req.extend([
            'Treat frozen runtime f65f4b7b77ee832e2ac66b2a7403f9dda603b84c and persisted replay 0322790fbe6f559a08b333df587a3eec0d447713 as formally green but manually rejected Commander product evidence; do not promote it over e17b0a1cba659b229fd6f0b6e2df79c5e464a616.',
            'The repeated replacement-quality defect is centralized incoming-candidate ordering: requested-theme membership ceases to influence candidate ordering once the aggregate theme floor is satisfied, while replacement identity ranking only selects the OUT card for a fixed IN candidate.',
            'A generic advisory incoming-candidate theme priority after the floor is justified across spellslinger, enchantress, Merfolk typal and Elf typal fixtures; it must remain advisory and must not veto necessary structural repairs or weaken authoritative gates.',
            'Require focused regressions plus the full repository check before committing the repair; then freeze that exact green SHA and replay Quick Draw, Virtue and Valor, Explorers of the Deep, Elven Empire and Animated Army unchanged with complete manual deck comparison.'
          ])
          s['validation']['requiredBeforeResumingIntelligenceClaims'] = req
          s['nextActions'] = [
            'Validate the generic advisory incoming-candidate requested-theme priority after the aggregate floor using focused replacement/strategy regressions and the complete repository check; do not accept or commit product source unless all required gates are green.',
            'If validation is green, freeze the exact product SHA and replay Quick Draw, Virtue and Valor, Explorers of the Deep, Elven Empire and Animated Army from that unchanged source.',
            'Manually inspect all five complete decks against rejected frozen source f65f4b7b77ee832e2ac66b2a7403f9dda603b84c, requiring materially better replacement identity without Animated Army regression before accepting the lineage.',
            'After acceptance or rejection, persist the batch verdict and broaden BENCH-01 only when the repeated replacement-quality pattern is resolved; keep PR #29 and stable/current V0.13 unchanged until promotion-grade evidence exists.'
          ]
          s['handoffProtocol']['then'] = (
            'BENCH-01 remains active. Keep e17b0a1c... as the latest accepted Commander baseline. '
            'Frozen runtime f65f4b7... and replay evidence 0322790... are formally green but manually '
            'rejected: repeated off-plan incoming additions remain across Quick Draw, Virtue and Valor, '
            'Explorers and Elven Empire. The centralized defect is incoming requested-theme candidate '
            'ordering after the aggregate floor. Next: fully validate the smallest advisory candidate '
            'priority repair, freeze the exact green SHA, replay the same five fixtures unchanged, and '
            'accept only if complete manual deck quality materially improves. Stable remains V0.13 and '
            'PR #29 remains unmerged.'
          )
          p.write_text(json.dumps(s, indent=2) + '\n')
      - name: Regenerate and validate state surfaces
        run: |
          npm run project:handoff
          npm run project:validate
      - name: Commit reconciled state only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/reconcile-bench01-replacement-state.yml
          rm .github/workflows/reconcile-bench01-replacement-state-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-state.json docs/PROJECT-STATE.md PROJECT_HANDOFF.md .github/workflows/reconcile-bench01-replacement-state.yml .github/workflows/reconcile-bench01-replacement-state-v2.yml
          git commit -m 'docs(BENCH-01): record replacement replay rejection'
          git push origin HEAD:agent/v15-native-deck-intelligence
