name: Marvel Bracket 5 Refinement Live Control

on:
  push:
    branches: ["agent/**"]
    paths:
      - "scripts/e2e-marvel-bracket5-refine-v15.ts"
      - "src/services/deck-builder-v07.ts"
      - "src/services/deck-builder-win-package-ceiling-v15.test.ts"
      - "src/services/general-win-package-v15.ts"
      - "src/services/general-win-package-v15.test.ts"
      - "src/services/full-table-win-closure-v15.ts"
      - "src/services/win-package-pagination-v15.ts"
      - "src/services/win-package-pagination-v15.test.ts"
      - "src/services/win-package-restricted-pool-v15.ts"
      - "src/services/win-package-restricted-pool-v15.test.ts"
      - ".github/workflows/marvel-bracket5-refine-live.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-bracket5-refine-${{ github.ref }}
  cancel-in-progress: true

env:
  HTTP_RETRY_BASE_MS: 5000
  HTTP_RETRY_MAX_MS: 15000
  SCRYFALL_HTTP_RETRY_ATTEMPTS: 5
  SCRYFALL_MIN_REQUEST_GAP_MS: 750
  COMMANDER_SPELLBOOK_HTTP_RETRY_ATTEMPTS: 5

jobs:
  refine-marvel-bracket5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Align win-package discovery with full-table Commander closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/general-win-package-v15.ts')
          text = p.read_text()

          anchor = "import type { ScryfallCard } from '../types/scryfall.js';\n"
          full_import = anchor + "import { assessFullTableWinClosureV15, isStrictFullTableWinResultV15 } from './full-table-win-closure-v15.js';\n"
          if "isStrictFullTableWinResultV15" not in text:
              if anchor not in text:
                  raise SystemExit('expected top import anchor not found')
              text = text.replace(anchor, full_import, 1)

          old_parse = "  if (!id || requirements.length > 0 || !isStrictDeterministicWinResultV15(results)) return null;\n"
          new_parse = "  if (!id || requirements.length > 0 || !isStrictFullTableWinResultV15(results)) return null;\n"
          if old_parse in text:
              text = text.replace(old_parse, new_parse, 1)
          elif new_parse not in text:
              raise SystemExit('expected parse closure boundary not found')

          old_loop = """    const results = Array.isArray(row.results) ? row.results.map(String) : [];\n    const closure = assessWinResultClosureV15(results);\n    if (!closure.verifiedDeterministicWin) {\n      rejectionAudit.push({\n        comboId,\n        status: 'rejected',\n        reasons: [`strict closure failed: ${closure.kind}`],\n        closure,\n      });\n      continue;\n    }\n"""
          new_loop = """    const results = Array.isArray(row.results) ? row.results.map(String) : [];\n    const fullTableClosure = assessFullTableWinClosureV15(results);\n    const closure = assessWinResultClosureV15(results);\n    if (!fullTableClosure.verifiedFullTableWin) {\n      rejectionAudit.push({\n        comboId,\n        status: 'rejected',\n        reasons: [`full-table closure failed: ${fullTableClosure.kind}`],\n        fullTableClosure,\n      });\n      continue;\n    }\n"""
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)
          elif "const fullTableClosure = assessFullTableWinClosureV15(results);" not in text:
              raise SystemExit('expected candidate closure block not found')

          old_caveat = "      closureCaveat: closure.caveat,\n"
          new_caveat = "      closureCaveat: fullTableClosure.caveat,\n"
          if old_caveat in text:
              text = text.replace(old_caveat, new_caveat, 1)
          elif new_caveat not in text:
              raise SystemExit('expected closure caveat assignment not found')

          p.write_text(text)
          PY

      - name: Type-check and build
        run: npm run build

      - name: Run win-package regressions
        run: npx tsx --test src/services/deck-builder-win-package-ceiling-v15.test.ts src/services/win-package-pagination-v15.test.ts src/services/win-package-restricted-pool-v15.test.ts src/services/general-win-package-v15.test.ts src/services/full-table-win-closure-v15.test.ts

      - name: Persist full-table closure integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/services/general-win-package-v15.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(v15): align package discovery with full-table closure [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Refine selected Marvel-only Bracket 5 attempt
        id: refine_control
        continue-on-error: true
        run: npx tsx scripts/e2e-marvel-bracket5-refine-v15.ts

      - name: Upload refinement result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: marvel-bracket5-refine-${{ github.sha }}
          path: |
            marvel-bracket5-refine-result.json
            marvel-bracket5-refined-deck.txt
            marvel-bracket5-refine-failure.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist refinement result on isolated branch
        if: always()
        env:
          CONTROL_OUTCOME: ${{ steps.refine_control.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/marvel-bracket5
          rm -f test-results/marvel-bracket5/refine-result.json \
                test-results/marvel-bracket5/refined-deck.txt \
                test-results/marvel-bracket5/refine-failure.txt
          [ ! -f marvel-bracket5-refine-result.json ] || cp marvel-bracket5-refine-result.json test-results/marvel-bracket5/refine-result.json
          [ ! -f marvel-bracket5-refined-deck.txt ] || cp marvel-bracket5-refined-deck.txt test-results/marvel-bracket5/refined-deck.txt
          [ ! -f marvel-bracket5-refine-failure.txt ] || cp marvel-bracket5-refine-failure.txt test-results/marvel-bracket5/refine-failure.txt
          printf 'workflow_source_sha=%s\nexecuted_head_sha=%s\ncontrol_outcome=%s\nmax_win_package_cards=4\nspellbook_max_rows_per_query=400\nrestricted_pool_prefilter=true\nfull_table_closure=true\n' "$GITHUB_SHA" "$(git rev-parse HEAD)" "$CONTROL_OUTCOME" > test-results/marvel-bracket5/refine-run-metadata.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test-results/marvel-bracket5
          if ! git diff --cached --quiet; then
            git commit -m "test-results: persist Marvel Bracket 5 refinement control"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Require refinement control to execute successfully
        if: always()
        env:
          CONTROL_OUTCOME: ${{ steps.refine_control.outcome }}
        run: test "$CONTROL_OUTCOME" = "success"
