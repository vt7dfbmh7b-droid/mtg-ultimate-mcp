name: Marvel Bracket 5 Refinement Live Control

on:
  push:
    branches: ["agent/**"]
    paths:
      - "scripts/e2e-marvel-bracket5-refine-v15.ts"
      - "src/services/commander-target-pressure-v15.ts"
      - "src/services/commander-target-pressure-v15.test.ts"
      - "src/services/deck-builder-v07.ts"
      - "src/services/deck.ts"
      - "src/services/scryfall.ts"
      - "src/services/cedh-efficiency-v14.ts"
      - "src/services/upgrade.ts"
      - "src/services/card-role-truth-v15.test.ts"
      - "src/services/upgrade-target-priority-v15.test.ts"
      - "src/services/deck-builder-win-package-ceiling-v15.test.ts"
      - "src/services/general-win-package-v15.ts"
      - "src/services/general-win-package-v15.test.ts"
      - "src/services/full-table-win-closure-v15.ts"
      - "src/services/full-table-win-closure-v15.test.ts"
      - "src/services/target-gate-improvement-v15.ts"
      - "src/services/target-gate-improvement-v15.test.ts"
      - "src/services/optimizer-v11.ts"
      - "src/services/optimizer-v11.test.ts"
      - "src/services/optimizer-v12.ts"
      - "src/services/optimizer-v12-attempt-provenance.test.ts"
      - "src/services/optimizer-v12-target-progress.test.ts"
      - "src/services/win-package-pagination-v15.ts"
      - "src/services/win-package-pagination-v15.test.ts"
      - "src/services/win-package-restricted-pool-v15.ts"
      - "src/services/win-package-restricted-pool-v15.test.ts"
      - ".github/workflows/marvel-bracket5-refine-live.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-bracket5-refine-${{ github.ref }}
  cancel-in-progress: false

env:
  HTTP_RETRY_BASE_MS: 5000
  HTTP_RETRY_MAX_MS: 15000
  SCRYFALL_HTTP_RETRY_ATTEMPTS: 5
  SCRYFALL_MIN_REQUEST_GAP_MS: 750
  COMMANDER_SPELLBOOK_HTTP_RETRY_ATTEMPTS: 5

jobs:
  refine-marvel-bracket5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build checked-in source
        run: npm run build

      - name: Run autonomous and win-package regressions
        run: npx tsx --test src/services/optimizer-v11.test.ts src/services/optimizer-v12-attempt-provenance.test.ts src/services/optimizer-v12-target-progress.test.ts src/services/commander-target-pressure-v15.test.ts src/services/target-gate-improvement-v15.test.ts src/services/deck-builder-win-package-ceiling-v15.test.ts src/services/win-package-pagination-v15.test.ts src/services/win-package-restricted-pool-v15.test.ts src/services/general-win-package-v15.test.ts src/services/full-table-win-closure-v15.test.ts

      - name: Refine selected Marvel-only Bracket 5 attempt
        id: refine_control
        continue-on-error: true
        run: npx tsx scripts/e2e-marvel-bracket5-refine-v15.ts

      - name: Require accepted changes to advance an actual failed construction gate
        id: target_quality
        if: steps.refine_control.outcome == 'success'
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('marvel-bracket5-refine-result.json', 'utf8'));
          if (!result?.delta?.deckChanged) {
            throw new Error('Refinement kept the original deck and therefore did not demonstrate INTEL-02 target improvement.');
          }
          const before = new Map((result.startingDeck?.bracket5ThresholdChecks ?? []).map((c) => [c.key, c]));
          const after = new Map((result.finalDeck?.bracket5ThresholdChecks ?? []).map((c) => [c.key, c]));
          const construction = [...before.values()].filter((c) => c.category === 'construction' && c.passed === false);
          const repaired = construction.filter((c) => after.get(c.key)?.passed === true).map((c) => c.key);
          const advanced = construction.filter((check) => {
            if (after.get(check.key)?.passed === true) return false;
            const beforeValue = Number(check.observed);
            const afterValue = Number(after.get(check.key)?.observed);
            if (!Number.isFinite(beforeValue) || !Number.isFinite(afterValue)) return false;
            return check.key === 'average-nonland-mv' ? afterValue < beforeValue : afterValue > beforeValue;
          }).map((c) => c.key);
          const regressed = [...before.values()]
            .filter((c) => c.category === 'construction' && c.passed === true && after.get(c.key)?.passed === false)
            .map((c) => c.key);
          if (regressed.length > 0) {
            throw new Error(`Refinement regressed previously passing Bracket-5 construction gates: ${regressed.join(',')}`);
          }
          if (repaired.length === 0 && advanced.length === 0) {
            throw new Error('Refinement changed the deck without repairing or measurably advancing any failed Bracket-5 construction gate.');
          }
          const startingColoredMana = Number(result.startingDeck?.metrics?.persistentColoredManaSourceCount);
          const finalColoredMana = Number(result.finalDeck?.metrics?.persistentColoredManaSourceCount);
          if (!Number.isFinite(startingColoredMana) || !Number.isFinite(finalColoredMana)) {
            throw new Error('Refinement is missing persistent colored-mana evidence.');
          }
          const coloredManaFloor = Math.min(startingColoredMana, 8);
          if (finalColoredMana < coloredManaFloor) {
            throw new Error(`Refinement fell below the five-color persistent-mana floor of ${coloredManaFloor}.`);
          }
          for (const round of result.refinement?.detailedRounds ?? []) {
            if (!round.accepted) continue;
            const winner = (round.candidateComparisons ?? []).find((candidate) => candidate.candidate === round.winningCandidate);
            const strategy = winner?.strategyPreservation;
            if (!strategy?.evidenceComplete || strategy.status !== 'preserved' || (strategy.meaningfulLosses ?? []).length > 0) {
              throw new Error(`Accepted round ${round.round} lacks passing commander-strategy preservation evidence.`);
            }
            const swaps = winner.swaps ?? [];
            if (swaps.length < 1) throw new Error(`Accepted round ${round.round} has no per-swap cut-impact evidence.`);
            for (const swap of swaps) {
              if (swap.structuralPairing?.strategyPreservation?.verdict !== 'preserved') {
                throw new Error(`Accepted round ${round.round} is missing passing per-swap cut-impact evidence.`);
              }
              const afterSources = Number(swap.structuralPairing?.persistentColoredManaSourcesAfterSwap);
              const sourceFloor = Number(swap.structuralPairing?.persistentColoredManaSourceFloor);
              if (!Number.isFinite(afterSources) || !Number.isFinite(sourceFloor) || afterSources < sourceFloor) {
                throw new Error(`Accepted round ${round.round} violates its persistent colored-mana floor.`);
              }
            }
          }
          console.log(`Target quality gate passed. Repaired=${repaired.join(',') || 'none'}; advanced=${advanced.join(',') || 'none'}`);
          NODE

      - name: Upload refinement result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: marvel-bracket5-refine-${{ github.sha }}
          path: |
            marvel-bracket5-refine-result.json
            marvel-bracket5-refined-deck.txt
            marvel-bracket5-refine-failure.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist checked-in-source refinement result
        id: persist_result
        if: always()
        continue-on-error: true
        env:
          EXECUTION_OUTCOME: ${{ steps.refine_control.outcome }}
          TARGET_QUALITY_OUTCOME: ${{ steps.target_quality.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p test-results/marvel-bracket5
            rm -f test-results/marvel-bracket5/refine-result.json \
                  test-results/marvel-bracket5/refined-deck.txt \
                  test-results/marvel-bracket5/refine-failure.txt
            [ ! -f marvel-bracket5-refine-result.json ] || cp marvel-bracket5-refine-result.json test-results/marvel-bracket5/refine-result.json
            [ ! -f marvel-bracket5-refined-deck.txt ] || cp marvel-bracket5-refined-deck.txt test-results/marvel-bracket5/refined-deck.txt
            [ ! -f marvel-bracket5-refine-failure.txt ] || cp marvel-bracket5-refine-failure.txt test-results/marvel-bracket5/refine-failure.txt
            CONTROL_OUTCOME=failure
            if [ "$EXECUTION_OUTCOME" = success ] && [ "$TARGET_QUALITY_OUTCOME" = success ]; then CONTROL_OUTCOME=success; fi
            printf 'source_sha=%s\ncontrol_outcome=%s\nexecution_outcome=%s\ntarget_gate_quality_outcome=%s\npolicy=checked-in-very-good-candidate\nmax_win_package_cards=4\nspellbook_max_rows_per_query=400\nrestricted_pool_prefilter=true\nfull_table_closure=true\ntarget_gate_priority=true\nzero_progress_guard=true\nzero_target_progress_guard=true\nlower_bracket_behavior_preserved=true\nswap_feasible_win_package_selection=true\nprotect_existing_package_pieces=true\nstrategy_preservation_evidence=true\nmeaningful_strategy_loss_rejected=true\npersistent_colored_mana_floor=true\n' "$GITHUB_SHA" "$CONTROL_OUTCOME" "$EXECUTION_OUTCOME" "$TARGET_QUALITY_OUTCOME" > test-results/marvel-bracket5/refine-run-metadata.txt
            npm run validation:index
            git add -- test-results/marvel-bracket5 validation-index.json docs/VALIDATION-STATE.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "test-results: persist Marvel Bracket 5 very-good control [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Evidence persistence attempt ${attempt} lost a branch race; retrying against the latest head."
          done
          echo 'Evidence persistence exhausted eight branch-race retries.' >&2
          exit 1

      - name: Require checked-in-source scenario intelligence
        if: always()
        env:
          EXECUTION_OUTCOME: ${{ steps.refine_control.outcome }}
          TARGET_QUALITY_OUTCOME: ${{ steps.target_quality.outcome }}
        run: |
          test "$EXECUTION_OUTCOME" = success
          test "$TARGET_QUALITY_OUTCOME" = success
      - name: Require checked-in-source result persistence
        if: always()
        env:
          PERSIST_OUTCOME: ${{ steps.persist_result.outcome }}
        run: test "$PERSIST_OUTCOME" = success
# INTEL-02-FAMILY-BATCH-2026-09-04: frozen-source trigger
