name: Marvel Bracket 5 Refinement Live Control

on:
  push:
    branches: ["agent/**"]
    paths:
      - "scripts/e2e-marvel-bracket5-refine-v15.ts"
      - "src/services/deck-builder-v07.ts"
      - "src/services/deck-builder-win-package-ceiling-v15.test.ts"
      - "src/services/general-win-package-v15.ts"
      - "src/services/general-win-package-v15.test.ts"
      - "src/services/win-package-pagination-v15.ts"
      - "src/services/win-package-pagination-v15.test.ts"
      - "src/services/win-package-restricted-pool-v15.ts"
      - "src/services/win-package-restricted-pool-v15.test.ts"
      - ".github/workflows/marvel-bracket5-refine-live.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-bracket5-refine-${{ github.ref }}
  cancel-in-progress: true

env:
  HTTP_RETRY_BASE_MS: 5000
  HTTP_RETRY_MAX_MS: 15000
  SCRYFALL_HTTP_RETRY_ATTEMPTS: 5
  SCRYFALL_MIN_REQUEST_GAP_MS: 750
  COMMANDER_SPELLBOOK_HTTP_RETRY_ATTEMPTS: 5

jobs:
  refine-marvel-bracket5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Integrate restricted physical-pool prefilter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/general-win-package-v15.ts')
          text = p.read_text()

          anchor = "import { getCardsByNames, inferCardRoles } from './scryfall.js';\n"
          imports = anchor + "import { discoverEligiblePoolV15 } from './neutral-deck-builder-v15.js';\n"
          if "discoverEligiblePoolV15" not in text:
              if anchor not in text:
                  raise SystemExit('expected Scryfall import anchor not found')
              text = text.replace(anchor, imports, 1)

          anchor2 = "import { collectBoundedSpellbookVariantsV15 } from './win-package-pagination-v15.js';\n"
          imports2 = anchor2 + "import { prefilterRestrictedWinPackageCandidatesV15 } from './win-package-restricted-pool-v15.js';\n"
          if "prefilterRestrictedWinPackageCandidatesV15" not in text:
              if anchor2 not in text:
                  raise SystemExit('expected pagination import anchor not found')
              text = text.replace(anchor2, imports2, 1)

          colors_anchor = "  const colors = commanderIdentity(commanders);\n  const raw: unknown[] = [];\n"
          colors_replacement = """  const colors = commanderIdentity(commanders);\n  const hasRestrictedPhysicalPool = Boolean(policy.family) || policy.allowedSetCodes.length > 0 || policy.exactSpecialPrintings.length > 0;\n  const restrictedEligiblePool = hasRestrictedPhysicalPool\n    ? await discoverEligiblePoolV15(colors, policy, options.maxUsdPerCard)\n    : null;\n  const raw: unknown[] = [];\n"""
          if "const restrictedEligiblePool" not in text:
              if colors_anchor not in text:
                  raise SystemExit('expected colors/raw anchor not found')
              text = text.replace(colors_anchor, colors_replacement, 1)

          ranked_anchor = "  const ranked = rankGeneralWinPackageVariantsV15(raw, commanderNames, options).map(record);\n  const names = [...new Set(ranked.flatMap((candidate) => Array.isArray(candidate.names) ? candidate.names.map(String) : []))];\n"
          ranked_replacement = """  const rankedBeforeRestrictedPool = rankGeneralWinPackageVariantsV15(raw, commanderNames, options);\n  const restrictedPrefilter = restrictedEligiblePool\n    ? prefilterRestrictedWinPackageCandidatesV15(\n        rankedBeforeRestrictedPool,\n        commanderNames,\n        restrictedEligiblePool.map((card) => card.name),\n      )\n    : null;\n  const ranked = (restrictedPrefilter?.candidates ?? rankedBeforeRestrictedPool).map(record);\n  if (restrictedPrefilter) {\n    queryAudit.push({\n      kind: 'restricted-physical-pool-prefilter',\n      ...restrictedPrefilter.audit,\n    });\n  }\n  const names = [...new Set(ranked.flatMap((candidate) => Array.isArray(candidate.names) ? candidate.names.map(String) : []))];\n"""
          if "rankedBeforeRestrictedPool" not in text:
              if ranked_anchor not in text:
                  raise SystemExit('expected ranked discovery anchor not found')
              text = text.replace(ranked_anchor, ranked_replacement, 1)

          p.write_text(text)
          PY

      - name: Type-check and build
        run: npm run build

      - name: Run win-package regressions
        run: npx tsx --test src/services/deck-builder-win-package-ceiling-v15.test.ts src/services/win-package-pagination-v15.test.ts src/services/win-package-restricted-pool-v15.test.ts src/services/general-win-package-v15.test.ts

      - name: Persist restricted-pool integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/services/general-win-package-v15.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(v15): prefilter constrained win packages [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Refine selected Marvel-only Bracket 5 attempt
        id: refine_control
        continue-on-error: true
        run: npx tsx scripts/e2e-marvel-bracket5-refine-v15.ts

      - name: Upload refinement result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: marvel-bracket5-refine-${{ github.sha }}
          path: |
            marvel-bracket5-refine-result.json
            marvel-bracket5-refined-deck.txt
            marvel-bracket5-refine-failure.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist refinement result on isolated branch
        if: always()
        env:
          CONTROL_OUTCOME: ${{ steps.refine_control.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/marvel-bracket5
          rm -f test-results/marvel-bracket5/refine-result.json \
                test-results/marvel-bracket5/refined-deck.txt \
                test-results/marvel-bracket5/refine-failure.txt
          [ ! -f marvel-bracket5-refine-result.json ] || cp marvel-bracket5-refine-result.json test-results/marvel-bracket5/refine-result.json
          [ ! -f marvel-bracket5-refined-deck.txt ] || cp marvel-bracket5-refined-deck.txt test-results/marvel-bracket5/refined-deck.txt
          [ ! -f marvel-bracket5-refine-failure.txt ] || cp marvel-bracket5-refine-failure.txt test-results/marvel-bracket5/refine-failure.txt
          printf 'workflow_source_sha=%s\nexecuted_head_sha=%s\ncontrol_outcome=%s\nmax_win_package_cards=4\nspellbook_max_rows_per_query=400\nrestricted_pool_prefilter=true\n' "$GITHUB_SHA" "$(git rev-parse HEAD)" "$CONTROL_OUTCOME" > test-results/marvel-bracket5/refine-run-metadata.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test-results/marvel-bracket5
          if ! git diff --cached --quiet; then
            git commit -m "test-results: persist Marvel Bracket 5 refinement control"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Require refinement control to execute successfully
        if: always()
        env:
          CONTROL_OUTCOME: ${{ steps.refine_control.outcome }}
        run: test "$CONTROL_OUTCOME" = "success"
