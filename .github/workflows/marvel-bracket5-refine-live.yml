name: Marvel Bracket 5 Refinement Live Control

on:
  push:
    branches: ["agent/**"]
    paths:
      - "scripts/e2e-marvel-bracket5-refine-v15.ts"
      - "src/services/commander-target-pressure-v15.ts"
      - "src/services/commander-target-pressure-v15.test.ts"
      - "src/services/deck-builder-v07.ts"
      - "src/services/deck-builder-win-package-ceiling-v15.test.ts"
      - "src/services/general-win-package-v15.ts"
      - "src/services/general-win-package-v15.test.ts"
      - "src/services/full-table-win-closure-v15.ts"
      - "src/services/full-table-win-closure-v15.test.ts"
      - "src/services/target-gate-improvement-v15.ts"
      - "src/services/target-gate-improvement-v15.test.ts"
      - "src/services/optimizer-v11.ts"
      - "src/services/optimizer-v12.ts"
      - "src/services/win-package-pagination-v15.ts"
      - "src/services/win-package-pagination-v15.test.ts"
      - "src/services/win-package-restricted-pool-v15.ts"
      - "src/services/win-package-restricted-pool-v15.test.ts"
      - ".github/workflows/marvel-bracket5-refine-live.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-bracket5-refine-${{ github.ref }}
  cancel-in-progress: true

env:
  HTTP_RETRY_BASE_MS: 5000
  HTTP_RETRY_MAX_MS: 15000
  SCRYFALL_HTTP_RETRY_ATTEMPTS: 5
  SCRYFALL_MIN_REQUEST_GAP_MS: 750
  COMMANDER_SPELLBOOK_HTTP_RETRY_ATTEMPTS: 5

jobs:
  refine-marvel-bracket5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Integrate swap-feasible verified package injection when needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/deck-builder-v07.ts')
          text = p.read_text()

          old_import = "import { commanderTargetPressureV15, selectTargetAwareWinPackageV15 } from './commander-target-pressure-v15.js';\n"
          new_import = "import { commanderTargetPressureV15, selectInjectableTargetAwareWinPackageV15 } from './commander-target-pressure-v15.js';\n"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('commander target pressure import anchor not found')

          old_iface = """  selectedBracketTag: string | null;\n  missingSeedNames: string[];\n  selections: UpgradeAddSelectionV15[];\n"""
          new_iface = """  selectedBracketTag: string | null;\n  missingSeedNames: string[];\n  protectedExistingPackageNames?: string[];\n  selections: UpgradeAddSelectionV15[];\n"""
          if 'protectedExistingPackageNames?: string[];' not in text:
              if old_iface not in text: raise SystemExit('win package priority interface anchor not found')
              text = text.replace(old_iface, new_iface, 1)

          old_select = """  const selected = selectTargetAwareWinPackageV15(options.targetBracket, discovery.candidates, discovery.selected);\n  if (!selected) {\n    return {\n      attempted: true,\n      sourceStatus: discovery.status,\n      selectedComboId: null,\n      selectedBracketTag: null,\n      missingSeedNames: [],\n      selections: [],\n      reason: discovery.status === 'verification-unavailable'\n        ? 'Verified package discovery was unavailable/incomplete; no package was invented.'\n        : 'Completed verified package discovery found no legal package satisfying the active printing/budget/exclusion constraints.',\n    };\n  }\n\n  const existing = new Set([...parsed.commanders, ...parsed.main].map((entry) => entry.name.toLocaleLowerCase()));\n  const missingSeedNames = selected.seedNames.filter((name) => !existing.has(name.toLocaleLowerCase()));\n"""
          new_select = """  const existingCardNames = [...parsed.commanders, ...parsed.main].map((entry) => entry.name);\n  const injection = selectInjectableTargetAwareWinPackageV15({\n    targetBracket: options.targetBracket,\n    candidates: discovery.candidates,\n    existingSelected: discovery.selected,\n    existingCardNames,\n    maxMissingSeedCards: Math.max(1, Math.min(15, Math.trunc(options.maxSwaps ?? 8))),\n  });\n  const selected = injection?.candidate ?? null;\n  if (!selected || !injection) {\n    return {\n      attempted: true,\n      sourceStatus: discovery.status,\n      selectedComboId: null,\n      selectedBracketTag: null,\n      missingSeedNames: [],\n      selections: [],\n      reason: discovery.status === 'verification-unavailable'\n        ? 'Verified package discovery was unavailable/incomplete; no package was invented.'\n        : 'Completed verified package discovery found no legal verified package that can be injected atomically within the current swap capacity and active printing/budget/exclusion constraints.',\n    };\n  }\n\n  const missingSeedNames = injection.missingSeedNames;\n"""
          if 'const injection = selectInjectableTargetAwareWinPackageV15({' not in text:
              if old_select not in text: raise SystemExit('old target-aware package selection block not found')
              text = text.replace(old_select, new_select, 1)

          old_success = """    selectedBracketTag: selected.bracketTag,\n    missingSeedNames,\n    selections,\n    reason: selected.bracketTag === 'R'\n"""
          new_success = """    selectedBracketTag: selected.bracketTag,\n    missingSeedNames,\n    protectedExistingPackageNames: injection.existingComboCardNames,\n    selections,\n    reason: selected.bracketTag === 'R'\n"""
          if 'protectedExistingPackageNames: injection.existingComboCardNames' not in text:
              if old_success not in text: raise SystemExit('successful package priority return anchor not found')
              text = text.replace(old_success, new_success, 1)

          old_cut = """  const suggestions = await suggestDeckUpgrades(parsed, cards, allowedIdentity, options);\n  const groups = (suggestions.candidateAddsByDeficit ?? []) as Array<Record<string, unknown>>;\n  const cutPool = ((suggestions.candidateCuts ?? []) as Array<Record<string, unknown>>)\n    .filter((cut) => {\n      const card = cut.card as Record<string, unknown> | undefined;\n      return typeof card?.name !== 'string' || !protectedNames.has(card.name.toLocaleLowerCase());\n    });\n  const targetPressure = commanderTargetPressureV15(options.targetBracket);\n  const winPackagePriority = await buildWinPackagePriorityV15(parsed, cards, options);\n  const swapCapacity = Math.min(maxSwaps, cutPool.length);\n"""
          new_cut = """  const suggestions = await suggestDeckUpgrades(parsed, cards, allowedIdentity, options);\n  const groups = (suggestions.candidateAddsByDeficit ?? []) as Array<Record<string, unknown>>;\n  const targetPressure = commanderTargetPressureV15(options.targetBracket);\n  const winPackagePriority = await buildWinPackagePriorityV15(parsed, cards, options);\n  const packageProtectedNames = new Set(\n    (winPackagePriority.protectedExistingPackageNames ?? []).map((name) => name.toLocaleLowerCase()),\n  );\n  const cutPool = ((suggestions.candidateCuts ?? []) as Array<Record<string, unknown>>)\n    .filter((cut) => {\n      const card = cut.card as Record<string, unknown> | undefined;\n      if (typeof card?.name !== 'string') return true;\n      const name = card.name.toLocaleLowerCase();\n      return !protectedNames.has(name) && !packageProtectedNames.has(name);\n    });\n  const swapCapacity = Math.min(maxSwaps, cutPool.length);\n"""
          if 'const packageProtectedNames = new Set(' not in text:
              if old_cut not in text: raise SystemExit('cut pool ordering anchor not found')
              text = text.replace(old_cut, new_cut, 1)

          old_pressure = """      selectedBracketTag: winPackagePriority.selectedBracketTag,\n      missingSeedNames: winPackagePriority.missingSeedNames,\n      atomicWinPackageInjected: atomicWinPackageFits,\n"""
          new_pressure = """      selectedBracketTag: winPackagePriority.selectedBracketTag,\n      missingSeedNames: winPackagePriority.missingSeedNames,\n      protectedExistingPackageNames: winPackagePriority.protectedExistingPackageNames ?? [],\n      atomicWinPackageInjected: atomicWinPackageFits,\n"""
          if 'protectedExistingPackageNames: winPackagePriority.protectedExistingPackageNames ?? []' not in text:
              if old_pressure not in text: raise SystemExit('target pressure provenance anchor not found')
              text = text.replace(old_pressure, new_pressure, 1)

          old_caveat = "'IN/OUT pairing now minimizes damage to the existing structural role targets before using cut pressure as a tie-breaker; Bracket-5 free interaction is treated as its own existing target pressure, and an already-verified missing win package is injected atomically when one survives the current hard constraints.',"
          new_caveat = "'IN/OUT pairing minimizes damage to existing structural role targets before cut pressure tie-breaks; Bracket-5 verified packages are selected only when their missing seeds fit the current swap package, and any already-present pieces of that selected route are temporarily protected from cuts during atomic injection.',"
          if old_caveat in text:
              text = text.replace(old_caveat, new_caveat, 1)

          p.write_text(text)
          PY

      - name: Type-check and build candidate source
        run: npm run build

      - name: Run autonomous and win-package regressions
        run: npx tsx --test src/services/commander-target-pressure-v15.test.ts src/services/target-gate-improvement-v15.test.ts src/services/deck-builder-win-package-ceiling-v15.test.ts src/services/win-package-pagination-v15.test.ts src/services/win-package-restricted-pool-v15.test.ts src/services/general-win-package-v15.test.ts src/services/full-table-win-closure-v15.test.ts

      - name: Persist swap-feasible package injection when newly integrated
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/services/deck-builder-v07.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(v15): make win-package injection swap-feasible"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Refine selected Marvel-only Bracket 5 attempt
        id: refine_control
        continue-on-error: true
        run: npx tsx scripts/e2e-marvel-bracket5-refine-v15.ts

      - name: Require refinement control to execute successfully
        if: always()
        env:
          CONTROL_OUTCOME: ${{ steps.refine_control.outcome }}
        run: test "$CONTROL_OUTCOME" = "success"

      - name: Require accepted changes to advance an actual failed construction gate
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('marvel-bracket5-refine-result.json', 'utf8'));
          if (!result?.delta?.deckChanged) process.exit(0);
          const before = new Map((result.startingDeck?.bracket5ThresholdChecks ?? []).map((c) => [c.key, c]));
          const after = new Map((result.finalDeck?.bracket5ThresholdChecks ?? []).map((c) => [c.key, c]));
          const construction = [...before.values()].filter((c) => c.category === 'construction' && c.passed === false);
          const repaired = construction.filter((c) => after.get(c.key)?.passed === true).map((c) => c.key);
          const beforeMv = Number(before.get('average-nonland-mv')?.observed);
          const afterMv = Number(after.get('average-nonland-mv')?.observed);
          const measurableCurveAdvance = Number.isFinite(beforeMv) && Number.isFinite(afterMv) && beforeMv > 2.6 && afterMv < beforeMv;
          if (repaired.length === 0 && !measurableCurveAdvance) {
            throw new Error(`Refinement changed the deck without repairing a failed Bracket-5 construction gate or advancing the failed curve gate. Before=${beforeMv}, after=${afterMv}`);
          }
          console.log(`Target quality gate passed. Repaired=${repaired.join(',') || 'none'}; curveAdvance=${measurableCurveAdvance}`);
          NODE

      - name: Upload refinement result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: marvel-bracket5-refine-${{ github.sha }}
          path: |
            marvel-bracket5-refine-result.json
            marvel-bracket5-refined-deck.txt
            marvel-bracket5-refine-failure.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist checked-in-source refinement result
        if: success()
        env:
          CONTROL_OUTCOME: ${{ steps.refine_control.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/marvel-bracket5
          rm -f test-results/marvel-bracket5/refine-result.json \
                test-results/marvel-bracket5/refined-deck.txt \
                test-results/marvel-bracket5/refine-failure.txt
          [ ! -f marvel-bracket5-refine-result.json ] || cp marvel-bracket5-refine-result.json test-results/marvel-bracket5/refine-result.json
          [ ! -f marvel-bracket5-refined-deck.txt ] || cp marvel-bracket5-refined-deck.txt test-results/marvel-bracket5/refined-deck.txt
          [ ! -f marvel-bracket5-refine-failure.txt ] || cp marvel-bracket5-refine-failure.txt test-results/marvel-bracket5/refine-failure.txt
          printf 'source_sha=%s\ncontrol_outcome=%s\npolicy=checked-in-very-good-candidate\nmax_win_package_cards=4\nspellbook_max_rows_per_query=400\nrestricted_pool_prefilter=true\nfull_table_closure=true\ntarget_gate_priority=true\nswap_feasible_win_package_selection=true\nprotect_existing_package_pieces=true\n' "$GITHUB_SHA" "$CONTROL_OUTCOME" > test-results/marvel-bracket5/refine-run-metadata.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test-results/marvel-bracket5
          if ! git diff --cached --quiet; then
            git commit -m "test-results: persist Marvel Bracket 5 very-good control [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
