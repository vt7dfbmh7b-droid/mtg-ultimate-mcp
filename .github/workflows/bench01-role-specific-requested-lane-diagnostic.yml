name: BENCH-01 Role-Specific Requested Lane Diagnostic

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/bench01-role-specific-requested-lane-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: bench01-role-specific-requested-lane-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Verify immutable Commander source
        run: git diff --exit-code 6686f2892e93cc571ee9e4f7717bb5f0156bd301 -- src
      - name: Run full check with durable diagnostics
        id: check
        shell: bash
        run: |
          set +e
          npm run check > /tmp/full-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 500 /tmp/full-check.log > /tmp/full-check-tail.log
          exit 0
      - name: Persist diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/bench01-role-specific-requested-lane-diagnostic
          cp /tmp/full-check-tail.log test-results/bench01-role-specific-requested-lane-diagnostic/full-check-tail.log
          printf 'product_source_sha=6686f2892e93cc571ee9e4f7717bb5f0156bd301\nfull_check_exit_status=%s\n' '${{ steps.check.outputs.status }}' > test-results/bench01-role-specific-requested-lane-diagnostic/result.txt
          git rm .github/workflows/bench01-role-specific-requested-lane-diagnostic.yml .github/workflows/bench01-role-specific-requested-lane-validation.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-results/bench01-role-specific-requested-lane-diagnostic
          git commit -m 'validation(BENCH-01): persist role-specific lane diagnostic [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
