name: BENCH-01 Adaptive Candidate Repair V2

on:
  push:
    paths:
      - '.github/workflows/bench01-adaptive-candidate-repair-v2.yml'
      - 'scripts/bench01-apply-adaptive-repair.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v15-native-deck-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply generic repair
        run: python scripts/bench01-apply-adaptive-repair.py
      - name: Focused adaptive diversification regression
        run: npx tsx --test src/services/optimizer-v12-candidate-diversification.test.ts src/services/optimizer-v12-attempt-provenance.test.ts src/services/optimizer-v12-compound-theme-components.test.ts src/services/optimizer-v12-target-progress.test.ts
      - name: Full required validation
        run: npm run check
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/optimizer-v12.ts src/services/optimizer-v12-candidate-diversification.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(BENCH-01): adapt candidate diversification while search stays novel'
          git push origin HEAD:agent/v15-native-deck-intelligence
