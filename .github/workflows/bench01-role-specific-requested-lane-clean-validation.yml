name: BENCH-01 Context Role Applicability Clean Validation

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/bench01-role-specific-requested-lane-clean-validation.yml

concurrency:
  group: bench01-context-role-applicability-clean-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Verify immutable Commander source
        run: git diff --exit-code 2d0d5ee260da6ef31215d7a4cb542cf00f21077a -- src
      - name: Focused context-applicability regressions
        run: npx tsx --test src/services/upgrade-context-role-applicability-v15.test.ts src/services/upgrade-aspirational-fallback-v15.test.ts src/services/upgrade-strategy-compatible-lane-v15.test.ts src/services/replacement-identity-pairing-v15.test.ts
      - name: Full repository validation
        run: npm run check
