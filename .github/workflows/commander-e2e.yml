name: Commander E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commander-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run real precon upgrade scenario with NZD budgets
        run: npm run test:e2e
