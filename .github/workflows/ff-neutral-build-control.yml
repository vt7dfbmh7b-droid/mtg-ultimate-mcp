name: FF Neutral Autonomous Build Control

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ff-neutral-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Build a neutral FF-only Commander deck and assess it afterward
        run: npx tsx scripts/e2e-ff-neutral-build-v15.ts
      - name: Upload neutral build result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ff-neutral-build-result-${{ github.sha }}
          path: |
            ff-neutral-build-result.json
            ff-neutral-build-selected-deck.txt
            ff-neutral-build-failure.txt
          if-no-files-found: ignore
          retention-days: 14
