name: BENCH-01 Taxonomy State Reconciliation

on:
  push:
    branches:
      - agent/v15-native-deck-intelligence
    paths:
      - .github/workflows/bench01-taxonomy-state-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact validated source-equivalent parent
        run: test "$(git rev-parse HEAD^)" = "e17b0a1cba659b229fd6f0b6e2df79c5e464a616"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Reconcile authoritative BENCH state and roadmap
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          state_path = Path('project-state.json')
          state = json.loads(state_path.read_text())
          validated = 'e17b0a1cba659b229fd6f0b6e2df79c5e464a616'
          product = '387709983880fa2fd10c7f0aa50cd8b1524852f5'
          run = '34006676470'

          state['updatedAt'] = '2026-09-06T02:32:00.000Z'
          exp = state['experimental']
          exp['developmentCheckpointNote'] = (
            'The formal accepted development checkpoint remains 77a5383.... BENCH-01 Batch C established two independent '
            'neutral-theme vocabulary omissions backed by existing shared semantic truth: card draw and lifegain. The smallest '
            f'generic registry bridge was implemented at {product} with no optimizer/deck/card-specific conditions. Focused parser/audit '
            f'regressions and build passed before publish, and normal CI run {run} passed on source-equivalent head {validated}; the only '
            'delta from the product commit is benchmark evidence documentation. Freeze this exact validated source tree for the affected-fixture replay.'
          )
          exp['lastFullyValidatedExperimentalBaseline'] = {
            'branch': 'agent/v15-native-deck-intelligence',
            'sha': validated,
            'scope': (
              'Fully validated generic neutral-theme taxonomy bridge for shared card-draw and lifegain semantics. Product code change '
              f'is commit {product}; {validated} differs only by the persisted BENCH evidence document. Focused regressions cover standalone '
              'resolution/matching, unrelated compound decomposition and unchanged fail-closed unknown leftovers. Normal CI run '
              f'{run} passed project/state/index/recovery checks, build/type-check and the full repository test suite. This is the frozen '
              'executable source for the Witherbloom + Urza replay; it is not yet promotion evidence.'
            )
          }

          state['workMode']['reason'] = (
            'BENCH-01 remains the critical path. The compound-component compensation blocker is closed. Unseen Batch C then exposed a '
            'shared pre-optimization vocabulary gap: card draw and lifegain were absent from the neutral-theme registry despite existing '
            'measurable semantic truth in inferCardRoles(). The smallest generic registry bridge is now fully validated on frozen source '
            f'{validated}. Replay Witherbloom and Urza from this unchanged source, keep Necron as the supported-vocabulary control, and '
            'do not make another intelligence edit until the replay is interpreted across fixtures.'
          )

          state['validation']['activeBranchStatus'] = 'bench01-generic-card-draw-lifegain-taxonomy-repair-validated-replay-pending'
          req = state['validation']['requiredBeforeResumingIntelligenceClaims']
          req = [x for x in req if not x.startswith('Before editing the neutral-theme registry') and not x.startswith('After any generic vocabulary repair')]
          req.extend([
            f'Preserve the generic taxonomy repair product commit {product} and validated source-equivalent head {validated}. Card draw and lifegain are controlled only because both map to existing shared measurable role truth; unknown leftovers remain fail-closed.',
            f'Normal CI run {run} is the formal full-suite/build/state/recovery validation for the repaired source tree at {validated}. Never treat the earlier staging workflow alone as formal validation.',
            'Replay Witherbloom Witchcraft and Urza\'s Iron Alliance from the same unchanged validated taxonomy-repair source. Keep Necron Dynasties as the supported-vocabulary control and inspect component movement/achievement plus whole-deck quality before another product edit.'
          ])
          state['validation']['requiredBeforeResumingIntelligenceClaims'] = req

          state['nextActions'] = [
            'Do not repeat the completed comprehensive system audit; docs/SYSTEM-AUDIT-2026-09-02.md remains the reusable baseline unless a material architecture, runtime-entry-point, stable-boundary or project-state-integrity change occurs.',
            f'Freeze {validated} as the latest fully validated executable Commander product source. Its src/** contains generic taxonomy repair {product}; the descendant adds only persisted benchmark evidence.',
            'Replay Witherbloom Witchcraft and Urza\'s Iron Alliance from the same unchanged frozen source. Require card draw and lifegain to resolve through controlled semantics, not raw provider grammar, and keep Necron Dynasties as the supported-vocabulary control.',
            'Interpret the replay before another intelligence edit: verify Commander legality/exact 100, budgets/printing truth where applicable, every requested component before/after, target movement versus target achievement, swap quality, strategy preservation and complete-deck coherence.',
            'Keep the earlier Counter Blitz dense-countermagic allocation concern as a watch item only unless an unrelated fixture independently reproduces the same spend-swaps/leave-high-priority-target-stationary pattern.',
            'If the taxonomy replay is sound, broaden BENCH-01 across control, unrestricted combo, hybrid, combat/commander-damage, spellslinger/equipment, budget and unusual-partner families with product source frozen across each batch before another intelligence edit.',
            'PR #29 and stable V0.13 remain unchanged while BENCH-01 is not promotion-grade. Standing authorization permits merge/promotion without another approval only after complete validation and broad benchmark evidence demonstrate the specialist is genuinely ready.'
          ]
          state['handoffProtocol']['then'] = (
            f'The comprehensive system audit remains complete and reusable. BENCH-01 is active. Compound parsing/component-preservation repairs are validated. '
            f'Unseen Batch C exposed two generic neutral-theme registry omissions backed by existing shared role truth. The card-draw/lifegain bridge is now '
            f'fully validated on source {validated} (product change {product}, normal CI {run}). Freeze that source and replay Witherbloom + Urza together, '
            'with Necron as control, before any further intelligence change. Counter dense-countermagic allocation remains watch-only. Stable remains V0.13.'
          )
          state_path.write_text(json.dumps(state, indent=2) + '\n')

          roadmap_path = Path('docs/ROADMAP.md')
          roadmap = roadmap_path.read_text()
          start = roadmap.index('### Paired post-repair replay — NEXT')
          end = roadmap.index('### After the compound-quality blocker')
          replacement = '''### Paired post-repair replay — COMPLETE — component-compensation blocker closed\n\nThe paired Counter Blitz/Cavalry replay ran from frozen validated product source `dd085caf4e47f6f5e1976667dc90de2db46c00a1`. Counter preserved proliferate at 4 → 4 instead of the pre-repair 4 → 2 regression. Cavalry preserved its explicit typal/combat facets materially better while still improving graveyard/recursion. This closes the generic component-compensation correctness blocker.\n\nCounter Blitz still left dense countermagic at 1 → 1 against an explicit target of 8 while spending swaps, but unseen Batch C did not reproduce that allocation pattern. It remains a watch item, not an authorized optimizer repair.\n\n### Unseen Batch C — COMPLETE — generic vocabulary boundary found\n\nWith product `src/**` frozen equal to `dd085caf...`, three unrelated fixtures were run: Witherbloom Witchcraft, Urza's Iron Alliance and Necron Dynasties. Witherbloom stopped before optimization because `lifegain` was unsupported; Urza stopped because `card draw` was unsupported; Necron passed the same parser layer with supported vocabulary. Source inspection proved both omitted concepts already have generic measurable truth in `inferCardRoles()`.\n\n### Generic card-draw / lifegain taxonomy bridge — VALIDATED\n\nProduct implementation commit: `387709983880fa2fd10c7f0aa50cd8b1524852f5`.\n\nValidated source-equivalent head: `e17b0a1cba659b229fd6f0b6e2df79c5e464a616`; its only delta from the product commit is the BENCH evidence document.\n\nThe repair adds controlled neutral-theme registry definitions for card draw and lifegain using bounded generated discovery clauses and independent shared role/Oracle matching. It changes no optimizer allocation, legality, budget, printing, bracket or component-preservation behavior and contains no deck/card-specific conditions. Unknown leftovers remain fail-closed. Focused parser/audit regressions and build passed before publish, then normal CI run `34006676470` passed project-state/index/recovery checks, build/type-check and the full repository test suite.\n\n### Taxonomy post-repair replay — NEXT\n\nFreeze `e17b0a1cba659b229fd6f0b6e2df79c5e464a616` for the replay. Run Witherbloom Witchcraft and Urza's Iron Alliance from that same unchanged source, keeping Necron Dynasties as the supported-vocabulary control. Confirm the natural-language requests resolve through controlled semantics, then inspect hard truth, each requested component's movement/achievement, swap quality, strategy preservation and whole-deck coherence. Do not make another intelligence change before interpreting the fixtures together.\n\n'''
          roadmap_path.write_text(roadmap[:start] + replacement + roadmap[end:])
          PY

      - name: Regenerate derived state surfaces and validation index
        run: |
          npm run project:handoff
          npm run validation:index
          npm run project:validate
          npm run validation:validate
          npm run project:resume > /dev/null

      - name: Commit reconciled state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bench01-taxonomy-state-reconcile.yml
          git add project-state.json docs/PROJECT-STATE.md PROJECT_HANDOFF.md docs/ROADMAP.md validation-index.json docs/VALIDATION-STATE.md
          git commit -m "docs(bench01): freeze validated taxonomy repair and replay gate [skip ci]"
          git push origin HEAD:agent/v15-native-deck-intelligence
