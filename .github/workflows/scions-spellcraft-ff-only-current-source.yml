name: "Current-source Scions & Spellcraft FF-Only Validation"

# Temporary validation-only workflow. Do not merge or promote from this branch.
on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - "scripts/e2e-scions-spellcraft-ff-only-v15.ts"
      - "src/services/commander-strategy-affinity-v15.ts"
      - "src/services/refinement-acceptance-v15.ts"
      - "src/services/refinement-acceptance-v15.test.ts"
      - "src/services/optimizer-v12.ts"
      - "src/services/deck-builder-v07.ts"
      - "src/services/refinement-workflows-v12.ts"
      - "src/server-v12.ts"
      - "src/server-v13.ts"
      - ".github/workflows/scions-spellcraft-ff-only-current-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scions-spellcraft-ff-only-${{ github.ref }}
  cancel-in-progress: false

env:
  HTTP_RETRY_BASE_MS: 5000
  HTTP_RETRY_MAX_MS: 15000
  SCRYFALL_HTTP_RETRY_ATTEMPTS: 5
  SCRYFALL_MIN_REQUEST_GAP_MS: 750
  COMMANDER_SPELLBOOK_HTTP_RETRY_ATTEMPTS: 5

jobs:
  refine-scions-spellcraft:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out current experimental PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build checked-in source
        id: source_build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee scions-source-build.log

      - name: Run direct commander-mechanic regression tests
        id: mechanic_tests
        if: steps.source_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsx --test src/services/commander-direct-support-v15.test.ts src/services/commander-strategy-affinity-v15.test.ts src/services/upgrade-cut-pressure-v15.test.ts src/services/refinement-acceptance-v15.test.ts 2>&1 | tee scions-mechanic-tests.log

      - name: "Run Scions & Spellcraft restricted precon refinement"
        id: scions_control
        if: steps.source_build.outcome == 'success' && steps.mechanic_tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsx scripts/e2e-scions-spellcraft-ff-only-v15.ts 2>&1 | tee scions-control.log

      - name: Upload Scions validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scions-spellcraft-ff-only-${{ github.sha }}
          path: |
            scions-spellcraft-ff-only-result.json
            scions-spellcraft-candidate-audit.json
            scions-spellcraft-ff-only-raw-result.json
            scions-spellcraft-stock-deck.txt
            scions-spellcraft-refined-deck.txt
            scions-spellcraft-ff-only-failure.txt
            scions-source-build.log
            scions-mechanic-tests.log
            scions-control.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist isolated Scions validation evidence
        if: always() && github.event_name == 'push'
        env:
          BUILD_OUTCOME: ${{ steps.source_build.outcome }}
          MECHANIC_TEST_OUTCOME: ${{ steps.mechanic_tests.outcome }}
          CONTROL_OUTCOME: ${{ steps.scions_control.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p test-results/scions-spellcraft-ff-only
            rm -f test-results/scions-spellcraft-ff-only/result.json \
                  test-results/scions-spellcraft-ff-only/candidate-audit.json \
                  test-results/scions-spellcraft-ff-only/raw-result.json \
                  test-results/scions-spellcraft-ff-only/stock-deck.txt \
                  test-results/scions-spellcraft-ff-only/refined-deck.txt \
                  test-results/scions-spellcraft-ff-only/failure.txt \
                  test-results/scions-spellcraft-ff-only/build.log \
                  test-results/scions-spellcraft-ff-only/mechanic-tests.log \
                  test-results/scions-spellcraft-ff-only/control.log
            [ ! -f scions-spellcraft-ff-only-result.json ] || cp scions-spellcraft-ff-only-result.json test-results/scions-spellcraft-ff-only/result.json
            [ ! -f scions-spellcraft-candidate-audit.json ] || cp scions-spellcraft-candidate-audit.json test-results/scions-spellcraft-ff-only/candidate-audit.json
            [ ! -f scions-spellcraft-ff-only-raw-result.json ] || cp scions-spellcraft-ff-only-raw-result.json test-results/scions-spellcraft-ff-only/raw-result.json
            [ ! -f scions-spellcraft-stock-deck.txt ] || cp scions-spellcraft-stock-deck.txt test-results/scions-spellcraft-ff-only/stock-deck.txt
            [ ! -f scions-spellcraft-refined-deck.txt ] || cp scions-spellcraft-refined-deck.txt test-results/scions-spellcraft-ff-only/refined-deck.txt
            [ ! -f scions-spellcraft-ff-only-failure.txt ] || cp scions-spellcraft-ff-only-failure.txt test-results/scions-spellcraft-ff-only/failure.txt
            [ ! -f scions-source-build.log ] || cp scions-source-build.log test-results/scions-spellcraft-ff-only/build.log
            [ ! -f scions-mechanic-tests.log ] || cp scions-mechanic-tests.log test-results/scions-spellcraft-ff-only/mechanic-tests.log
            [ ! -f scions-control.log ] || cp scions-control.log test-results/scions-spellcraft-ff-only/control.log
            printf 'source_sha=%s\nbuild_outcome=%s\nmechanic_test_outcome=%s\ncontrol_outcome=%s\npolicy=scions-spellcraft-final-fantasy-no-new-infinite\ntarget_bracket=4\nstrategy=yshtola-spells-control-drain\n' \
              "$GITHUB_SHA" "$BUILD_OUTCOME" "$MECHANIC_TEST_OUTCOME" "$CONTROL_OUTCOME" \
              > test-results/scions-spellcraft-ff-only/run-metadata.txt
            npm run validation:index
            git add -- test-results/scions-spellcraft-ff-only validation-index.json docs/VALIDATION-STATE.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "test-results: persist current-source Scions FF-only validation [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Scions FF-only evidence persistence attempt ${attempt} lost a branch race; retrying against the latest head."
          done
          echo 'Scions FF-only evidence persistence exhausted eight branch-race retries.' >&2
          exit 1

      - name: Require Scions validation success
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.source_build.outcome }}
          MECHANIC_TEST_OUTCOME: ${{ steps.mechanic_tests.outcome }}
          CONTROL_OUTCOME: ${{ steps.scions_control.outcome }}
        run: |
          test "$BUILD_OUTCOME" = success
          test "$MECHANIC_TEST_OUTCOME" = success
          test "$CONTROL_OUTCOME" = success
# INTEL-02-FAMILY-BATCH-2026-09-04: frozen-source trigger
