name: Marvel + Middle-earth Full Family Bracket 5
on:
  push:
    branches: ["agent/v15-native-deck-intelligence"]
    paths:
      - "scripts/apply-themed-special-presets-from-audit.py"
      - ".github/workflows/marvel-middle-earth-full-family-bracket5.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: full-themed-family-b5-${{ github.ref }}
  cancel-in-progress: true
env:
  HTTP_RETRY_BASE_MS: 5000
  HTTP_RETRY_MAX_MS: 15000
  SCRYFALL_HTTP_RETRY_ATTEMPTS: 5
  SCRYFALL_MIN_REQUEST_GAP_MS: 750
  COMMANDER_SPELLBOOK_HTTP_RETRY_ATTEMPTS: 5
jobs:
  test-full-families:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - name: Resolve exact official promo / Secret Lair printings
        run: npx tsx scripts/audit-marvel-middle-earth-special-printings-v15.ts
      - name: Apply test-only curated family presets
        run: python3 scripts/apply-themed-special-presets-from-audit.py
      - name: Raise benchmark package ceiling and use Middle-earth family policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/e2e-marvel-bracket5-v15.ts')
          t = p.read_text()
          t = t.replace('maxWinPackageCards: 3,', 'maxWinPackageCards: 4,')
          p.write_text(t)

          p = Path('scripts/e2e-middle-earth-bracket5-expanded-v15.ts')
          t = p.read_text()
          t = t.replace("resolvePrintingPolicyV08({ allowedSets: [...SETS], includePromos: true, includeSpecialReleases: true })", "resolvePrintingPolicyV08({ printingFamily: 'Middle-earth', includePromos: true, includeSpecialReleases: true })")
          t = t.replace('allowedSets: [...SETS],', "printingFamily: 'Middle-earth',")
          t = t.replace('maxWinPackageCards: 3,', 'maxWinPackageCards: 4,')
          p.write_text(t)
          PY
      - name: Type-check and build patched policy
        run: npm run build
      - name: Run full unit suite under patched policy
        run: npm test
      - name: Run Marvel full-family Bracket 5 build
        id: marvel_build
        continue-on-error: true
        run: npx tsx scripts/e2e-marvel-bracket5-v15.ts
      - name: Refine Marvel full-family winner
        id: marvel_refine
        if: steps.marvel_build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p test-results/marvel-bracket5
          cp marvel-bracket5-selected-deck.txt test-results/marvel-bracket5/selected-deck.txt
          npx tsx scripts/e2e-marvel-bracket5-refine-v15.ts
      - name: Run Middle-earth full-family Bracket 5 build + refinement
        id: middle_build
        continue-on-error: true
        run: npx tsx scripts/e2e-middle-earth-bracket5-expanded-v15.ts
      - name: Persist full-family results
        if: always()
        env:
          MARVEL_BUILD: ${{ steps.marvel_build.outcome }}
          MARVEL_REFINE: ${{ steps.marvel_refine.outcome }}
          MIDDLE_BUILD: ${{ steps.middle_build.outcome }}
        run: |
          set -euo pipefail
          mkdir -p test-results/full-themed-family-b5
          rm -f test-results/full-themed-family-b5/*
          [ ! -f themed-special-printing-audit.json ] || cp themed-special-printing-audit.json test-results/full-themed-family-b5/special-printing-audit.json
          [ ! -f marvel-bracket5-live-result.json ] || cp marvel-bracket5-live-result.json test-results/full-themed-family-b5/marvel-result.json
          [ ! -f marvel-bracket5-selected-deck.txt ] || cp marvel-bracket5-selected-deck.txt test-results/full-themed-family-b5/marvel-selected-deck.txt
          [ ! -f marvel-bracket5-refine-result.json ] || cp marvel-bracket5-refine-result.json test-results/full-themed-family-b5/marvel-refine-result.json
          [ ! -f marvel-bracket5-refined-deck.txt ] || cp marvel-bracket5-refined-deck.txt test-results/full-themed-family-b5/marvel-refined-deck.txt
          [ ! -f middle-earth-bracket5-expanded-result.json ] || cp middle-earth-bracket5-expanded-result.json test-results/full-themed-family-b5/middle-earth-result.json
          [ ! -f middle-earth-bracket5-expanded-selected-deck.txt ] || cp middle-earth-bracket5-expanded-selected-deck.txt test-results/full-themed-family-b5/middle-earth-selected-deck.txt
          [ ! -f middle-earth-bracket5-expanded-refined-deck.txt ] || cp middle-earth-bracket5-expanded-refined-deck.txt test-results/full-themed-family-b5/middle-earth-refined-deck.txt
          printf 'source_sha=%s\nmarvel_build=%s\nmarvel_refine=%s\nmiddle_build=%s\n' "$GITHUB_SHA" "$MARVEL_BUILD" "$MARVEL_REFINE" "$MIDDLE_BUILD" > test-results/full-themed-family-b5/run-metadata.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test-results/full-themed-family-b5
          if ! git diff --cached --quiet; then git commit -m "test-results: persist full themed-family Bracket 5 controls" && git push origin "HEAD:${GITHUB_REF_NAME}"; fi
      - name: Require both family controls
        if: always()
        env:
          MARVEL_BUILD: ${{ steps.marvel_build.outcome }}
          MARVEL_REFINE: ${{ steps.marvel_refine.outcome }}
          MIDDLE_BUILD: ${{ steps.middle_build.outcome }}
        run: |
          test "$MARVEL_BUILD" = "success"
          test "$MARVEL_REFINE" = "success"
          test "$MIDDLE_BUILD" = "success"
